 → féminin: blanche."}],"tip":"Féminin: on ajoute -e (petit → petite, gentil → gentille, blanc → blanche). Pluriel: on ajoute -s (bleu → bleus)."},{"title":"Grammaire: Les nationalités","passage":"Rappel — garçon : italien, français, japonais, allemand · fille : italienne, française, japonaise, allemande.","questions":[{"id":"fr6q13","text":"🇯🇵 Il habite au Japon. Il est ___","options":["japonais","japonaise"],"answer":"A"},{"id":"fr6q14","text":"🇮🇹 Elle habite en Italie. Elle est ___","options":["italien","italienne"],"answer":"B"},{"id":"fr6q15","text":"🇫🇷 Il habite en France. Il est ___","options":["français","française"],"answer":"A"},{"id":"fr6q16","text":"🇩🇪 Elle habite en Allemagne. Elle est ___","options":["allemand","allemande"],"answer":"B"}],"tip":"Garçon (il): italien, français, japonais, allemand. Fille (elle): italienne, française, japonaise, allemande."},{"title":"Grammaire: Le pluriel des noms","passage":"Rappel — -eau → -eaux (un gâteau → des gâteaux) · -al → -aux (un journal → des journaux) · les noms en -s ne changent pas (une souris → des souris) · les autres noms : on ajoute -s.","questions":[{"id":"fr6q17","text":"un oiseau → des ___","options":["oiseaux","oiseaus"],"answer":"A","why":"oiseau → -eau devient -eaux: oiseaux."},{"id":"fr6q18","text":"un journal → des ___","options":["journals","journaux"],"answer":"B","why":"journal → -al devient -aux: journaux."},{"id":"fr6q19","text":"une souris → des ___","options":["souris","sourises"],"answer":"A","why":"souris finit par -s: il ne change pas."},{"id":"fr6q20","text":"un gâteau → des ___","options":["gâteaus","gâteaux"],"answer":"B","why":"gâteau → -eau devient -eaux: gâteaux."}],"tip":"-eau → -eaux, -al → -aux, les noms en -s ne changent pas, sinon on ajoute -s."},{"title":"Grammaire: La position des adjectifs","passage":"Rappel — AVANT le nom : les adjectifs courts (un beau livre, une belle fleur, un petit chat). APRÈS le nom : les couleurs et les nationalités (une voiture rouge, un garçon italien).","questions":[{"id":"fr6q21","text":"🍃 Choisis la bonne phrase :","options":["une feuille verte","une verte feuille"],"answer":"A"},{"id":"fr6q22","text":"🛞 Choisis la bonne phrase :","options":["un noir pneu","un pneu noir"],"answer":"B"},{"id":"fr6q23","text":"🌸 Choisis la bonne phrase :","options":["une belle fleur","une fleur belle"],"answer":"A"},{"id":"fr6q24","text":"🚗 Choisis la bonne phrase :","options":["une rouge voiture","une voiture rouge"],"answer":"B"}],"tip":"Les couleurs vont APRÈS le nom (une feuille verte). Les adjectifs courts comme beau/belle vont AVANT (une belle fleur)."},{"title":"Vocabulaire: Les parties du corps","passage":"Rappel — les cheveux, les yeux, le nez, la bouche, l'oreille, la main, le bras, la jambe, le pied.","questions":[{"id":"fr6q25","text":"① Le haut de la tête (hair) :","options":["le nez","les cheveux","le bras"],"answer":"B"},{"id":"fr6q26","text":"② Au milieu du visage (nose) :","options":["le nez","la bouche","l'oreille"],"answer":"A"},{"id":"fr6q27","text":"③ Au bout du bras (hand) :","options":["le coude","la jambe","la main"],"answer":"C"},{"id":"fr6q28","text":"④ En bas de la jambe (foot) :","options":["le pied","le genou","la jambe"],"answer":"A"}],"tip":"Les cheveux = hair, le nez = nose, la main = hand, le pied = foot."},{"title":"Expression écrite: Ma carte d'identité","passage":"","questions":[{"id":"fr6w1","type":"writing","text":"Complète ta carte d'identité en français : Je m'appelle … / J'ai … ans / Je suis (un garçon / une fille) / Ma nationalité … / J'habite à …"}]}]},{"id":"ex_sci6_mid1","title":"Grade 6 Science – Mid-Term Worksheet","subject":"Science","teacher":"Sara Elewa","assignedTo":["aleen"],"createdAt":"2026-10-28T14:40:00.000Z","sections":[{"title":"Q1: Scientific terms","passage":"","questions":[{"id":"s6q1","text":"Write the scientific term: A huge ball of burning gases that releases energy.","options":["Desublimation","Planet","Star","Evaporation"],"answer":"C","why":"«Star»: A huge ball of burning gases that releases energy."},{"id":"s6q2","text":"Write the scientific term: The system that consists of the sun and the planets.","options":["Astronomical unit","Freezing","Moon","Solar system"],"answer":"D","why":"«Solar system»: The system that consists of the sun and the planets."},{"id":"s6q3","text":"Write the scientific term: A large round body of rocks or gases that moves around the sun.","options":["Desublimation","Chemical bond","Planet","Moon"],"answer":"C","why":"«Planet»: A large round body of rocks or gases that moves around the sun."},{"id":"s6q4","text":"Write the scientific term: A unit used to measure the distances outside the solar system.","options":["Moon","Planet","Evaporation","Light year"],"answer":"D","why":"«Light year»: A unit used to measure the distances outside the solar system."},{"id":"s6q5","text":"Write the scientific term: A unit used to measure the distance inside the solar system.","options":["Evaporation","Compound","Astronomical unit","Solar system"],"answer":"C","why":"«Astronomical unit»: A unit used to measure the distance inside the solar system."},{"id":"s6q6","text":"Write the scientific term: A molecule with more than one type of atoms.","options":["Solar system","Melting","Condensation","Compound"],"answer":"D","why":"«Compound»: A molecule with more than one type of atoms."},{"id":"s6q7","text":"Write the scientific term: A solid material with atoms that are arranged in a certain shape.","options":["Desublimation","Evaporation","Planet","Crystal"],"answer":"D","why":"«Crystal»: A solid material with atoms that are arranged in a certain shape."},{"id":"s6q8","text":"Write the scientific term: An attraction between atoms or molecules.","options":["Chemical bond","Solar system","Light year","Evaporation"],"answer":"A","why":"«Chemical bond»: An attraction between atoms or molecules."},{"id":"s6q9","text":"Write the scientific term: Changing of matter from the solid state to the liquid state.","options":["Melting","Solar system","Desublimation","Moon"],"answer":"A","why":"«Melting»: Changing of matter from the solid state to the liquid state."},{"id":"s6q10","text":"Write the scientific term: Changing of matter from the solid state to the gas state.","options":["Astronomical unit","Planet","Sublimation","Moon"],"answer":"C","why":"«Sublimation»: Changing of matter from the solid state to the gas state."},{"id":"s6q11","text":"Write the scientific term: Changing of matter from the liquid state to the solid state.","options":["Freezing","Astronomical unit","Moon","Crystal"],"answer":"A","why":"«Freezing»: Changing of matter from the liquid state to the solid state."},{"id":"s6q12","text":"Write the scientific term: Changing of matter from the liquid state to the gas state.","options":["Desublimation","Evaporation","Chemical bond","Freezing"],"answer":"B","why":"«Evaporation»: Changing of matter from the liquid state to the gas state."},{"id":"s6q13","text":"Write the scientific term: Changing of matter from the gas state to the liquid state.","options":["Condensation","Freezing","Desublimation","Chemical bond"],"answer":"A","why":"«Condensation»: Changing of matter from the gas state to the liquid state."},{"id":"s6q14","text":"Write the scientific term: Changing of matter from the gas state to the solid state.","options":["Light year","Evaporation","Star","Desublimation"],"answer":"D","why":"«Desublimation»: Changing of matter from the gas state to the solid state."}],"tip":"Scientific terms: learn each definition with its term."},{"title":"Q2: Choose the correct answer","passage":"","questions":[{"id":"s6q15","text":"The solar system formed from a large cloud of gas and dust called a ______.","options":["galaxy","nebula","comet","crater"],"answer":"B","why":"A nebula is the cloud of gas and dust that formed the solar system."},{"id":"s6q16","text":"According to the nebular hypothesis, why did the material begin to gather together?","options":["Gravity","Sound","Electricity from Earth","Ocean currents"],"answer":"A","why":"Gravity pulled the gas and dust together."},{"id":"s6q17","text":"Which material was more likely to remain solid close to the young Sun?","options":["Rock and metal","Ice only","Water vapor only","Hydrogen only"],"answer":"A","why":"Close to the hot young Sun only rock and metal stayed solid; ice melted."},{"id":"s6q18","text":"What is an asteroid?","options":["A large star","A rocky object orbiting the Sun","A moon of Earth","A cloud of gas"],"answer":"B","why":"An asteroid is a rocky object that orbits the Sun."},{"id":"s6q19","text":"Which unit is most appropriate for measuring the distance between planets?","options":["Millimeter","Astronomical unit","Gram","Celsius"],"answer":"B","why":"Astronomical units measure distances inside the solar system."},{"id":"s6q20","text":"What causes day and night on Earth?","options":["Earth's rotation","Earth's revolution","The Moon's rotation","Moon revolution"],"answer":"A","why":"Earth spins (rotates) on its axis → day and night."},{"id":"s6q21","text":"Which Earth layer is the thinnest, solid outer layer of Earth?","options":["Outer core","Mantle","Crust","Inner core only"],"answer":"C","why":"The crust is the thin, solid outer layer of Earth."},{"id":"s6q22","text":"Which of these is a natural resource?","options":["wood from a tree","nylon rope","plastic bottle","synthetic rubber"],"answer":"A","why":"Wood comes from nature; nylon, plastic and synthetic rubber are man-made."},{"id":"s6q23","text":"Which material is usually synthetic?","options":["cotton","wool","polyester","stone"],"answer":"C","why":"Polyester is man-made (synthetic); cotton, wool and stone are natural."},{"id":"s6q24","text":"Which is a renewable resource?","options":["coal","sunlight","petroleum","natural gas"],"answer":"B","why":"Sunlight is renewable; coal, petroleum and natural gas run out."},{"id":"s6q25","text":"The amount of mass in a given volume is called:","options":["volume","conductivity","density","flexibility"],"answer":"C","why":"Density = mass ÷ volume."},{"id":"s6q26","text":"Sugar dissolving in water demonstrates:","options":["solubility","magnetism","hardness","texture"],"answer":"A","why":"Sugar dissolving shows solubility."},{"id":"s6q27","text":"Which material is a good electrical conductor?","options":["rubber","dry wood","copper","plastic"],"answer":"C","why":"Copper (a metal) conducts electricity well."},{"id":"s6q28","text":"All matter is made of tiny particles called:","options":["cells only","particles such as atoms and molecules","light rays","sound waves"],"answer":"B","why":"Matter is made of atoms and molecules."},{"id":"s6q29","text":"An atom is:","options":["a tiny building block of matter","a type of energy","a liquid","a mixture of substances"],"answer":"A","why":"An atom is the tiny building block of matter."},{"id":"s6q30","text":"A molecule forms when:","options":["materials disappear","two or more atoms bond together","a solid melts","a liquid freezes"],"answer":"B","why":"A molecule forms when two or more atoms bond together."},{"id":"s6q31","text":"In a pure substance, particles are:","options":["always different kinds mixed randomly","the same type of particle","not moving at all","only found in gases"],"answer":"B","why":"A pure substance has only one type of particle."},{"id":"s6q32","text":"Which state has a definite shape and a definite volume?","options":["solid","liquid","gas","all fluids"],"answer":"A","why":"Solids have a definite shape and volume."},{"id":"s6q33","text":"A liquid:","options":["has a fixed shape","takes the shape of its container","cannot flow","has no volume"],"answer":"B","why":"Liquids take the shape of their container but keep their volume."},{"id":"s6q34","text":"Gas particles are generally:","options":["packed tightly in fixed positions","close together and sliding past one another","far apart and moving freely","not moving"],"answer":"C","why":"Gas particles are far apart and move freely."},{"id":"s6q35","text":"The change from a solid to a liquid is called:","options":["freezing","condensation","melting","evaporation"],"answer":"C","why":"Solid → liquid is melting."},{"id":"s6q36","text":"The change from a solid to a gas is called:","options":["condensation","melting","sublimation","freezing"],"answer":"C","why":"Solid → gas is sublimation."}],"tip":"Review the lesson notes on the solar system, Earth’s layers, resources, properties of matter and states of matter."},{"title":"Q3: Short answers","passage":"","questions":[{"id":"s6q37","text":"Why can Earth support life better than most other planets?","options":["It contains oxygen in its atmosphere and freshwater","It is the biggest planet","It is the closest planet to the Sun","It has the most moons"],"answer":"A","why":"Earth has oxygen in its atmosphere and fresh water, so it can support life."},{"id":"s6q38","text":"What is rotation?","options":["Spinning of an object around its axis","An object moving around another object","Melting of ice","The pull of gravity"],"answer":"A","why":"Rotation = spinning around its own axis."},{"id":"s6q39","text":"What is revolution?","options":["Spinning of an object around its axis","An object moving around another object","A change of state","A type of rock"],"answer":"B","why":"Revolution = moving around another object."},{"id":"s6q40","text":"Which pair lists two renewable resources?","options":["Sunlight and wind","Coal and oil","Natural gas and coal","Oil and natural gas"],"answer":"A","why":"Sunlight, wind and water are renewable."},{"id":"s6q41","text":"Which pair lists two non-renewable resources?","options":["Sunlight and water","Wind and sunlight","Natural gas and coal","Water and wind"],"answer":"C","why":"Natural gas, oil and coal are non-renewable."},{"id":"s6q42","text":"Which pair lists two natural materials?","options":["plastic and steel","wood and copper","paper and plastic","steel and paper"],"answer":"B","why":"Wood, copper and gold are natural materials."},{"id":"s6q43","text":"Which pair lists two synthetic materials?","options":["wood and gold","copper and wood","plastic and steel","gold and copper"],"answer":"C","why":"Plastic, paper and steel are synthetic (man-made)."},{"id":"s6q44","text":"What is mass?","options":["The amount of matter in an object","The amount of space an object takes up","The weight of water","The speed of an object"],"answer":"A","why":"Mass is the amount of matter."},{"id":"s6q45","text":"What is volume?","options":["The amount of matter in an object","The amount of space taken by matter","The temperature of an object","The hardness of an object"],"answer":"B","why":"Volume is the amount of space taken by matter."},{"id":"s6q46","text":"A block has a mass of 60 g and a volume of 20 cm³. What is its density?","options":["3 g/cm³","40 g/cm³","80 g/cm³","1200 g/cm³"],"answer":"A","why":"D = M ÷ V = 60 ÷ 20 = 3 g/cm³."},{"id":"s6q47","text":"Why are metals used for cooking pans, while plastic or wood are used for handles?","options":["Metals conduct heat; plastic and wood do not","Metals are lighter than wood","Plastic melts faster than metal","Wood conducts heat better than metal"],"answer":"A","why":"Metals conduct heat; plastic and wood do not, so handles stay cool."}],"tip":"Short-answer tip: remember the model answers from the worksheet."},{"title":"Q4: Match the term","passage":"","questions":[{"id":"s6q48","text":"A special quality or characteristic of something:","options":["Atom","Flammability","Property","Pure substance"],"answer":"C"},{"id":"s6q49","text":"Matter that always has the same composition:","options":["Atom","Flammability","Property","Pure substance"],"answer":"D"},{"id":"s6q50","text":"The basic unit of any matter:","options":["Atom","Flammability","Property","Pure substance"],"answer":"A"},{"id":"s6q51","text":"The ability of a type of matter to burn easily:","options":["Atom","Flammability","Property","Pure substance"],"answer":"B"}],"tip":"Atom = basic unit of matter; Flammability = ability to burn; Property = a special quality; Pure substance = always the same composition."},{"title":"Q5: Complete","passage":"","questions":[{"id":"s6q52","text":"Water is a ______ molecule because it has positive and negative sides.","options":["Chemical formula","Gas","Surface tension","Polar"],"answer":"D"},{"id":"s6q53","text":"An insect can walk on a pond because of the ______ of water.","options":["Gas","Surface tension","Compound","Liquid"],"answer":"B"},{"id":"s6q54","text":"A diamond and graphite are from the same element, that is ______.","options":["Element","Gas","Liquid","Carbon"],"answer":"D"},{"id":"s6q55","text":"H₂O is a ______ for water.","options":["Solid","Liquid","Gas","Chemical formula"],"answer":"D"},{"id":"s6q56","text":"Oxygen is an ______ found in compound insulin.","options":["Chemical formula","Polar","Element","Gas"],"answer":"C"},{"id":"s6q57","text":"Oxygen is an element found in ______ insulin.","options":["Carbon","Solid","Compound","Element"],"answer":"C"},{"id":"s6q58","text":"The substance that has fixed volume and takes the shape of a container is a ______.","options":["Liquid","Solid","Carbon","Element"],"answer":"A"},{"id":"s6q59","text":"The substance that has a fixed shape and volume is a ______.","options":["Polar","Atom","Solid","Surface tension"],"answer":"C"},{"id":"s6q60","text":"The substance that doesn't have a fixed shape or volume is a ______.","options":["Gas","Solid","Polar","Surface tension"],"answer":"A"}],"tip":"Polar (positive and negative sides), surface tension, carbon, chemical formula, element, compound, liquid, solid, gas."},{"title":"Q6: Physical or chemical property?","passage":"","questions":[{"id":"s6q61","text":"Sodium has a silvery-white color. This is a…","options":["Physical property","Chemical property"],"answer":"A","why":"Colour is a physical property."},{"id":"s6q62","text":"Sodium is easy to cut with a knife. This is a…","options":["Physical property","Chemical property"],"answer":"A","why":"Being easy to cut (softness) is a physical property."},{"id":"s6q63","text":"Sodium is solid at room temperature. This is a…","options":["Physical property","Chemical property"],"answer":"A","why":"Being solid at room temperature is a physical property (state)."},{"id":"s6q64","text":"Sodium burns with an orange flame. This is a…","options":["Physical property","Chemical property"],"answer":"B","why":"Burning is a chemical change → chemical property."},{"id":"s6q65","text":"Sodium becomes coated with a white substance when exposed to air. This is a…","options":["Physical property","Chemical property"],"answer":"B","why":"Reacting with air to form a new white substance is a chemical property."}],"tip":"Physical properties can be seen or measured without changing the substance (colour, hardness, state). Chemical properties appear when the substance changes into something new (burning, reacting with air)."},{"title":"Q7: Chemical formulas","passage":"","questions":[{"id":"s6q66","text":"Chemical formula of water:","options":["H₂O","CO₂","NH₃","CH₄"],"answer":"A"},{"id":"s6q67","text":"Number of atoms in a water molecule (H₂O):","options":["2","3","4","5"],"answer":"B"},{"id":"s6q68","text":"Chemical formula of ammonia:","options":["H₂O","NH₃","CO₂","CH₄"],"answer":"B"},{"id":"s6q69","text":"Number of atoms in an ammonia molecule (NH₃):","options":["3","4","5","2"],"answer":"B"},{"id":"s6q70","text":"Chemical formula of carbon dioxide:","options":["CO","CO₂","C₂O","CH₄"],"answer":"B"},{"id":"s6q71","text":"Number of atoms in a carbon dioxide molecule (CO₂):","options":["2","3","4","5"],"answer":"B"},{"id":"s6q72","text":"Chemical formula of methane:","options":["CH₄","NH₃","CO₂","H₂O"],"answer":"A"},{"id":"s6q73","text":"Number of atoms in a methane molecule (CH₄):","options":["3","4","5","6"],"answer":"C"}],"tip":"Count every atom in the formula: H₂O = 2 H + 1 O = 3; NH₃ = 1 N + 3 H = 4; CO₂ = 1 C + 2 O = 3; CH₄ = 1 C + 4 H = 5."}]},{"id":"ex_sci4_mid1","title":"Grade 4 Science – Midterm Sheet (October)","subject":"Science","teacher":"Mohamed Khair","assignedTo":["mansour"],"createdAt":"2026-10-28T14:40:00.000Z","sections":[{"title":"Q1: Choose the correct answer","passage":"","questions":[{"id":"s4q1","text":"People who invent and design products to help us are called:","options":["Doctors","Engineers","Teachers"],"answer":"B","why":"Engineers invent and design products to help us."},{"id":"s4q2","text":"Engineering is the process of using science and math to find solutions to:","options":["Games","Problems","Stories"],"answer":"B","why":"Engineering uses science and math to solve problems."},{"id":"s4q3","text":"Which engineer oversees the construction of roads, bridges, and skyscrapers?","options":["Civil engineer","Medical engineer","Mechanical engineer"],"answer":"A","why":"Civil engineers build roads, bridges and skyscrapers."},{"id":"s4q4","text":"Medical engineers develop devices to help:","options":["Build roads","Doctors diagnose and treat diseases","Design cars"],"answer":"B","why":"Medical engineers make devices that help doctors diagnose and treat diseases."},{"id":"s4q5","text":"Mechanical engineers study materials, heat, and:","options":["Plants","Energy","Animals"],"answer":"B","why":"Mechanical engineers study materials, heat and energy."},{"id":"s4q6","text":"What do medical engineers use to perform surgery?","options":["Lasers and robots","Hammers and nails","Telescopes"],"answer":"A","why":"Medical engineers use lasers and robots in surgery."},{"id":"s4q7","text":"Scientists use a microscope to see things that are:","options":["Very large","Far away in space","Too small to see with bare eyes"],"answer":"C","why":"A microscope shows things too small to see with bare eyes."},{"id":"s4q8","text":"Which tool helps scientists take pictures of planets and stars?","options":["Microscope","Hubble Telescope","Clock"],"answer":"B","why":"The Hubble Telescope takes pictures of planets and stars."},{"id":"s4q9","text":"Which scientist discovered that electricity causes quartz crystal to vibrate?","options":["Pierre Curie","Doug Engelbart","Bill English"],"answer":"A","why":"Pierre Curie discovered that electricity makes quartz vibrate."},{"id":"s4q10","text":"Engineers designed watches using quartz crystals to keep:","options":["Temperature","Time","Distance"],"answer":"B","why":"Quartz watches keep time."},{"id":"s4q11","text":"An electronic whiteboard in class is an example of technology in:","options":["Space","Learning","Medicine"],"answer":"B","why":"A whiteboard in class is technology used for learning."},{"id":"s4q12","text":"A satellite orbits around a planet or a:","options":["Star","Bridge","Building"],"answer":"A","why":"Satellites orbit planets or stars."},{"id":"s4q13","text":"What is the Moon?","options":["An artificial satellite","A natural satellite","A robot"],"answer":"B","why":"The Moon is a natural satellite of Earth."},{"id":"s4q14","text":"Satellites help scientists collect data about:","options":["Weather and land masses","Bridges and buildings","Human heart"],"answer":"A","why":"Satellites collect data about weather and land."},{"id":"s4q15","text":"What system uses satellites to help in navigation?","options":["X-ray","GPS","Laser"],"answer":"B","why":"GPS uses satellites for navigation."},{"id":"s4q16","text":"What do engineers use to launch satellites into space?","options":["Rockets","Cars","Trains"],"answer":"A","why":"Rockets launch satellites into space."},{"id":"s4q17","text":"To \"design\" means to:","options":["Buy products","Make or draw plans to build something","Destroy tools"],"answer":"B","why":"To design means to make or draw plans to build something."},{"id":"s4q18","text":"What is the first step in the design process?","options":["Build a prototype","Test the prototype","Identify a problem"],"answer":"C","why":"The first step is to identify a problem."},{"id":"s4q19","text":"After identifying a problem, engineers do:","options":["Research","Redesign","Final test"],"answer":"A","why":"After identifying a problem, engineers do research."},{"id":"s4q20","text":"Who invented the computer mouse?","options":["Pierre Curie","Doug Engelbart","Warren Morrison"],"answer":"B","why":"Doug Engelbart invented the computer mouse."},{"id":"s4q21","text":"The first version of a test model built by engineers is called a:","options":["Graph","Prototype","Table"],"answer":"B","why":"A prototype is the first test model."},{"id":"s4q22","text":"The first computer mouse was made of:","options":["Plastic","Wood","Glass"],"answer":"B","why":"The first computer mouse was made of wood."},{"id":"s4q23","text":"Why do engineers test a prototype?","options":["To see if it meets the needs","To sell it immediately","To throw it away"],"answer":"A","why":"Engineers test a prototype to see if it meets the needs."},{"id":"s4q24","text":"To share test results, engineers use tables and:","options":["Toys","Graphs","Stories"],"answer":"B","why":"Results are shared using tables and graphs."},{"id":"s4q25","text":"Communicating results helps engineers find solutions to:","options":["Math homework","Problems with a design","Daily meals"],"answer":"B","why":"Sharing results helps find problems with a design."},{"id":"s4q26","text":"When engineers evaluate user reports, they may need to:","options":["Stop working","Redesign the prototype","Hide the design"],"answer":"B","why":"User reports may lead to redesigning the prototype."},{"id":"s4q27","text":"Engineers choose the best solution that costs less money and is:","options":["Dangerous","Safe to use","Very heavy"],"answer":"B","why":"The best solution costs less and is safe to use."},{"id":"s4q28","text":"Which tool is used to measure the length of a small object like a mouse?","options":["Ruler","Thermometer","Scale"],"answer":"A","why":"A ruler measures the length of small objects."},{"id":"s4q29","text":"Whiteboards enable teachers to show photos, maps, and:","options":["Food","Videos","Clothes"],"answer":"B","why":"Whiteboards show photos, maps and videos."},{"id":"s4q30","text":"Engineering is the process of using science and math to solve:","options":["Problems","Games","Letters"],"answer":"A","why":"Engineering solves problems."}],"tip":"Review: engineers solve problems; civil = roads and bridges; medical = devices for doctors; mechanical = materials, heat and energy; design process = identify a problem → research → prototype → test → share results."},{"title":"Q2: Complete the sentences","passage":"","questions":[{"id":"s4q31","text":"______ engineers oversee the construction of highways and bridges.","options":["natural","Civil","prototype","mouse"],"answer":"B"},{"id":"s4q32","text":"______ engineers design X-rays, lasers, and robots for doctors.","options":["natural","Hubble Telescope","Medical","Civil"],"answer":"C"},{"id":"s4q33","text":"The ______ helps scientists see objects that are too small to see with bare eyes.","options":["microscope","prototype","Medical","mouse"],"answer":"A"},{"id":"s4q34","text":"The ______ helps scientists take accurate pictures of space.","options":["natural","Hubble Telescope","mouse","Civil"],"answer":"B"},{"id":"s4q35","text":"The Moon is a ______ satellite orbiting Earth.","options":["natural","graphs","Hubble Telescope","prototype"],"answer":"A"},{"id":"s4q36","text":"A ______ is the first working version of a solution built by engineers.","options":["mouse","Hubble Telescope","prototype","Medical"],"answer":"C"},{"id":"s4q37","text":"Engineers collect data and represent it using tables and ______.","options":["Hubble Telescope","graphs","microscope","Medical"],"answer":"B"},{"id":"s4q38","text":"Doug Engelbart invented the computer ______.","options":["graphs","mouse","Medical","prototype"],"answer":"B"},{"id":"s4q39","text":"Engineers use science and math to find solutions to ______.","options":["graphs","problems","Hubble Telescope","prototype"],"answer":"B"}],"tip":"Use the word bank: Civil, Medical, microscope, Hubble Telescope, natural, prototype, graphs, mouse, problems."},{"title":"Q3: Match","passage":"","questions":[{"id":"s4q40","text":"Match: GPS","options":["Uses satellites for navigation","Helps scientists see small things","First test model of a design","Takes photos of stars and galaxies"],"answer":"A"},{"id":"s4q41","text":"Match: Microscope","options":["Helps scientists see small things","First test model of a design","Takes photos of stars and galaxies","Designs machines and tools"],"answer":"A"},{"id":"s4q42","text":"Match: Prototype","options":["First test model of a design","Takes photos of stars and galaxies","Designs machines and tools","Helps scientists see small things"],"answer":"A"},{"id":"s4q43","text":"Match: Mechanical Engineer","options":["Takes photos of stars and galaxies","Uses satellites for navigation","Helps scientists see small things","Designs machines and tools"],"answer":"D"},{"id":"s4q44","text":"Match: Hubble Telescope","options":["First test model of a design","Takes photos of stars and galaxies","Designs machines and tools","Uses satellites for navigation"],"answer":"B"}],"tip":"GPS → navigation; microscope → small things; prototype → first test model; mechanical engineer → machines and tools; Hubble Telescope → photos of stars."},{"title":"Q4: True or False","passage":"","questions":[{"id":"s4q45","text":"Civil engineers oversee the construction of highways, bridges, and skyscrapers.","options":["True ✓","False ✗"],"answer":"A","why":"Civil engineers do build highways, bridges and skyscrapers."},{"id":"s4q46","text":"The Moon is an artificial satellite created by engineers.","options":["True ✓","False ✗"],"answer":"B","why":"The Moon is a natural satellite, not artificial."},{"id":"s4q47","text":"Medical engineers use lasers and robots to help doctors perform surgery.","options":["True ✓","False ✗"],"answer":"A","why":"Medical engineers do use lasers and robots in surgery."},{"id":"s4q48","text":"Scientists use a telescope to see things that are too small to see with bare eyes.","options":["True ✓","False ✗"],"answer":"B","why":"A microscope (not a telescope) shows very small things."},{"id":"s4q49","text":"Doug Engelbart invented the computer mouse.","options":["True ✓","False ✗"],"answer":"A","why":"Doug Engelbart did invent the computer mouse."},{"id":"s4q50","text":"A prototype is the final product sold in stores.","options":["True ✓","False ✗"],"answer":"B","why":"A prototype is the first test model, not the final product."},{"id":"s4q51","text":"Engineers share their test results using tables and graphs.","options":["True ✓","False ✗"],"answer":"A","why":"Engineers do share results with tables and graphs."}],"tip":"True/False tip: one wrong word makes the whole sentence false (e.g. the Moon is natural, not artificial; a prototype is a test model, not the final product)."},{"title":"Q5: Short answers","passage":"","questions":[{"id":"s4q52","text":"Which two tools help scientists in learning or research?","options":["Microscope and Hubble Telescope","Hammer and nails","Toys and food"],"answer":"A"},{"id":"s4q53","text":"Why do engineers share their test results with others?","options":["To find problems with the design, get feedback, and improve it so the final product is safe and works well","To sell the prototype immediately","To hide the design from other engineers"],"answer":"A"}],"tip":"Microscope and Hubble Telescope are tools for research. Engineers share results to get feedback and improve the design."}]},{"id":"ex_math4_mid1","title":"Grade 4 Math – Mid-Term Revision Sheet","subject":"Math","teacher":"","assignedTo":["mansour"],"createdAt":"2026-10-28T16:30:00.000Z","sections":[{"title":"I. Place value & number forms","tip":"Place value = the position of the digit (ones, tens, hundreds, thousands…). Value = the digit × its place (the 8 in 5,621,834 is in the hundreds place, so its value is 800).","questions":[{"id":"m4q1","text":"The place value of the digit 8 in the number 5,621,834 is …","options":["tens","hundreds","thousands","hundred thousand"],"answer":"B","why":"Counting from the right: 4 ones, 3 tens, 8 hundreds."},{"id":"m4q2","text":"The place value of the digit 1 in the number 5,162,834 is …","options":["tens","hundreds","thousands","hundred thousand"],"answer":"D","why":"5,162,834 → 5 millions, 1 hundred thousand, 6 ten thousands…"},{"id":"m4q3","text":"What is the place value of the 3 in 73,429?","options":["Hundred Thousands","Ten Thousands","Thousands","Hundreds"],"answer":"C","why":"73,429 → 7 ten thousands, 3 thousands, 4 hundreds, 2 tens, 9 ones."},{"id":"m4q4","text":"What is the value of the 9 in 4,923,547?","options":["9","90,000","900,000","9,000,000"],"answer":"C","why":"The 9 is in the hundred thousands place: 9 × 100,000 = 900,000."},{"id":"m4q5","text":"What is the value of 7 in the number 638,972?","options":["7","70","700","7000"],"answer":"B","why":"The 7 is in the tens place: 7 × 10 = 70."},{"id":"m4q6","text":"The number 8,200,407 in expanded form = …","options":["80,000,000 + 2,000,000 + 400 + 70","8,000,000 + 2,000 + 400 + 7","8,000,000 + 200,000 + 400 + 7","8,000,000 + 200,000 + 400 + 70"],"answer":"C","why":"8 millions + 2 hundred thousands + 4 hundreds + 7 ones."},{"id":"m4q7","text":"6 million + 2 hundred thousand + 5 ten thousands + 9 hundred =","options":["6,250,900","6259","625,900","620,050,900"],"answer":"A","why":"6,000,000 + 200,000 + 50,000 + 900 = 6,250,900."},{"id":"m4q8","text":"300,000 + 50,000 + 9,000 + 70 + 1 =","options":["350,971","35971","359,071","359,710"],"answer":"C","why":"Write each value in its place: 3 5 9 , 0 7 1 (no hundreds → 0)."},{"id":"m4q9","text":"One million, two hundred seventy thousand, six hundred thirty-three =","options":["1,276,330","1,270,633","127,633","1,027,633"],"answer":"B","why":"1 million | 270 thousand | 633 → 1,270,633."},{"id":"m4q10","text":"Eighty million, four hundred twenty-four thousand, nineteen =","options":["80,424,090","84,219","8,042,419","80,424,019"],"answer":"D","why":"80 million | 424 thousand | 019 → 80,424,019."},{"id":"m4q11","text":"The number 6,100,907 in expanded form = …","options":["60,000,000 + 1,000,000 + 900 + 70","6,000,000 + 1,000 + 900 + 7","6,000,000 + 100,000 + 900 + 7","6,000,000 + 100,000 + 900 + 70"],"answer":"C","why":"6 millions + 1 hundred thousand + 9 hundreds + 7 ones."},{"id":"m4q12","text":"The standard form of 6,000,000 + 20,000 + 300 + 70 + 8 is …","options":["60,002,378","62,378","602,378","6,020,378"],"answer":"D","why":"6 millions, 0 hundred thousands, 2 ten thousands, 0 thousands, 378 → 6,020,378."},{"id":"m4q13","text":"The standard form of 60,000,000 + 2,000 + 300 + 70 + 8 is …","options":["60,002,378","62,378","602,378","6,020,378"],"answer":"A","why":"60 millions, then 2 thousands and 378 → 60,002,378."},{"id":"m4q14","text":"The value of the digit 8 in the number 9,080,134 is …","options":["80","8000","80,000","8"],"answer":"C","why":"The 8 is in the ten thousands place: 8 × 10,000 = 80,000."},{"id":"m4q15","text":"The value of the digit 9 in the number 9,080,134 is …","options":["90","9,000,000","90,000","9"],"answer":"B","why":"The 9 is in the millions place: 9,000,000."},{"id":"m4q16","text":"506,000 = ……… thousands","options":["506","5,060","50,600","6"],"answer":"A","why":"506,000 ÷ 1,000 = 506 thousands."},{"id":"m4q17","text":"26,000 = ……… hundreds","options":["26","260","2,600","26,000"],"answer":"B","why":"26,000 ÷ 100 = 260 hundreds."}]},{"title":"I. Compare, round, add & subtract","tip":"Compare digits from the left. Rounding: look at the digit to the right of the rounding place; 5 or more → round up, 4 or less → round down.","questions":[{"id":"m4q18","text":"746,239 ……… 749,052","options":["<",">","=","none of them"],"answer":"A","why":"Same hundred thousands and ten thousands; thousands: 6 < 9, so 746,239 < 749,052."},{"id":"m4q19","text":"156,239 ……… 149,052","options":["<",">","=","none of them"],"answer":"B","why":"Ten thousands: 5 > 4, so 156,239 > 149,052."},{"id":"m4q20","text":"What is 749,012 rounded to the nearest 100,000?","options":["750,000","800,000","700,000","749,012"],"answer":"C","why":"The ten-thousands digit is 4 (less than 5) → round down to 700,000."},{"id":"m4q21","text":"What is 749,012 rounded to the nearest million?","options":["749,012","1,000,000","700,000","0"],"answer":"B","why":"The hundred-thousands digit is 7 (5 or more) → round up to 1,000,000."},{"id":"m4q22","text":"What is 129,057 rounded to the nearest ten thousand?","options":["120,000","130,000","129,000","129,060"],"answer":"B","why":"The thousands digit is 9 → round up: 130,000."},{"id":"m4q23","text":"What is 749,012 rounded to the nearest 10,000?","options":["750,000","800,000","700,000","749,012"],"answer":"A","why":"The thousands digit is 9 → round up: 750,000."},{"id":"m4q24","text":"82,124 − 99 =","options":["82,025","82,000","72,124","99"],"answer":"A","why":"82,124 − 100 = 82,024, then add 1 back → 82,025."},{"id":"m4q25","text":"99,124 − 99 =","options":["98,025","124","98,124","99,025"],"answer":"D","why":"99,124 − 100 = 99,024, then + 1 → 99,025."},{"id":"m4q26","text":"The sum of 8,024 + 999 =","options":["8,024,999","8,923","9,023","9,024"],"answer":"C","why":"8,024 + 1,000 = 9,024, then − 1 → 9,023."},{"id":"m4q27","text":"The sum of 6,024 + 999 =","options":["6,024,999","6,923","7,023","7,024"],"answer":"C","why":"6,024 + 1,000 = 7,024, then − 1 → 7,023."},{"id":"m4q28","text":"Estimate the difference 948 − 297 to the nearest hundred =","options":["680","700","800","600"],"answer":"D","why":"948 ≈ 900 and 297 ≈ 300 → 900 − 300 = 600."},{"id":"m4q29","text":"Estimate the difference 978 − 297 to the nearest hundred =","options":["680","700","800","600"],"answer":"B","why":"978 ≈ 1,000 and 297 ≈ 300 → 1,000 − 300 = 700."},{"id":"m4q30","text":"Estimate the sum 998 + 297 to the nearest ten =","options":["1,300","900","1,000","300"],"answer":"A","why":"998 ≈ 1,000 and 297 ≈ 300 → 1,000 + 300 = 1,300."}]},{"title":"I. Factors, primes & patterns","tip":"A prime number has exactly two factors (1 and itself). A composite number has more than two factors. A pattern follows a rule; each item is a term.","questions":[{"id":"m4q31","text":"Which list contains all prime numbers?","options":["1, 2, 3, 5","2, 5, 13, 39","2, 3, 5, 7","2, 5, 13, 66"],"answer":"C","why":"1 is not prime; 39 = 3 × 13 and 66 are composite. 2, 3, 5, 7 are all prime."},{"id":"m4q32","text":"Which factor of 24 is missing? 1, 2, 3, 4, 6, ………, 12, 24","options":["7","8","9","10"],"answer":"B","why":"24 ÷ 8 = 3, so 8 is a factor of 24."},{"id":"m4q33","text":"Which multiple of 6 is missing? 6, 12, ………, 24, 30","options":["4","16","14","18"],"answer":"D","why":"Count by 6: 6, 12, 18, 24, 30."},{"id":"m4q34","text":"A ……… is a number that has more than two factors.","options":["composite number","prime number","pattern","multiple"],"answer":"A"},{"id":"m4q35","text":"A ……… is a number that has two factors only: 1 and itself.","options":["composite number","prime number","pattern","multiple"],"answer":"B"},{"id":"m4q36","text":"A ……… is a list of figures, symbols, or numbers that follow a certain rule.","options":["composite number","prime number","pattern","multiple"],"answer":"C"},{"id":"m4q37","text":"Each number in a numerical pattern is a ………","options":["term","sequence","pattern","multiple"],"answer":"A"},{"id":"m4q38","text":"A ……… is the ordered arrangement of the terms that make a pattern.","options":["term","sequence","pattern","multiple"],"answer":"B"},{"id":"m4q39","text":"The next figure in the pattern: ▽ □ ○ ▽ □ ○ ▽ ………","options":["○ circle","□ square","△ triangle","▷ triangle"],"answer":"B","why":"The rule repeats ▽ □ ○; after ▽ comes □."},{"id":"m4q40","text":"The next figure in the pattern: □ □ △ □ □ ………","options":["○ circle","□ square","△ triangle","▷ triangle"],"answer":"C","why":"The rule repeats □ □ △; after □ □ comes △."},{"id":"m4q41","text":"The next figure in the pattern: △ ○ □ △ ○ □ △ ………","options":["○ circle","□ square","△ triangle","▭ rectangle"],"answer":"A","why":"The rule repeats △ ○ □; after △ comes ○."}]},{"title":"II. Compare with >, < or =","tip":"First compare the number of digits, then compare digit by digit from the left.","questions":[{"id":"m4q42","text":"993,249 ……… 1,003,225","options":["<",">","="],"answer":"A","why":"1,003,225 has 7 digits, 993,249 has 6."},{"id":"m4q43","text":"562,501 ……… 526,105","options":["<",">","="],"answer":"B","why":"Ten thousands: 6 > 2."},{"id":"m4q44","text":"671 thousand ……… 671,000","options":["<",">","="],"answer":"C","why":"671 thousand = 671,000."},{"id":"m4q45","text":"753,249 ……… 1,753,249","options":["<",">","="],"answer":"A","why":"1,753,249 has more digits."},{"id":"m4q46","text":"562,501 ……… 256,105","options":["<",">","="],"answer":"B","why":"Hundred thousands: 5 > 2."},{"id":"m4q47","text":"518 hundred ……… 518,000","options":["<",">","="],"answer":"A","why":"518 hundred = 51,800, which is less than 518,000."},{"id":"m4q48","text":"3 million, 18 thousand ……… 2 million, 999 thousand, 514","options":["<",">","="],"answer":"B","why":"3,018,000 > 2,999,514 (3 million is more than 2 million)."},{"id":"m4q49","text":"1,572,430 ……… 157,243","options":["<",">","="],"answer":"B","why":"1,572,430 has 7 digits, 157,243 has 6."},{"id":"m4q50","text":"4,390,208 ……… 4,390,028","options":["<",">","="],"answer":"B","why":"Hundreds: 2 > 0."},{"id":"m4q51","text":"529,321 ……… 946,521","options":["<",">","="],"answer":"A","why":"Hundred thousands: 5 < 9."},{"id":"m4q52","text":"274,539 ……… 274,509","options":["<",">","="],"answer":"B","why":"Tens: 3 > 0."},{"id":"m4q53","text":"8,534,251 ……… 8,257,314","options":["<",">","="],"answer":"B","why":"Hundred thousands: 5 > 2."},{"id":"m4q54","text":"370 tens ……… 37 thousands","options":["<",">","="],"answer":"A","why":"370 tens = 3,700; 37 thousands = 37,000."}]},{"title":"III & IV. Add and subtract","tip":"Line up the digits by place value and work from the ones column; regroup when needed.","questions":[{"id":"m4q55","text":"56,349 + 32,065 =","options":["88,414","88,304","88,404","89,414"],"answer":"A","why":"9+5=14 (write 4, carry 1), 4+6+1=11, 3+0+1=4, 6+2=8, 5+3=8 → 88,414."},{"id":"m4q56","text":"708,324 + 351,742 =","options":["1,060,066","1,059,066","1,060,166","959,066"],"answer":"A","why":"324+742=1,066 and 708,000+351,000=1,059,000 → 1,060,066."},{"id":"m4q57","text":"1,708,324 + 351,742 =","options":["2,060,066","2,059,066","1,060,066","2,160,066"],"answer":"A","why":"Same as above plus 1,000,000 → 2,060,066."},{"id":"m4q58","text":"48,249 − 22,066 =","options":["26,183","26,283","26,173","25,183"],"answer":"A","why":"9−6=3, 4−6 needs regrouping: 14−6=8, 1−0=1, 8−2=6, 4−2=2 → 26,183."},{"id":"m4q59","text":"879,775 − 371,641 =","options":["508,134","508,234","507,134","508,144"],"answer":"A","why":"Subtract column by column: 5−1=4, 7−4=3, 7−6=1, 9−1=8, 7−7=0, 8−3=5 → 508,134."},{"id":"m4q60","text":"830,569 − 37,062 =","options":["793,507","793,407","803,507","793,517"],"answer":"A","why":"830,569 − 37,062: regroup in the ten thousands → 793,507."}]},{"title":"V. Order numbers","tip":"Least to greatest = smallest first. Compare the number of digits first, then the leftmost digits.","questions":[{"id":"m4q61","text":"Order from LEAST to greatest: 3,804,127 · 308,412 · 3,048,159 · 3,408,159","options":["308,412 · 3,048,159 · 3,408,159 · 3,804,127","3,048,159 · 308,412 · 3,408,159 · 3,804,127","308,412 · 3,408,159 · 3,048,159 · 3,804,127","3,804,127 · 3,408,159 · 3,048,159 · 308,412"],"answer":"A","why":"308,412 has only 6 digits (smallest); then compare hundred thousands: 0 < 4 < 8."},{"id":"m4q62","text":"Order from LEAST to greatest: 804,007 · 3,000,090 · 3,000,009 · 308,700","options":["308,700 · 804,007 · 3,000,009 · 3,000,090","804,007 · 308,700 · 3,000,009 · 3,000,090","308,700 · 804,007 · 3,000,090 · 3,000,009","3,000,009 · 3,000,090 · 308,700 · 804,007"],"answer":"A","why":"6-digit numbers first (308,700 < 804,007); then 3,000,009 < 3,000,090 (tens: 0 < 9)."},{"id":"m4q63","text":"Order from GREATEST to least: 577,859 · 567,895 · 577,589 · 1,567,985","options":["1,567,985 · 577,859 · 577,589 · 567,895","1,567,985 · 577,589 · 577,859 · 567,895","577,859 · 1,567,985 · 577,589 · 567,895","1,567,985 · 567,895 · 577,859 · 577,589"],"answer":"A","why":"7-digit number is greatest; then 577,859 > 577,589 (hundreds: 8 > 5) > 567,895."},{"id":"m4q64","text":"Order from GREATEST to least: 5,084,127 · 508,412 · 5,840,159 · 5,408,159","options":["5,840,159 · 5,408,159 · 5,084,127 · 508,412","5,840,159 · 5,084,127 · 5,408,159 · 508,412","5,408,159 · 5,840,159 · 5,084,127 · 508,412","508,412 · 5,084,127 · 5,408,159 · 5,840,159"],"answer":"A","why":"Compare hundred thousands: 8 > 4 > 0; the 6-digit number is last."}]},{"title":"VI. Problem solving","tip":"Read the question twice: 'in all' or 'how many now' → add; 'how many more' → subtract.","questions":[{"id":"m4q65","text":"Aaron’s telephone number is 7345981. Write it in word form.","options":["seven million, three hundred forty-five thousand, nine hundred eighty-one","seventy-three million, forty-five thousand, nine hundred eighty-one","seven hundred thirty-four thousand, five hundred ninety-eight","seven million, three hundred forty-five, nine hundred eighty-one"],"answer":"A","why":"7,345,981 → 7 million | 345 thousand | 981."},{"id":"m4q66","text":"Adam drove 38,497 miles this year and 21,503 miles last year. How many miles did Adam drive in all?","options":["60,000","59,000","16,994","60,100"],"answer":"A","why":"'In all' → add: 38,497 + 21,503 = 60,000."},{"id":"m4q67","text":"Walid drove 789 miles one day and 246 miles the day after. How many MORE miles did Walid drive on the first day?","options":["1,035","543","453","553"],"answer":"B","why":"'How many more' → subtract: 789 − 246 = 543."},{"id":"m4q68","text":"Leo had 2,164 stamps. His friend Casey gave him 3,754 stamps. How many stamps does Leo have now?","options":["5,918","1,590","5,818","5,928"],"answer":"A","why":"'Have now' after receiving → add: 2,164 + 3,754 = 5,918."}]}]},{"id":"ex_math6_mid1","title":"Grade 6 Math – First Mid-Term Revision (Ch 0–3)","subject":"Math","teacher":"Sifana Siddiq","assignedTo":["aleen"],"createdAt":"2026-10-30T11:12:00.000Z","sections":[{"title":"I. Choose the correct option","tip":"Review the vocabulary of Ch. 0–3: factors, angles, coordinate plane, volume, decimals, fractions and ratios.","questions":[{"id":"m6q1","text":"In a multiplication problem, what are the numbers being multiplied called?","options":["Sums","Differences","Factors","Quotients"],"answer":"C","why":"The numbers multiplied together are factors; the result is the product."},{"id":"m6q2","text":"If you multiply any whole number by zero, what is the product always?","options":["One","The same number","Zero","Ten"],"answer":"C","why":"Anything × 0 = 0."},{"id":"m6q3","text":"What do you call an angle that measures exactly 90 degrees?","options":["Acute angle","Right angle","Obtuse angle","Straight angle"],"answer":"B","why":"A right angle is exactly 90°."},{"id":"m6q4","text":"An angle that measures less than 90 degrees is called what?","options":["Acute angle","Right angle","Obtuse angle","Straight angle"],"answer":"A","why":"Acute = less than 90°; obtuse = more than 90°; straight = 180°."},{"id":"m6q5","text":"On a coordinate plane, what is the horizontal number line called?","options":["Y-axis","X-axis","Origin","Quadrant"],"answer":"B","why":"The x-axis goes left–right (horizontal); the y-axis goes up–down."},{"id":"m6q6","text":"Volume is the measure of the amount of space occupied by what kind of figure?","options":["Two-dimensional flat shape","Three-dimensional solid figure","A straight line","A single point"],"answer":"B","why":"Volume is for 3-D solids (length × width × height)."},{"id":"m6q7","text":"Which of the following is a standard unit used to measure volume?","options":["Square centimeters","Cubic units","Linear inches","Degrees"],"answer":"B","why":"Volume is measured in cubic units (cm³, in³, m³)."},{"id":"m6q8","text":"If you multiply a decimal number by a power of ten like 100, which way does the decimal point move?","options":["To the left","To the right","It does not move","Upwards"],"answer":"B","why":"× 100 moves the decimal point 2 places to the right (the number gets bigger)."},{"id":"m6q9","text":"In a fraction, what does the denominator at the bottom represent?","options":["The number of parts being taken or shaded","The total number of equal parts in the whole","The remainder of a division problem","The decimal equivalent"],"answer":"B","why":"Denominator = how many equal parts the whole is divided into."},{"id":"m6q10","text":"What do you call a fraction where the numerator is smaller than the denominator?","options":["Improper fraction","Mixed number","Proper fraction","Whole number"],"answer":"C","why":"Proper fraction: top < bottom (e.g. 3/5)."},{"id":"m6q11","text":"A theater has 126 seats. So far 100 tickets have been sold. What is the ratio of unsold tickets to total seats?","options":["126:26","26:126","26 to 100","100 to 126"],"answer":"B","why":"Unsold = 126 − 100 = 26 → unsold : total = 26 : 126."},{"id":"m6q12","text":"At a library, 27 books, 17 videos, and 8 magazines are checked out in one day. What is the ratio of books to total items?","options":["27/52","25:27","8:27","26 to 52"],"answer":"A","why":"Total = 27 + 17 + 8 = 52 → books : total = 27/52."},{"id":"m6q13","text":"Which ratio is equivalent to 36:52?","options":["3:12","72 to 156","9:13","3/4"],"answer":"C","why":"Divide both by 4: 36 ÷ 4 = 9, 52 ÷ 4 = 13 → 9:13."},{"id":"m6q14","text":"Salma has 4 onions, 5 lemons, and 6 potatoes. What is the ratio of potatoes to onions?","options":["4:5","four to six","6/4","six to five"],"answer":"C","why":"Potatoes : onions = 6 : 4 = 6/4 (order matters)."},{"id":"m6q15","text":"A bus has 28 seats. Ten seats are empty. What is the ratio of empty seats to the total number of seats?","options":["28:10","18:10","10 to 28","10/18"],"answer":"C","why":"Empty : total = 10 : 28."}]},{"title":"II-A. Enter each ratio","tip":"Part-to-part compares two groups; part-to-whole compares one group to the total. Keep the order given in the question.","questions":[{"id":"m6q16","text":"3 weasels, 7 toads. Part to Part (weasels to toads):","options":["3:7","7:3","3:10","10:7"],"answer":"A"},{"id":"m6q17","text":"3 weasels, 7 toads. Part to Whole (weasels to animals):","options":["3:7","3:10","10:3","7:10"],"answer":"B","why":"Whole = 3 + 7 = 10 animals."},{"id":"m6q18","text":"3 weasels, 7 toads. Whole to Part (animals to toads):","options":["7:10","3:10","10:7","10:3"],"answer":"C"},{"id":"m6q19","text":"12 toads, 13 weasels. Part to Part (weasels to toads):","options":["12:13","13:12","13:25","25:12"],"answer":"B"},{"id":"m6q20","text":"12 toads, 13 weasels. Part to Whole (weasels to animals):","options":["13:12","12:25","13:25","25:13"],"answer":"C","why":"Whole = 12 + 13 = 25."},{"id":"m6q21","text":"12 toads, 13 weasels. Whole to Part (animals to toads):","options":["25:12","12:25","25:13","13:25"],"answer":"A"},{"id":"m6q22","text":"25 roses: 4 are white, 8 are red, the rest are pink. Red to Pink:","options":["8:4","8:13","13:8","8:25"],"answer":"B","why":"Pink = 25 − (4 + 8) = 13 → red : pink = 8 : 13."},{"id":"m6q23","text":"25 roses: 4 white, 8 red, the rest pink. Pink to Whole:","options":["13:25","25:13","12:25","13:12"],"answer":"A"},{"id":"m6q24","text":"25 roses: 4 white, 8 red, the rest pink. Whole to Pink:","options":["13:25","25:12","25:13","12:25"],"answer":"C"},{"id":"m6q25","text":"100 roses: 44 are red, 30 are pink, the rest are white. Red, Pink, and White to Whole:","options":["74:100","100:100","26:100","74:26"],"answer":"B","why":"All three colours together = the whole → 100 : 100."},{"id":"m6q26","text":"100 roses: 44 red, 30 pink, the rest white. White to Whole:","options":["26:100","100:26","74:100","30:100"],"answer":"A","why":"White = 100 − (44 + 30) = 26."},{"id":"m6q27","text":"100 roses: 44 red, 30 pink, the rest white. Whole to White:","options":["26:100","100:74","100:26","100:44"],"answer":"C"}]},{"title":"II-B & C. Equivalent ratios","tip":"Equivalent ratios: multiply or divide BOTH parts by the same number.","questions":[{"id":"m6q28","text":"For every 3 ibises the birdwatcher sees 5 sunbirds. What is the ratio of ibises to birds?","options":["3:5","5:3","3:8","5:8"],"answer":"C","why":"Birds = 3 + 5 = 8 → ibises : birds = 3 : 8."},{"id":"m6q29","text":"Ibises to sunbirds is 3:5. Complete the equivalent ratio 6 : ___","options":["8","10","9","15"],"answer":"B","why":"3 × 2 = 6, so 5 × 2 = 10."},{"id":"m6q30","text":"Ibises to sunbirds is 3:5. Complete the equivalent ratio 9 : ___","options":["12","10","15","18"],"answer":"C","why":"3 × 3 = 9, so 5 × 3 = 15."},{"id":"m6q31","text":"If the birdwatcher sees 25 sunbirds, how many ibises does she see?","options":["15","10","20","25"],"answer":"A","why":"25 ÷ 5 = 5, then 5 × 3 = 15 ibises."},{"id":"m6q32","text":"A mix of concrete uses 5 parts sand and 3 parts cement. Write the ratio of sand to concrete.","options":["5:3","3:5","5:8","8:5"],"answer":"C","why":"Concrete = 5 + 3 = 8 parts → sand : concrete = 5 : 8."},{"id":"m6q33","text":"Milan has 20 bags of sand (ratio sand : cement = 5 : 3). How many bags of cement will he use?","options":["20:8","20:12","20:15","20:3"],"answer":"B","why":"20 ÷ 5 = 4, then 4 × 3 = 12 bags of cement → 20 : 12."}]},{"title":"II-D. Use the graph (races won vs. lost)","passage":"The graph shows points at (5, 1), (10, 2), (15, 3) and (20, 4): for every 5 races won, the runner lost 1 race.","tip":"Read one point from the graph (5 wins, 1 loss) and multiply both numbers to find equivalent ratios.","questions":[{"id":"m6q34","text":"Complete the ratio of wins to losses: ___ : 1","options":["4","5","10","20"],"answer":"B","why":"The first point is (5 won, 1 lost) → 5 : 1."},{"id":"m6q35","text":"Complete the equivalent ratio: 5 : ___","options":["1","2","5","10"],"answer":"A"},{"id":"m6q36","text":"Complete the equivalent ratio: ___ : 2","options":["5","10","15","20"],"answer":"B","why":"5 × 2 = 10 wins for 2 losses."},{"id":"m6q37","text":"Complete the equivalent ratio: ___ : 3","options":["10","15","20","9"],"answer":"B","why":"5 × 3 = 15 wins for 3 losses."},{"id":"m6q38","text":"Complete the equivalent ratio: 20 : ___","options":["2","3","4","5"],"answer":"C","why":"20 ÷ 5 = 4 losses."},{"id":"m6q39","text":"If the runner won 10 races, how many did he lose?","options":["1","2","5","10"],"answer":"B","why":"10 ÷ 5 = 2 losses."}]},{"title":"II-E. Decimal sums and differences","tip":"Line up the decimal points, add zeros to fill empty places, then add or subtract.","questions":[{"id":"m6q40","text":"9.4 + 83.2 =","options":["92.6","92.4","93.6","91.6"],"answer":"A"},{"id":"m6q41","text":"65.329 − 42.49 =","options":["22.839","23.839","22.939","22.84"],"answer":"A","why":"65.329 − 42.490 = 22.839."},{"id":"m6q42","text":"17.42 + 3.067 =","options":["20.487","20.387","21.487","20.427"],"answer":"A","why":"17.420 + 3.067 = 20.487."},{"id":"m6q43","text":"192.022 − 148.347 =","options":["43.675","44.675","43.775","43.325"],"answer":"A"},{"id":"m6q44","text":"4.056 + 87.06 =","options":["91.116","91.016","92.116","91.126"],"answer":"A","why":"4.056 + 87.060 = 91.116."},{"id":"m6q45","text":"783.29 + 89.0054 =","options":["872.2954","872.3954","871.2954","872.2854"],"answer":"A","why":"783.2900 + 89.0054 = 872.2954."},{"id":"m6q46","text":"357.04 − 254.769 =","options":["102.271","102.371","103.271","102.281"],"answer":"A","why":"357.040 − 254.769 = 102.271."},{"id":"m6q47","text":"32.056 − 25.8407 =","options":["6.2153","6.3153","7.2153","6.2163"],"answer":"A","why":"32.0560 − 25.8407 = 6.2153."}]},{"title":"II-F. Decimal products","tip":"Multiply as whole numbers, then count the decimal places in both factors and put the point back.","questions":[{"id":"m6q48","text":"22 × 3.7 =","options":["81.4","80.4","8.14","814"],"answer":"A","why":"22 × 37 = 814; one decimal place → 81.4."},{"id":"m6q49","text":"5 × 2.562 =","options":["12.810","12.710","13.810","1.281"],"answer":"A","why":"5 × 2562 = 12810; three decimal places → 12.810."},{"id":"m6q50","text":"12.9 × 2.35 =","options":["30.315","30.215","31.315","3.0315"],"answer":"A","why":"129 × 235 = 30315; three decimal places → 30.315."},{"id":"m6q51","text":"6.88 × 7.32 =","options":["50.3616","50.2616","49.3616","503.616"],"answer":"A","why":"688 × 732 = 503616; four decimal places → 50.3616."}]},{"title":"II-G. Quotients and remainders","tip":"Long division: divide, multiply, subtract, bring down. The remainder must be smaller than the divisor.","questions":[{"id":"m6q52","text":"472 ÷ 8 =","options":["59","58","59 R4","69"],"answer":"A","why":"8 × 59 = 472 exactly."},{"id":"m6q53","text":"2,175 ÷ 29 =","options":["75","74","75 R5","85"],"answer":"A","why":"29 × 75 = 2,175 exactly."},{"id":"m6q54","text":"20,098 ÷ 54 =","options":["372 R10","372","371 R10","372 R18"],"answer":"A","why":"54 × 372 = 20,088; 20,098 − 20,088 = 10 → 372 R10."},{"id":"m6q55","text":"4,813 ÷ 332 =","options":["14 R165","14","15 R165","13 R165"],"answer":"A","why":"332 × 14 = 4,648; 4,813 − 4,648 = 165 → 14 R165."}]},{"title":"II-H & I. Multiply and divide fractions","tip":"Change mixed numbers to improper fractions. To divide, multiply by the reciprocal (flip the second fraction). Simplify at the end.","questions":[{"id":"m6q56","text":"3 2/3 × 6 × 7/12 = (simplest form)","options":["12 5/6","12 1/6","11 5/6","13 5/6"],"answer":"A","why":"11/3 × 6/1 × 7/12 = 77/6 = 12 5/6."},{"id":"m6q57","text":"7 × 3 3/7 × 5/14 = (simplest form)","options":["8 4/7","8 3/7","7 4/7","8 4/14"],"answer":"A","why":"7/1 × 24/7 × 5/14 = 120/14 = 60/7 = 8 4/7."},{"id":"m6q58","text":"1 1/5 × 1 1/6 × 1 2/7 = (simplest form)","options":["1 4/5","1 3/5","2 4/5","1 4/7"],"answer":"A","why":"6/5 × 7/6 × 9/7 = 9/5 = 1 4/5."},{"id":"m6q59","text":"8 2/5 ÷ 3 = (simplest form)","options":["2 4/5","2 2/5","25 1/5","3 4/5"],"answer":"A","why":"42/5 × 1/3 = 14/5 = 2 4/5."},{"id":"m6q60","text":"5/8 ÷ 15/22 = (simplest form)","options":["11/12","12/11","75/176","5/12"],"answer":"A","why":"5/8 × 22/15 = 110/120 = 11/12."},{"id":"m6q61","text":"4/7 ÷ 14 = (simplest form)","options":["2/49","4/98","8","1/49"],"answer":"A","why":"4/7 × 1/14 = 4/98 = 2/49."}]},{"title":"II-J. Volume of rectangular prisms","tip":"Volume = length × width × height. Change mixed numbers to improper fractions first.","questions":[{"id":"m6q62","text":"A rectangular prism measures 2 1/2 in × 5 in × 1 1/4 in. Its volume is …","options":["15 5/8 in³","15 1/8 in³","8 3/4 in³","16 5/8 in³"],"answer":"A","why":"5/2 × 5 × 5/4 = 125/8 = 15 5/8 in³."},{"id":"m6q63","text":"A rectangular prism measures 7 1/2 m × 4 1/2 m × 6 3/5 m. Its volume is …","options":["222 3/4 m³","222 1/4 m³","221 3/4 m³","18 3/5 m³"],"answer":"A","why":"15/2 × 9/2 × 33/5 = 4455/20 = 222 3/4 m³."}]},{"title":"II-K. Solve","tip":"'Of' means multiply (3/5 of 200 = 3/5 × 200). Work out each item's cost, then add.","questions":[{"id":"m6q64","text":"A bakery made 200 packages of dinner rolls. 3/5 of them were sold to restaurants. How many packages were sold to restaurants?","options":["120","80","60","150"],"answer":"A","why":"3/5 × 200 = 120."},{"id":"m6q65","text":"Of the 200 packages, how many were sold at the bakery?","options":["120","80","100","40"],"answer":"B","why":"200 − 120 = 80."},{"id":"m6q66","text":"Wes bought 2 notebooks for $1.79 each and 3 pens for $0.69 each. How much did he spend in all?","options":["$5.65","$2.48","$5.56","$4.96"],"answer":"A","why":"2 × 1.79 = 3.58; 3 × 0.69 = 2.07; 3.58 + 2.07 = $5.65."}]}]}],"results":[],"pdfs":["ex_ar4_term1","ex_fr4_mid1_2026","ex_fr6_mid1_2026","ex_g4_eng_midterm_2026","ex_g6_unit1_mid1","ex_math4_mid1","ex_math6_mid1","ex_sci4_mid1","ex_sci6_mid1"]}</script>
<div id="app" class="wrap"></div>
<div id="toastbox"></div>
<div id="modalbox"></div>
<script>
/* ---------- bootstrap ---------- */
const PRISTINE_BODY = document.body.innerHTML;   // captured before any render; the main script is the last element
const EMBEDDED = JSON.parse(document.getElementById('app-data').textContent);
const LS_RESULTS='kcs_results_v2', LS_LOCAL='kcs_localdata_v2', LS_SESSION='kcs_session_v2', SS_RUN='kcs_run_v2';
let DATA = structuredClone(EMBEDDED);
// Keep unpublished local edits only if they were made on top of THIS published version; a newer publish always wins.
try{ const loc=JSON.parse(localStorage.getItem(LS_LOCAL)||'null'); if(loc && loc.baseRev===(EMBEDDED.rev||0) && (loc.rev||0)>(DATA.rev||0)) DATA=loc; else if(loc) localStorage.removeItem(LS_LOCAL); }catch(e){}
let RESULTS = {};
(DATA.results||[]).forEach(r=>RESULTS[r.id]=r);
try{ JSON.parse(localStorage.getItem(LS_RESULTS)||'[]').forEach(r=>RESULTS[r.id]=r);}catch(e){}
let db=null, artifactCap=null, userCap=null, downloadsCap=null, dbWritable=null, capsReady=false;
let session=null; try{session=JSON.parse(localStorage.getItem(LS_SESSION)||'null')}catch(e){}
let view={name:'login'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const student=id=>DATA.settings.students.find(s=>s.id===id);
const first=s=>String(s||'').split(' ')[0];
const LT=(e,k)=>(e&&e.rtl?'أبجد':'ABCD')[k];
const hasPdf=e=>(DATA.pdfs||[]).includes(e.id);
const pdfLinks=(e,cls='sm ghost')=>hasPdf(e)?`<button class="${cls}" onclick="savePdf('${e.id}','key',this)">📄 Answer key PDF</button> <button class="${cls}" onclick="savePdf('${e.id}','student',this)">📝 Student PDF</button>`:'';
async function savePdf(id,kind,btn){
  const e=DATA.exams.find(x=>x.id===id); const path=`pdf/${id}_${kind}.pdf`; const fname=((e&&e.title)||id).replace(/[\\/:*?"<>|]+/g,' ').trim()+(kind==='key'?' - Answer Key':' - Student')+'.pdf';
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Preparing…';}
  try{
    if(downloadsCap){ const res=await fetch(path); if(!res.ok) throw new Error('PDF not found'); const blob=await res.blob(); await downloadsCap.save({filename:fname,data:blob}); toast('Saved ✅'); }
    else { const a=document.createElement('a'); a.href=path; a.target='_blank'; a.rel='noopener'; document.body.append(a); a.click(); a.remove(); }
  }catch(err){ if(err&&err.code==='declined') toast('Cancelled'); else toast('Could not save the PDF: '+(err&&err.message||err),3500); }
  finally{ if(btn){btn.disabled=false;btn.textContent=btn.dataset.t;} }
}
const examsFor=sid=>DATA.exams.filter(e=>e.assignedTo.includes(sid));
const allMcq=e=>e.sections.flatMap(s=>s.questions.filter(q=>q.type!=='writing'));
const resultsFor=sid=>Object.values(RESULTS).filter(r=>r.studentId===sid).sort((a,b)=>a.finishedAt<b.finishedAt?1:-1);
const pct=r=>r.total?Math.round(100*r.score/r.total):0;
const fmtDate=s=>{try{const d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){return s}};
const fmtDur=s=>s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s';
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toastbox').append(t);setTimeout(()=>t.remove(),ms)}
function saveLocalResults(){try{localStorage.setItem(LS_RESULTS,JSON.stringify(Object.values(RESULTS)))}catch(e){}}
function saveLocalData(){try{DATA.baseRev=EMBEDDED.rev||0;localStorage.setItem(LS_LOCAL,JSON.stringify(DATA))}catch(e){}}
function ask(title,text,okLabel,onOk,okClass='coral'){
  $('#modalbox').innerHTML=`<div class="modal" id="modal"><div class="card"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row" style="justify-content:flex-end;margin-top:.6rem"><button class="ghost" id="m-no">Cancel</button><button class="${okClass}" id="m-ok">${esc(okLabel)}</button></div></div></div>`;
  $('#m-no').onclick=()=>$('#modalbox').innerHTML=''; $('#m-ok').onclick=()=>{$('#modalbox').innerHTML='';onOk();};
}

/* ---------- backend (Vercel serverless + Blob) ---------- */
const API='/api'; let backend=false;
async function api(path,opts){ const r=await fetch(API+path,Object.assign({cache:'no-store'},opts||{})); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }
async function syncResults(){
  try{ const j=await api('/results'); let changed=false;
    (j.results||[]).forEach(r=>{ if(!RESULTS[r.id]||RESULTS[r.id].finishedAt!==r.finishedAt||!RESULTS[r.id]._synced){RESULTS[r.id]={...r,_synced:true};changed=true;} });
    if(changed){ saveLocalResults(); if(view.name==='admin'||view.name==='home') render(); }
    for(const r of Object.values(RESULTS)){ if(!r._synced){ await pushResult(r); } }
  }catch(e){}
}
(async()=>{
  try{ const j=await api('/data'); backend=!!j.ok;
    if(backend && j.data && (j.data.rev||0)>(DATA.rev||0)){ DATA=j.data; }
  }catch(e){ backend=false; }
  dbWritable=backend?true:null; db=backend?{}:null; artifactCap=backend?{}:null;
  if(backend){ await syncResults(); setInterval(syncResults,30000); }
  capsReady=true;
  if(view.name==='admin'||view.name==='home') render();
})();
async function pushResult(r){
  RESULTS[r.id]=r; saveLocalResults();
  if(backend){ try{ const c={...r}; delete c._synced; await api('/results',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(c)}); r._synced=true; saveLocalResults(); }catch(e){} }
}
async function publishData(){ // save exams + settings to the server so every device gets them
  saveLocalData();
  if(!backend){ toast('Saved on this device only (server storage is not set up yet — see README).',4200); return false; }
  const c=structuredClone(DATA); c.rev=(c.rev||0)+1; delete c.baseRev; c.results=[];
  try{ toast('Publishing…',1500); await api('/data',{method:'POST',headers:{'content-type':'application/json','x-admin-pass':DATA.settings.adminPass},body:JSON.stringify(c)}); DATA.rev=c.rev; try{localStorage.removeItem(LS_LOCAL)}catch(e){} return true; }
  catch(e){ toast('Could not publish: '+(e&&e.message||'error'),3600); return false; }
}
async function clearResultsServer(){ if(backend){ try{ await api('/results',{method:'DELETE',headers:{'x-admin-pass':DATA.settings.adminPass}}); }catch(e){} } }

/* ---------- motivational copy ---------- */
const CHEERS=['You’ve got this! 💪','Great focus! ⭐','Keep going, superstar! 🚀','Nice thinking! 🧠','One step at a time! 🐾','Brilliant effort! 🌟','You’re doing amazing! 🎈','Almost there! 🏁','Smart choice! 🦉','Champions keep trying! 🏆','Your brain is growing! 🌱','Wow, look at you go! 🎉'];
const QUOTES=['Every expert was once a beginner.','Mistakes are proof that you are trying.','Practice makes progress.','Believe in yourself and all that you are.','Small steps every day add up to big results.','The more you read, the more you know.','You are braver than you think and smarter than you know.','Today is a great day to learn something new.'];
function resultMsg(p,name){
  if(p>=90) return {badge:'🏆',stars:'⭐⭐⭐',title:'Outstanding, '+name+'!',text:'That was a champion performance. Your hard work really shows!'};
  if(p>=75) return {badge:'🌟',stars:'⭐⭐',title:'Great job, '+name+'!',text:'You know this really well. A little more practice and you’ll be unstoppable!'};
  if(p>=50) return {badge:'💪',stars:'⭐',title:'Good effort, '+name+'!',text:'You’re halfway to mastery. Check the answers below and try again. Every try makes you stronger.'};
  return {badge:'🌱',stars:'✨',title:'Keep growing, '+name+'!',text:'Mistakes are how we learn. Look at the answers, then give it another go. You can do it!'};
}
const dayQuote=()=>QUOTES[new Date().getDate()%QUOTES.length];

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  const map={login:renderLogin,home:renderHome,exam:renderExam,result:renderResult,admin:renderAdmin};
  try{ app.innerHTML=(map[view.name]||renderLogin)(); }catch(e){ console.error(e); toast('Something went wrong: '+(e&&e.message||e),4000); if(view.name!=='home'&&view.name!=='login'){view=session?(session.role==='admin'?{name:'admin',tab:'overview'}:{name:'home'}):{name:'login'}; app.innerHTML=(map[view.name]||renderLogin)();} }
  window.scrollTo({top:0});
}
function topbar(extra=''){
  return `<div class="topbar"><img class="logo" src="${DATA.settings.logo}" alt="Knowledge City Schools crest"><div class="school grow">Knowledge City Schools<small>Ali Family Practice Hub · v${DATA.rev||0}</small></div>${extra}</div>`;
}
/* login */
let pin='', pickedId=null;
function renderLogin(){
  const st=DATA.settings.students;
  return topbar()+`
  <div class="center" style="margin:1rem 0 .6rem"><h1><span class="bob">👋</span> Who’s practicing today?</h1><p class="muted">Tap your picture, then enter your PIN.</p></div>
  <div class="login-grid">
    ${st.map(s=>`<div class="who ${pickedId===s.id?'sel':''}" onclick="pick('${s.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')pick('${s.id}')"><img class="avatar" src="${s.avatar}" alt=""><div class="nm">${esc(first(s.name))}</div><div class="muted small">${esc(s.grade||'')}</div></div>`).join('')}
    <div class="who ${pickedId==='admin'?'sel':''}" onclick="pick('admin')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')pick('admin')"><div class="av-admin">👨‍⚕️</div><div class="nm">Dad</div><div class="muted small">Admin</div></div>
  </div>
  <div id="pinbox" class="card" ${pickedId?'':'hidden'}>
    <h3 class="center">${pickedId==='admin'?'Admin password':'Enter your PIN'}</h3>
    ${pickedId==='admin'
      ?`<input id="adminpw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()" style="margin:.6rem 0"><button style="width:100%" class="navy" onclick="adminLogin()">Open admin panel</button>`
      :`<div class="dots" id="dots">${[0,1,2,3].map(i=>`<span class="${i<pin.length?'on':''}"></span>`).join('')}</div>
        <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}<button onclick="pinKey('del')">⌫</button><button onclick="pinKey('0')">0</button><button class="go" onclick="pinKey('ok')">Go</button></div>`}
  </div>
  <p class="center muted small" style="margin-top:1.5rem">${esc(dayQuote())}</p>`;
}
function pick(id){pickedId=id;pin='';render();if(id==='admin')setTimeout(()=>$('#adminpw')?.focus(),50)}
function pinKey(k){
  if(k==='del')pin=pin.slice(0,-1); else if(k==='ok'){tryPin();return;} else if(pin.length<4)pin+=k;
  if(pin.length===4){tryPin();return;}
  const d=$('#dots'); if(d) d.innerHTML=[0,1,2,3].map(i=>`<span class="${i<pin.length?'on':''}"></span>`).join('');
}
function fail(msg){ const b=$('#pinbox'); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),450); pin=''; const d=$('#dots'); if(d)d.innerHTML=[0,1,2,3].map(()=>'<span></span>').join(''); toast(msg); }
function tryPin(){
  const s=student(pickedId);
  if(s && pin===s.pin){session={role:'student',id:s.id};try{localStorage.setItem(LS_SESSION,JSON.stringify(session))}catch(e){}view={name:'home'};render();}
  else fail('Oops, that PIN is not right. Try again 🙂');
}
function adminLogin(){
  if($('#adminpw').value===DATA.settings.adminPass){session={role:'admin'};try{localStorage.setItem(LS_SESSION,JSON.stringify(session))}catch(e){}view={name:'admin',tab:'overview'};render();}
  else fail('Wrong password');
}
function logout(){session=null;try{localStorage.removeItem(LS_SESSION)}catch(e){}pickedId=null;pin='';view={name:'login'};render();}

/* student home */
function renderHome(){
  const s=student(session.id); const ex=examsFor(s.id); const rs=resultsFor(s.id);
  const best=rs.length?Math.max(...rs.map(pct)):null;
  const streak=rs.filter(r=>pct(r)>=75).length;
  return topbar(`<button class="ghost sm" onclick="logout()">Log out</button>`)+`
  <div class="card hero">
    <div class="row"><img class="avatar big" src="${s.avatar}" alt=""><div class="grow"><h1>Hi ${esc(first(s.name))}! 🌈</h1><p style="opacity:.95">Ready for some practice? Every question makes you smarter.</p>
    <div class="row" style="gap:.4rem;margin-top:.3rem">${best!==null?`<span class="pill sun">Best ${best}%</span><span class="pill">${rs.length} attempt${rs.length===1?'':'s'}</span>`:'<span class="pill">First time here? Let’s go!</span>'}${streak?`<span class="pill">${streak} ⭐ great score${streak===1?'':'s'}</span>`:''}</div></div></div>
  </div>
  <div class="quote"><span class="ic">💡</span><span>${esc(dayQuote())}</span></div>
  <h2 style="margin:1.2rem 0 .3rem">Your exams 📝</h2>
  ${ex.length?ex.map(e=>{const mine=rs.filter(r=>r.examId===e.id);const last=mine[0];return `<div class="card"><div class="row"><div class="grow"><h3>${esc(e.title)}</h3><p class="muted small">${esc(e.subject||'')} · ${allMcq(e).length} questions${e.teacher?' · '+esc(e.teacher):''}</p>
   ${last?`<span class="pill ${pct(last)>=75?'mint':pct(last)>=50?'sun':'coral'}">Last: ${pct(last)}%</span> <span class="pill">${mine.length} tr${mine.length===1?'y':'ies'}</span>`:'<span class="pill grape">New!</span>'}</div>
   <button class="sun" onclick="startExam('${e.id}')">${last?'Try again':'Start'} 🚀</button></div>${hasPdf(e)?`<p class="small" style="margin:.5rem 0 0"><button class="sm ghost" onclick="savePdf('${e.id}','student',this)">📝 Printable version (PDF)</button></p>`:''}</div>`}).join('')
   :`<div class="card center"><div class="badge">🎒</div><p>No exams yet. Dad will add one soon!</p></div>`}
  ${rs.length?`<h2 style="margin:1.2rem 0 .3rem">Your progress 📈</h2><div class="card">${trendChart(rs)||'<p class="muted small center">Take one more exam to see your trend line.</p>'}<div class="tscroll"><table><thead><tr><th>Exam</th><th>Score</th><th>When</th><th></th></tr></thead><tbody>${rs.slice(0,12).map(r=>`<tr><td>${esc(r.examTitle)}</td><td><b>${pct(r)}%</b> <span class="muted small">(${r.score}/${r.total})</span></td><td class="muted small">${fmtDate(r.finishedAt)}</td><td><button class="sm ghost" onclick="openResult('${r.id}')">My answers 🔎</button></td></tr>`).join('')}</tbody></table></div>
  ${sendCodeBox(s.id)}</div>`:''}`;
}
function openResult(id){ const r=RESULTS[id]; if(!r){toast('Result not found');return;} view={name:'result',result:r}; render(); }
function sendCodeBox(sid){
  const mine=resultsFor(sid).filter(r=>!r._synced).slice(0,10);
  if(!capsReady || (db&&dbWritable!==false) || !mine.length) return '';
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(mine.map(r=>({id:r.id,examId:r.examId,examTitle:r.examTitle,studentId:r.studentId,score:r.score,total:r.total,finishedAt:r.finishedAt,durationSec:r.durationSec,sections:r.sections,wrong:r.wrong,answers:r.answers||{},writing:r.writing||''}))))));
  return `<div style="margin-top:1rem;padding-top:.8rem;border-top:2px dashed var(--line)"><p><b>Send your results to Dad 📨</b><br><span class="muted small">Results could not reach the server from this device, so tap WhatsApp (or copy the code) to send them to Dad.</span></p>
  <code class="codebox" id="rcode">${code}</code><div class="row" style="margin-top:.5rem"><a href="https://wa.me/?text=${encodeURIComponent('My practice results code: '+code)}" target="_blank" rel="noopener"><button class="sm mint">Send on WhatsApp</button></a><button class="sm ghost" onclick="copyCode()">Copy code</button></div></div>`;
}

/* exam taking */
let run=null;
function saveRun(){try{run?sessionStorage.setItem(SS_RUN,JSON.stringify({examId:run.exam.id,i:run.i,answers:run.answers,writing:run.writing,started:run.started})):sessionStorage.removeItem(SS_RUN)}catch(e){}}
function startExam(id,resume){
  const e=DATA.exams.find(x=>x.id===id); if(!e)return;
  const flat=[]; e.sections.forEach(s=>s.questions.forEach(q=>flat.push({...q,section:s.title,passage:s.passage||''})));
  run={exam:e,flat,i:0,answers:{},writing:'',started:Date.now(),cheer:''};
  if(resume){run.i=Math.min(resume.i||0,flat.length-1);run.answers=resume.answers||{};run.writing=resume.writing||'';run.started=resume.started||Date.now();}
  saveRun(); view={name:'exam'}; render();
}
function renderExam(){
  const {flat,i,answers}=run; const q=flat[i]; const n=flat.length;
  const done=Object.keys(answers).length+(run.writing.trim()?1:0);
  const rtl=run.exam.rtl?' dir="rtl"':'';
  return topbar(`<button class="ghost sm" onclick="exitExam()">Exit</button>`)+`
  <div class="card"${rtl}>
    <div class="row"><span class="pill sky">${esc(q.section)}</span><span class="grow muted" style="text-align:right;font-weight:800">Question ${i+1} of ${n}</span></div>
    <div class="progress"><i style="width:${Math.round(100*i/n)}%"></i></div>
    ${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}
    <div class="qtext">${esc(q.text)}</div>
    ${q.type==='writing'
      ?`<textarea id="wtxt" placeholder="Write your paragraph here… Remember: capital letters, full stops, and a complete thought!" oninput="run.writing=this.value;saveRun()">${esc(run.writing)}</textarea>`
      :q.options.map((o,k)=>{const L='ABCD'[k];return `<button class="opt ${answers[q.id]===L?'sel':''}" onclick="choose('${q.id}','${L}')"><span class="ltr">${LT(run.exam,k)}</span><span>${esc(o)}</span></button>`}).join('')}
    <div class="cheer" id="cheer">${esc(run.cheer)}</div>
    <div class="navq" dir="ltr"><button class="ghost" onclick="nav(-1)" ${i===0?'disabled':''}>← Back</button>
      ${i<n-1?`<button onclick="nav(1)">Next →</button>`:`<button class="mint" onclick="finish()">Finish ✅</button>`}</div>
    <p class="muted center small" style="margin-top:.8rem">${done} of ${n} answered</p>
  </div>`;
}
function exitExam(){ ask('Leave the exam?','Your answers so far will be kept on this device until you come back.','Leave',()=>{view={name:'home'};render();},'navy'); }
function choose(qid,L){ run.answers[qid]=L; run.cheer=CHEERS[Math.floor(Math.random()*CHEERS.length)]; saveRun(); render(); if(run.i<run.flat.length-1) setTimeout(()=>{if(view.name==='exam'&&run&&run.answers[qid]===L&&run.flat[run.i].id===qid){run.i++;saveRun();render();}},500); }
function nav(d){ run.i=Math.max(0,Math.min(run.flat.length-1,run.i+d)); saveRun(); render(); }
function finish(){
  const mcq=run.flat.filter(q=>q.type!=='writing');
  const unanswered=mcq.filter(q=>!run.answers[q.id]).length;
  if(unanswered){ ask('Not finished yet','You have '+unanswered+' unanswered question'+(unanswered>1?'s':'')+'. Finish anyway?','Finish anyway',doFinish,'mint'); return; }
  doFinish();
}
async function doFinish(){
  const {exam,flat,answers}=run; const mcq=flat.filter(q=>q.type!=='writing');
  let score=0; const sections={}; const wrong=[];
  mcq.forEach(q=>{ const ok=answers[q.id]===q.answer; sections[q.section]=sections[q.section]||{correct:0,total:0}; sections[q.section].total++; if(ok){score++;sections[q.section].correct++;} else wrong.push(q.id); });
  const r={id:uid(),examId:exam.id,examTitle:exam.title,studentId:session.id,score,total:mcq.length,answers,writing:run.writing,wrong,sections,durationSec:Math.round((Date.now()-run.started)/1000),finishedAt:new Date().toISOString()};
  run=null; saveRun();
  await pushResult(r);
  view={name:'result',result:r}; render(); if(pct(r)>=50) confetti();
}
function renderResult(){
  const r=view.result; const s=student(r.studentId)||{name:'Student'}; const p=pct(r); const m=resultMsg(p,first(s.name)); const ANS=r.answers||{};
  const exam=DATA.exams.find(e=>e.id===r.examId);
  return topbar()+`
  <div class="card center">
