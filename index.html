<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎒%3C/text%3E%3C/svg%3E">
<title>Ali Family Practice Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one centered column (max 860px), soft "sticker" cards on a sky-tinted ground; KCS navy + sky from the school crest, sun/mint/coral as cheer colors */
:root{
  --navy:#1F2B5B; --sky:#2EA8E6; --sun:#FFC83D; --coral:#FF6B6B; --mint:#2EC48A; --grape:#8E6CFF;
  --bg:#F1F8FF; --card:#FFFFFF; --ink:#1F2B5B; --ink2:#5C6890; --line:#D9E7F4; --soft:#E7F3FC; --soft2:#FFF6DA;
  --shadow:0 10px 28px rgba(31,43,91,.10);
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0E1A36; --card:#172548; --ink:#F2F6FF; --ink2:#A9B5D8; --line:#2A3B69; --soft:#1D2E5A; --soft2:#3A3620; --shadow:0 10px 28px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0E1A36; --card:#172548; --ink:#F2F6FF; --ink2:#A9B5D8; --line:#2A3B69; --soft:#1D2E5A; --soft2:#3A3620; --shadow:0 10px 28px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem;
  background-image:radial-gradient(circle at 8% 6%,rgba(46,168,230,.16) 0 130px,transparent 131px),radial-gradient(circle at 92% 22%,rgba(255,200,61,.20) 0 95px,transparent 96px),radial-gradient(circle at 15% 92%,rgba(46,196,138,.14) 0 120px,transparent 121px);background-attachment:fixed}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:.4rem 0}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:16px;padding:.8rem 1.3rem;color:#fff;background:var(--sky);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .08s;touch-action:manipulation;min-width:0}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
button.ghost{background:var(--soft);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
button.sun{background:var(--sun);color:var(--navy)}button.mint{background:var(--mint)}button.coral{background:var(--coral)}button.grape{background:var(--grape)}button.navy{background:var(--navy)}
button.sm{padding:.45rem .85rem;border-radius:12px;font-size:.9rem}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.65rem .9rem;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--sky);transform:scale(1.25)}
textarea{min-height:110px;resize:vertical}
label{font-weight:700;display:block;margin:.6rem 0 .25rem}
.wrap{max-width:860px;margin:0 auto}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:1.25rem;margin:1rem 0;min-width:0}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.center{text-align:center}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.topbar{display:flex;align-items:center;gap:.7rem;padding:.8rem 0 .3rem}
.topbar img.logo{height:52px;width:auto}
.topbar .school{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.1}
.topbar .school small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.18);flex:0 0 auto}
.avatar.big{width:110px;height:110px;border-width:6px}
.pill{display:inline-block;padding:.18rem .7rem;border-radius:999px;font-weight:800;font-size:.8rem;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.sky{background:var(--sky);color:#fff}.pill.sun{background:var(--sun);color:var(--navy)}.pill.mint{background:var(--mint);color:#fff}.pill.coral{background:var(--coral);color:#fff}.pill.grape{background:var(--grape);color:#fff}
/* login */
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem}
.who{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:1.2rem .8rem;text-align:center;cursor:pointer;border:3px solid transparent;transition:transform .12s,border-color .12s}
.who:hover{transform:translateY(-3px)}
.who.sel{border-color:var(--sun)}
.who .avatar{width:92px;height:92px}
.who .av-admin{width:92px;height:92px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:2.4rem;margin:0 auto;border:4px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.who .nm{font-family:var(--display);font-weight:600;font-size:1.2rem;margin-top:.5rem}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:280px;margin:1rem auto}
.pinpad button{padding:.9rem;font-size:1.4rem;background:var(--soft);color:var(--ink);box-shadow:none;border:2px solid var(--line);font-family:var(--display)}
.pinpad button.go{background:var(--sky);color:#fff;border-color:var(--sky)}
.dots{display:flex;gap:.6rem;justify-content:center;margin:.5rem 0}
.dots span{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--sky)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* home */
.hero{background:linear-gradient(135deg,var(--sky),var(--grape));color:#fff}
.hero .pill{background:rgba(255,255,255,.25);color:#fff}
.hero .pill.sun{background:var(--sun);color:var(--navy)}
.quote{background:var(--soft2);border-radius:18px;padding:.8rem 1rem;font-family:var(--display);font-weight:500;font-size:1.05rem;display:flex;gap:.6rem;align-items:center}
.quote span.ic{font-size:1.6rem}
/* exam */
.progress{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:.5rem 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:99px;transition:width .3s}
.opt{display:flex;gap:.8rem;align-items:center;width:100%;text-align:start;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:.85rem 1rem;margin:.55rem 0;box-shadow:none;font-weight:700;font-size:1.05rem;line-height:1.35}
.opt .ltr{flex:0 0 40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--sky)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--sky);background:var(--soft)}
.opt.sel .ltr{background:var(--sky);color:#fff}
.opt.ok{border-color:var(--mint);background:rgba(46,196,138,.14)}.opt.ok .ltr{background:var(--mint);color:#fff}
.opt.bad{border-color:var(--coral);background:rgba(255,107,107,.14)}.opt.bad .ltr{background:var(--coral);color:#fff}
.qtext{font-size:1.2rem;font-weight:800;margin:.3rem 0 .8rem;overflow-wrap:anywhere}
.passage{background:var(--soft);border-radius:16px;padding:.8rem 1rem;font-size:.98rem;margin-bottom:.8rem}
.why{background:var(--soft2);border-radius:14px;padding:.6rem .9rem;font-size:.95rem;margin:.4rem 0 .2rem;display:flex;gap:.5rem;align-items:flex-start}
.why b{color:var(--navy)}
.cheer{font-family:var(--display);font-weight:600;color:var(--sky);font-size:1.05rem;min-height:1.5em;text-align:center}
.navq{display:flex;gap:.6rem;justify-content:space-between;margin-top:1rem}
.scoreball{width:160px;height:160px;border-radius:50%;margin:1rem auto;display:grid;place-items:center;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--line) 0)}
.scoreball b{width:124px;height:124px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:3rem;line-height:1}
.stars{font-size:1.8rem;letter-spacing:.1em}
/* admin */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.tabs button{background:var(--soft);color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:.5rem .9rem;border-radius:12px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{padding:.55rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.tscroll{overflow-x:auto}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.7rem}
.stat div{background:var(--soft);border-radius:16px;padding:.8rem;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{color:var(--ink2);font-weight:700}
.bar{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;font-size:.92rem}
.bar .lbl{flex:0 0 44%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bar .trk{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .trk i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar .trk i.mid{background:var(--sun)}.bar .trk i.low{background:var(--coral)}
.bar .val{flex:0 0 44px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.qbuild{border:2px dashed var(--line);border-radius:16px;padding:.8rem;margin:.6rem 0}
.notice{border-radius:16px;padding:.8rem 1rem;font-size:.92rem;background:var(--soft)}
.notice.warn{background:var(--soft2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:14px;font-weight:800;box-shadow:var(--shadow);z-index:50;max-width:92vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.bob{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
code.codebox{display:block;word-break:break-all;background:var(--soft);padding:.7rem;border-radius:12px;font-size:.78rem;max-height:120px;overflow:auto}
.chart{width:100%;height:auto;display:block}
.modal{position:fixed;inset:0;background:rgba(15,26,54,.55);display:grid;place-items:center;z-index:60;padding:1rem}
.modal .card{max-width:420px;width:100%;margin:0}
ul.tight,ol.tight{margin:.2rem 0;padding-left:1.2rem}
</style>
</head>

«destruction» means great damage; breaking things apart."},{"text":"Construction workers had to ____ their daily schedule because of heavy morning rain.","options":["collapse","alter","severe","destruction"],"answer":"B","id":"q6","why":"«alter» means to change."},{"text":"The news reporter warned everyone that a ____ thunderstorm with strong winds and hail was heading toward the area.","options":["unpredictable","hazard","severe","alter"],"answer":"C","id":"q7","why":"«severe» means very strong or serious."},{"text":"Thanks to the hard work of the fourth-grade class, a ____ amount of recycled paper was collected for the school drive.","options":["substantial","hazard","collapse","severe"],"answer":"A","id":"q8","why":"«substantial» means large; a big amount."},{"text":"Which word is a synonym (means nearly the same thing) for hazard?","options":["Safety","Danger","Comfort","Pattern"],"answer":"B","id":"q9","why":"«Hazard» means danger, so «Danger» is the synonym."},{"text":"Read the sentence: \"To help protect against beach erosion, people build structures that block ocean waves.\" What does the word block mean in this sentence?","options":["A solid square piece of wood","To stop or prevent from passing","A row of houses on a street","To build something out of plastic bricks"],"answer":"B","id":"q10","why":"Here «block» is a verb: the structures stop the waves from passing."}],"tip":"Vocabulary tip: read the whole sentence and ask which word fits the meaning."},{"title":"Part 2: Sentences and Fragments","questions":[{"text":"Which group of words is a complete sentence?","options":["There are many stars in the sky.","Brought it into the kitchen.","My classroom at school.","Laughing loudly at the joke."],"answer":"A","id":"q11","why":"«There are many stars in the sky.» has a subject (stars) and a verb (are) and makes complete sense."},{"text":"Which group of words is a sentence fragment?","options":["I can jump very high.","The student was late.","I think we won!","My classroom at school."],"answer":"D","id":"q12","why":"«My classroom at school.» has no verb and does not tell a complete thought."},{"text":"A sentence is a group of words that shows ____.","options":["a capital letter","a complete thought","a question mark","a rhyme"],"answer":"B","id":"q13","why":"A sentence must show a complete thought."},{"text":"\"Drove the car.\" is a ____.","options":["statement","question","sentence fragment","exclamation"],"answer":"C","id":"q14","why":"«Drove the car.» has no subject (who drove?), so it is a fragment."},{"text":"Every sentence begins with a ____ and ends with a punctuation mark.","options":["capital letter","small letter","number","picture"],"answer":"A","id":"q15","why":"Sentences start with a capital letter and end with a punctuation mark."},{"text":"Which group of words is a sentence?","options":["Laughing loudly at the joke.","Did you see the rabbit?","Brought it into the kitchen.","My classroom at school."],"answer":"B","id":"q16","why":"«Did you see the rabbit?» is a complete question with a subject and a verb."},{"text":"Which group of words is a fragment?","options":["Do you want to play a game?","I think we won!","Brought it into the kitchen.","The student was late."],"answer":"C","id":"q17","why":"«Brought it into the kitchen.» has no subject, so it is a fragment."},{"text":"Which group of words is NOT a sentence?","options":["The cat played with string.","The pencils are sharpened.","I can jump very high.","Drove the car."],"answer":"D","id":"q18","why":"«Drove the car.» has no subject, so it is not a sentence."},{"text":"Why is \"Laughing loudly at the joke.\" a fragment?","options":["It does not show a complete thought.","It has no capital letter.","It has no period.","It is a question."],"answer":"A","id":"q19","why":"A fragment is missing a complete thought (who is laughing?)."},{"text":"Which group of words shows a complete thought?","options":["In the sky.","Played with string.","The cat played with string.","The cat with string."],"answer":"C","id":"q20","why":"«The cat played with string.» has a subject (cat) and a verb (played)."}],"tip":"Rule: a sentence has a subject and a verb and shows a complete thought. A fragment is only a piece of a sentence."},{"title":"Part 3: Types of Sentences","questions":[{"text":"A statement is a sentence that ____.","options":["asks something","tells something","tells someone to do something","shows strong feeling"],"answer":"B","id":"q21","why":"A statement tells something and ends with a period."},{"text":"A question is a sentence that ____.","options":["tells something","shows surprise","tells someone to do something","asks something"],"answer":"D","id":"q22","why":"A question asks something and ends with a question mark."},{"text":"A command is a sentence that ____.","options":["tells someone to do something","asks something","tells something","is a fragment"],"answer":"A","id":"q23","why":"A command tells someone to do something."},{"text":"An exclamation is a sentence that ____.","options":["asks something","tells something","expresses a strong feeling","tells someone to do something"],"answer":"C","id":"q24","why":"An exclamation shows strong feeling and ends with !"},{"text":"\"We went to the store.\" is a ____.","options":["question","statement","command","exclamation"],"answer":"B","id":"q25","why":"It tells something and ends with a period → statement."},{"text":"\"Are we there yet?\" is a ____.","options":["question","statement","command","exclamation"],"answer":"A","id":"q26","why":"It asks something and ends with ? → question."},{"text":"\"Wash your hands.\" is a ____.","options":["statement","question","exclamation","command"],"answer":"D","id":"q27","why":"It tells you to do something → command."},{"text":"\"I can't believe you're here!\" is a ____.","options":["statement","question","exclamation","command"],"answer":"C","id":"q28","why":"It shows strong feeling with ! → exclamation."},{"text":"Which group of words is a sentence?","options":["The book in here?","Is it in here?","The tallest building in the world!","Red backpack today."],"answer":"B","id":"q29","why":"«Is it in here?» has a subject and a verb and is a complete question; the others are fragments."},{"text":"Which sentence is a command?","options":["Push the button quickly.","How old is your cousin?","This is the best gift ever!","Who is your teacher?"],"answer":"A","id":"q30","why":"«Push the button quickly.» tells someone to do something."}],"tip":"Rule: statement = tells (.), question = asks (?), command = tells someone to do something (.), exclamation = strong feeling (!)."},{"title":"Part 4: Sentence Punctuation","questions":[{"text":"A statement ends with a ____.","options":["question mark","exclamation mark","period","comma"],"answer":"C","id":"q31","why":"Statements end with a period."},{"text":"A question ends with a ____.","options":["question mark","period","comma","capital letter"],"answer":"A","id":"q32","why":"Questions end with a question mark."},{"text":"An exclamation ends with an ____.","options":["period","comma","question mark","exclamation mark"],"answer":"D","id":"q33","why":"Exclamations end with an exclamation mark."},{"text":"A command ends with ____.","options":["only a question mark","a period or an exclamation mark","a comma","nothing"],"answer":"B","id":"q34","why":"A command ends with a period (or ! if it is strong)."},{"text":"Which is the correct way to write \"put the bottle in the bin outside\"?","options":["put the bottle in the bin outside.","Put the bottle in the bin outside","Put the bottle in the bin outside.","Put the bottle in the bin outside?"],"answer":"C","id":"q35","why":"A command starts with a capital letter and ends with a period."},{"text":"Which is the correct way to write \"who is your favorite actor\"?","options":["Who is your favorite actor?","who is your favorite actor?","Who is your favorite actor.","Who is your favorite actor!"],"answer":"A","id":"q36","why":"A question starts with a capital letter and ends with a question mark."},{"text":"\"The snow sticks to the tree branches.\" is a ____.","options":["question","command","exclamation","statement"],"answer":"D","id":"q37","why":"It tells something → statement."},{"text":"Which is the correct way to write \"how many push-ups can you do in a row\"?","options":["How many push-ups can you do in a row.","How many push-ups can you do in a row?","how many push-ups can you do in a row?","How many push-ups can you do in a row!"],"answer":"B","id":"q38","why":"It asks something → capital letter at the start and a question mark at the end."}],"tip":"Rule: statement and command end with a period (.), question ends with ?, exclamation ends with !. Every sentence starts with a capital letter."},{"title":"Part 5: Proofreading","questions":[{"text":"What is the mistake in \"today was the best day ever!\"?","options":["It does not begin with a capital letter.","It has no end mark.","It is a question.","It is too long."],"answer":"A","id":"q39","why":"«today» must start with a capital letter: «Today was the best day ever!»"},{"text":"Which is the best way to fix the fragment \"Was no school!\"?","options":["was no school","There was no school!","No school was.","Was no school?"],"answer":"B","id":"q40","why":"«There was no school!» adds a subject and makes a complete thought."},{"text":"Which sentence is written correctly?","options":["then I went sledding.","Then I went sledding?","Then I went sledding.","Then i went sledding"],"answer":"C","id":"q41","why":"It starts with a capital letter, has capital «I», and ends with a period."},{"text":"Which is the best way to fix the fragment \"is really easy.\"?","options":["is really easy.","Is really easy.","It really easy.","It is really easy."],"answer":"D","id":"q42","why":"«It is really easy.» adds a subject (It) and a verb (is)."},{"text":"Which is the best way to fix the fragment \"The two slices together.\"?","options":["Put the two slices together.","The two slices together","the two slices together.","Two slices together?"],"answer":"A","id":"q43","why":"«Put the two slices together.» is a complete command."},{"text":"Which sentence is written correctly?","options":["what place would you like to see.","What place would you like to see.","What place would you like to see?","what place would you like to see?"],"answer":"C","id":"q44","why":"It asks something, so it needs a capital letter and a question mark."}],"tip":"Proofreading tip: check the capital letter at the start, the end mark, and whether the words make a complete thought."},{"title":"Part 6: Reading Check","passage":"Read the story: (1) Ben and Sara are at the park. (2) \"What game do you want to play, Ben?\" Sara asks. (3) \"I love soccer!\" Ben shouts. (4) Sara kicks the ball to Ben. (5) \"Run to the goal,\" says Sara. (6) \"That was a great kick!\" says Ben.","questions":[{"text":"Which of the following is a statement?","options":["Sentence 1","Sentence 2","Sentence 3","Sentence 5"],"answer":"A","id":"q45","why":"Sentence 1 «Ben and Sara are at the park.» tells something."},{"text":"Which of the following is a question?","options":["Sentence 1","Sentence 2","Sentence 3","Sentence 4"],"answer":"B","id":"q46","why":"Sentence 2 «What game do you want to play, Ben?» asks something."},{"text":"Which of the following is an exclamation?","options":["Sentence 1","Sentence 4","Sentence 3","Sentence 5"],"answer":"C","id":"q47","why":"Sentence 3 «I love soccer!» ends with ! and shows strong feeling."},{"text":"Which of the following is a command?","options":["Sentence 2","Sentence 3","Sentence 1","Sentence 5"],"answer":"D","id":"q48","why":"Sentence 5 «Run to the goal,» tells someone to do something."},{"text":"What type of sentence is Sentence 6?","options":["statement","question","command","exclamation"],"answer":"D","id":"q49","why":"Sentence 6 «That was a great kick!» shows strong feeling → exclamation."},{"text":"Why does Sentence 3 end with an exclamation mark?","options":["It asks a question.","It tells someone to do something.","It shows how excited Ben is.","It is a fragment."],"answer":"C","id":"q50","why":"Ben shouts «I love soccer!» because he is excited."}],"tip":"Reading tip: look at the end mark of each sentence: . tells, ? asks, ! shows feeling, and a command tells someone what to do."},{"title":"Part 7: Short Vowel Sounds","questions":[{"text":"Which word has the short a sound as in splat?","options":["left","flat","mill","plot"],"answer":"B","id":"q51","why":"«flat» has the same short a sound as «splat»."},{"text":"Which word has the short a sound as in splat?","options":["band","bell","gym","sum"],"answer":"A","id":"q52","why":"«band» has the same short a sound as «splat»."},{"text":"Which word has the short i sound spelled i as in flick?","options":["bluff","dock","hint","cash"],"answer":"C","id":"q53","why":"«hint» has the same short i sound as «flick»."},{"text":"Which word has the short i sound spelled i as in flick?","options":["left","plot","bell","mill"],"answer":"D","id":"q54","why":"«mill» has the same short i sound as «flick»."},{"text":"Which word has the short e sound spelled e as in tell?","options":["bell","gym","sum","flat"],"answer":"A","id":"q55","why":"«bell» has the same short e sound as «tell»."},{"text":"Which word has the short e sound spelled ea as in health?","options":["shelf","wealth","left","bell"],"answer":"B","id":"q56","why":"«wealth» has the same short e sound as «health»."},{"text":"Which word has the short i sound spelled y as in myth?","options":["grim","mill","gym","hint"],"answer":"C","id":"q57","why":"«gym» has the same short i sound as «myth»."},{"text":"Which word has the short i sound spelled ui as in guilt?","options":["blot","flat","plot","build"],"answer":"D","id":"q58","why":"«build» has the same short i sound as «guilt»."},{"text":"Which word has the short o sound as in stock?","options":["crunch","dock","bluff","plum"],"answer":"B","id":"q59","why":"«dock» has the same short o sound as «stock»."},{"text":"Which word has the short u sound as in nuts?","options":["plot","flat","bell","crunch"],"answer":"D","id":"q60","why":"«crunch» has the same short u sound as «nuts»."}],"tip":"Short vowel tip: say the word slowly and listen to the middle sound: a as in cat, e as in bed, i as in sit, o as in hot, u as in cup."},{"title":"Part 8: Spelling Word Meaning","questions":[{"text":"She is the drum player in a ____.","options":["bell","band","dock","sum"],"answer":"B","id":"q61","why":"«band» means a group of musicians."},{"text":"Did you tell the truth, or was that a ____?","options":["plot","mill","bluff","hint"],"answer":"C","id":"q62","why":"«bluff» means a trick; pretending something is true."},{"text":"I did not have enough ____ on me to pay for it.","options":["cash","odd","gym","grim"],"answer":"A","id":"q63","why":"«cash» means money."},{"text":"This ____ chimes at noon every day.","options":["plum","shelf","blot","bell"],"answer":"D","id":"q64","why":"«bell» means something that rings or chimes."},{"text":"We got on the boat from the ____.","options":["dock","mill","flat","hint"],"answer":"A","id":"q65","why":"«dock» means the place where boats stop."},{"text":"Which word means \"clue\"?","options":["sum","hint","plot","bluff"],"answer":"B","id":"q66","why":"«hint» means a clue."},{"text":"Which word means \"gloomy\"?","options":["odd","flat","grim","left"],"answer":"C","id":"q67","why":"«grim» means gloomy, sad."},{"text":"Which word means \"a lot of money\"?","options":["plot","plum","dock","wealth"],"answer":"D","id":"q68","why":"«wealth» means a lot of money."}],"tip":"Spelling-word tip: think about what each word means before you choose."},{"title":"Part 9: Rhymes and ABC Order","questions":[{"text":"Which word rhymes with clock?","options":["deck","dock","poke","dash"],"answer":"B","id":"q69","why":"«dock» ends with -ock like «clock»."},{"text":"Which word rhymes with dash?","options":["floss","cost","cash","dish"],"answer":"C","id":"q70","why":"«cash» ends with -ash like «dash»."},{"text":"Which word rhymes with stuff?","options":["bluff","stung","stiff","stuck"],"answer":"A","id":"q71","why":"«bluff» ends with -uff like «stuff»."},{"text":"Which word rhymes with bat?","options":["plot","flat","float","boat"],"answer":"B","id":"q72","why":"«flat» ends with -at like «bat»."},{"text":"Which word rhymes with tell?","options":["toll","stall","tail","bell"],"answer":"D","id":"q73","why":"«bell» ends with -ell like «tell»."},{"text":"Which list is in alphabetical order (to the second letter)?","options":["build, blot, grim, shelf, sum","blot, build, grim, sum, shelf","grim, blot, build, shelf, sum","blot, build, grim, shelf, sum"],"answer":"D","id":"q74","why":"blot (bl) comes before build (bu), then grim, shelf, sum: b-b-g-s-s with second letters in order."}],"tip":"Rhyme tip: rhyming words end with the same sound. ABC order: compare the first letter, then the second letter."},{"title":"Part 10: High-Frequency Words","questions":[{"text":"I will ____ to the store because it is nearby.","options":["walk","green","funny","pretty"],"answer":"A","id":"q75","why":"You «walk» to a place that is nearby."},{"text":"At the store, I will buy ____ apples since I don't like red ones.","options":["funny","green","first","every"],"answer":"B","id":"q76","why":"«green» apples, because the speaker does not like red ones."},{"text":"I need to find a bag to ____ the apples.","options":["laugh","very","carry","her"],"answer":"C","id":"q77","why":"A bag is used to «carry» things."},{"text":"The cat's eyes are ____ blue.","options":["because","today","could","very"],"answer":"D","id":"q78","why":"«very blue» describes how blue the eyes are."},{"text":"I always start to ____ when I hear her funny meow.","options":["green","laugh","walk","first"],"answer":"B","id":"q79","why":"A funny meow makes you «laugh»."},{"text":"____ time I go to the store, I see the same cat.","options":["Pretty","Funny","Green","Every"],"answer":"D","id":"q80","why":"«Every time» means each time."}],"tip":"Tip: read the sentence again with your word inside and check that it makes sense."},{"title":"Part 11: Writing","questions":[{"type":"writing","text":"Write a paragraph about your best school subject.","id":"q81"}]}]},{"id":"ex_g6_unit1_mid1","title":"Grade 6 English – 1st Mid-Term Revision (Unit 1)","subject":"English","teacher":"Mrs. Esraa Gamal","assignedTo":["aleen"],"createdAt":"2026-10-25T10:25:00.000Z","sections":[{"title":"Part 1: Vocabulary – Definitions","passage":"","questions":[{"id":"g6q1","text":"Which word matches this definition: \"to successfully overcome a problem\"?","options":["merit","crinkly","master","conquer"],"answer":"D","why":"«conquer» means to successfully overcome a problem."},{"id":"g6q2","text":"Which word matches this definition: \"wavy or curly\"?","options":["merit","pine","crinkly","master"],"answer":"C","why":"«crinkly» means wavy or curly."},{"id":"g6q3","text":"Which word matches this definition: \"a person's worth, or what he or she deserves\"?","options":["conquer","pine","crinkly","desert"],"answer":"D","why":"«desert» means a person's worth, or what he or she deserves."},{"id":"g6q4","text":"Which word matches this definition: \"to control or overcome something difficult\"?","options":["crinkly","merit","desert","master"],"answer":"D","why":"«master» means to control or overcome something difficult."},{"id":"g6q5","text":"Which word matches this definition: \"a good quality deserving of reward\"?","options":["merit","conquer","pine","master"],"answer":"A","why":"«merit» means a good quality deserving of reward."},{"id":"g6q6","text":"Which word matches this definition: \"to miss what is not there and hope for its return\"?","options":["merit","pine","crinkly","desert"],"answer":"B","why":"«pine» means to miss what is not there and hope for its return."},{"id":"g6q7","text":"Which word matches this definition: \"to hold in place firmly\"?","options":["anchor","damp","exhausted","capsize"],"answer":"A","why":"«anchor» means to hold in place firmly."},{"id":"g6q8","text":"Which word matches this definition: \"to tip over in the water\"?","options":["intense","exhausted","caution","capsize"],"answer":"D","why":"«capsize» means to tip over in the water."},{"id":"g6q9","text":"Which word matches this definition: \"to give a warning\"?","options":["intense","caution","rescuer","anchor"],"answer":"B","why":"«caution» means to give a warning."},{"id":"g6q10","text":"Which word matches this definition: \"wet\"?","options":["intense","exhausted","capsize","damp"],"answer":"D","why":"«damp» means wet."},{"id":"g6q11","text":"Which word matches this definition: \"extremely large or great in size, amount, or degree\"?","options":["capsize","enormous","rescuer","exhausted"],"answer":"B","why":"«enormous» means extremely large or great in size, amount, or degree."},{"id":"g6q12","text":"Which word matches this definition: \"very tired\"?","options":["capsize","anchor","enormous","exhausted"],"answer":"D","why":"«exhausted» means very tired."},{"id":"g6q13","text":"Which word matches this definition: \"very strong or powerful in degree, force, or effect\"?","options":["exhausted","caution","damp","intense"],"answer":"D","why":"«intense» means very strong or powerful in degree, force, or effect."},{"id":"g6q14","text":"Which word matches this definition: \"someone who saves a person from harm or danger\"?","options":["damp","rescuer","caution","enormous"],"answer":"B","why":"«rescuer» means someone who saves a person from harm or danger."},{"id":"g6q15","text":"Which word matches this definition: \"to write and exchange messages or letters with someone\"?","options":["correspond","simultaneously","egotism","pacific"],"answer":"A","why":"«correspond» means to write and exchange messages or letters with someone."},{"id":"g6q16","text":"Which word matches this definition: \"in a gloomy, sad, or depressing way\"?","options":["dismally","submerged","habitual","simultaneously"],"answer":"A","why":"«dismally» means in a gloomy, sad, or depressing way."},{"id":"g6q17","text":"Which word matches this definition: \"an exaggerated opinion of one's own importance\"?","options":["pacific","egotism","submerged","majority"],"answer":"B","why":"«egotism» means an exaggerated opinion of one's own importance."},{"id":"g6q18","text":"Which word matches this definition: \"representing normal or routine behavior; based on a habit\"?","options":["submerged","habitual","simultaneously","egotism"],"answer":"B","why":"«habitual» means representing normal or routine behavior; based on a habit."},{"id":"g6q19","text":"Which word matches this definition: \"the number that is greater than half of the total\"?","options":["simultaneously","pacific","egotism","majority"],"answer":"D","why":"«majority» means the number that is greater than half of the total."},{"id":"g6q20","text":"Which word matches this definition: \"quiet, peaceful\"?","options":["simultaneously","pacific","dismally","habitual"],"answer":"B","why":"«pacific» means quiet, peaceful."},{"id":"g6q21","text":"Which word matches this definition: \"done at the same time as something else\"?","options":["majority","pacific","egotism","simultaneously"],"answer":"D","why":"«simultaneously» means done at the same time as something else."},{"id":"g6q22","text":"Which word matches this definition: \"physically strong and sturdy; able to endure hardship or physical effort\"?","options":["correspond","submerged","egotism","stalwart"],"answer":"D","why":"«stalwart» means physically strong and sturdy; able to endure hardship or physical effort."},{"id":"g6q23","text":"Which word matches this definition: \"completely covered or hidden, especially by water or an overwhelming number of things\"?","options":["egotism","submerged","stalwart","majority"],"answer":"B","why":"«submerged» means completely covered or hidden, especially by water or an overwhelming number of things."}],"tip":"Vocabulary tip: match the word to its exact definition from the word bank."},{"title":"Part 2: Synonyms","passage":"","questions":[{"id":"g6q24","text":"Which vocabulary word is a synonym for \"achievement\"?","options":["pine","merit","conquer","desert"],"answer":"B","why":"«merit» means nearly the same as achievement."},{"id":"g6q25","text":"Which vocabulary word is a synonym for \"long (for)\"?","options":["pine","merit","master","desert"],"answer":"A","why":"«pine» means nearly the same as long (for)."},{"id":"g6q26","text":"Which vocabulary word is a synonym for \"overcome\"?","options":["crinkly","master","conquer","merit"],"answer":"B","why":"«master» means nearly the same as overcome."},{"id":"g6q27","text":"Which vocabulary word is a synonym for \"crimped\"?","options":["crinkly","desert","conquer","master"],"answer":"A","why":"«crinkly» means nearly the same as crimped."},{"id":"g6q28","text":"Which vocabulary word is a synonym for \"sadly\"?","options":["egotism","majority","correspond","dismally"],"answer":"D","why":"«dismally» means nearly the same as sadly."},{"id":"g6q29","text":"Which vocabulary word is a synonym for \"talk\"?","options":["stalwart","habitual","correspond","egotism"],"answer":"C","why":"«correspond» means nearly the same as talk."},{"id":"g6q30","text":"Which vocabulary word is a synonym for \"strong\"?","options":["submerged","pacific","majority","stalwart"],"answer":"D","why":"«stalwart» means nearly the same as strong."},{"id":"g6q31","text":"Which vocabulary word is a synonym for \"greater amount\"?","options":["majority","dismally","correspond","egotism"],"answer":"A","why":"«majority» means nearly the same as greater amount."},{"id":"g6q32","text":"Which vocabulary word is a synonym for \"together\"?","options":["egotism","dismally","simultaneously","submerged"],"answer":"C","why":"«simultaneously» means nearly the same as together."}],"tip":"Synonym tip: a synonym is a word with nearly the same meaning."},{"title":"Part 3: Reading – Du Bois Letter & After Twenty Years","passage":"","questions":[{"id":"g6q33","text":"What is most closely the meaning of \"desert\" as it is used in this sentence? \"You are there by no desert or merit of yours, but only by lucky chance.\"","options":["noun | an abandoned area","noun | a sweet course eaten after a meal","noun | a place that is lacking in water or vegetation","noun | what a person deserves or is worthy of"],"answer":"D","why":"Here «desert» means what you deserve (as in «just deserts»), not a dry place."},{"id":"g6q34","text":"In his letter to his daughter, with which statement would W. E. B. Du Bois most likely agree?","options":["Every young student should study in a foreign country.","A young person should face life's challenges with courage and determination.","It is more important to take risks than to worry about the consequences.","One should focus on who they are in the present moment."],"answer":"B","why":"The whole letter encourages his daughter to face challenges bravely and with determination."},{"id":"g6q35","text":"What is one cultural challenge Du Bois expects his daughter will face at school in England?","options":["Learning a new language","Being looked at as different because of the color of her skin","Not being allowed to study music","Having no friends her age"],"answer":"B","why":"He warns her that people in England may look at her differently because of her skin colour."},{"id":"g6q36","text":"How does Du Bois advise his daughter to respond to that challenge?","options":["By going home immediately","By arguing with everyone who stares","By being proud of who she is and not letting it bother her","By hiding from other students"],"answer":"C","why":"He tells her to be proud of who she is and not to let it bother her."},{"id":"g6q37","text":"Why does Du Bois recommend that his daughter do some \"unpleasant things\"?","options":["Because they build discipline and strong character","Because the school requires it","Because her mother asked him to say so","Because unpleasant things are more fun"],"answer":"A","why":"He says doing unpleasant things builds discipline and strong character."},{"id":"g6q38","text":"In \"After Twenty Years\", what is most closely the meaning of \"impressively\" in: \"The policeman on the beat moved up the avenue impressively\"?","options":["noun | an idea, feeling, or opinion about someone","adjective | having the ability to impress the mind","verb | attempting to show off","adverb | in a way that evokes admiration"],"answer":"D","why":"«impressively» ends in -ly, so it is an adverb: moving in a way that evokes admiration."},{"id":"g6q39","text":"Which inference is best supported by the text of \"After Twenty Years\"?","options":["Bob doesn't remember how tall Jimmy actually is.","The officer walking the streets in the beginning of the story is Jimmy.","Jimmy was involved in a life of crime before becoming a cop.","Bob is pretending to not know that the first man he meets is Jimmy."],"answer":"B","why":"The policeman at the start is Jimmy; he recognizes Bob but sends another officer instead."},{"id":"g6q40","text":"How does Bob realize his companion is not actually Jimmy Wells?","options":["He realizes the man does not look like Jimmy once they pass a streetlight.","He knows that Jimmy was never as tall as the imposter.","The man does not know the name of the old restaurant where the friends ate.","He didn't believe that Jimmy would ever work for the city."],"answer":"A","why":"When they pass a lit drugstore window, Bob sees the man’s face and says «You’re not Jimmy Wells.»"},{"id":"g6q41","text":"Which event happens FIRST in \"After Twenty Years\"?","options":["A man stands in a dark doorway with an unlit cigar.","Bob is arrested because Jimmy recognized him.","A cop walks up and down the street, surveying the scene.","The man talks about his success in the West and his old friend."],"answer":"C","why":"The story opens with the policeman walking his beat and checking doors."},{"id":"g6q42","text":"Which event happens LAST in \"After Twenty Years\"?","options":["A man stands in a dark doorway with an unlit cigar.","Bob is arrested because Jimmy recognized him.","A cop walks up and down the street, surveying the scene.","The man talks about his success in the West and his old friend."],"answer":"B","why":"The arrest (the note from Jimmy) is the final event of the story."},{"id":"g6q43","text":"What was the name of the restaurant where the two friends used to meet?","options":["Big Joe Brady's","Little Jimmy's Diner","The Western Grill","Silky's Place"],"answer":"A","why":"They used to eat at «Big Joe» Brady’s restaurant."},{"id":"g6q44","text":"What happened to 'Big Joe' Brady's restaurant five years ago?","options":["It became a hotel","It was torn down","It moved to the West","It was sold to Bob"],"answer":"B","why":"The restaurant was torn down five years ago."},{"id":"g6q45","text":"Who was the man in the doorway waiting for?","options":["His brother","A police officer","His old friend Jimmy Wells","A plainclothes detective"],"answer":"C","why":"Bob was waiting for his old friend Jimmy Wells."},{"id":"g6q46","text":"Why is the man sure that Jimmy Wells will meet him?","options":["Jimmy sent him a letter last week","Jimmy was the truest, most loyal friend in the world","Jimmy owns the restaurant","Jimmy lives on that street"],"answer":"B","why":"Bob says Jimmy was «the truest, staunchest old chap in the world»."},{"id":"g6q47","text":"What major difference in life choices is highlighted between Bob and Jimmy?","options":["Bob went West and made money through crime; Jimmy stayed in New York and became a policeman","Bob became a teacher; Jimmy became a sailor","Both stayed in New York but stopped talking","Jimmy went West; Bob stayed and opened a restaurant"],"answer":"A","why":"Bob got rich in the West (by crime); Jimmy stayed in New York as a policeman."},{"id":"g6q48","text":"How long had 'Silky' Bob been under arrest before he realized he was talking to a plainclothes officer?","options":["About an hour","About ten minutes","Two days","Twenty years"],"answer":"B","why":"The tall man says: «You’ve been under arrest for ten minutes, Silky Bob.»"},{"id":"g6q49","text":"Who was the note given to 'Silky' Bob from?","options":["The tall plainclothes officer","Big Joe Brady","Jimmy Wells","Chicago police"],"answer":"C","why":"The note is signed «JIMMY»."},{"id":"g6q50","text":"Why does O. Henry use a twenty-year gap in the story?","options":["To show how much people can change over time","To describe the city of New York","To explain how restaurants are built","To make the story shorter"],"answer":"A","why":"Twenty years is long enough for both friends to change completely."}],"tip":"Reading tip: go back to the text and find the sentence that supports your answer."},{"title":"Part 4: Collective Nouns","passage":"","questions":[{"id":"g6q51","text":"Choose the correct verb: My family ____ spending the weekend at Grandma's house. (collectively)","options":["is","are","were","have"],"answer":"A","why":"Acting collectively → singular verb «is»."},{"id":"g6q52","text":"Choose the correct verb: The big crowd ____ surprisingly quiet. (collectively)","options":["was","were","are","have"],"answer":"A","why":"Acting collectively → singular verb «was»."},{"id":"g6q53","text":"Choose the correct verb: Jessica's family ____ taking vacations in different places. (separately)","options":["are","is","was","has"],"answer":"A","why":"Acting separately → plural verb «are»."},{"id":"g6q54","text":"Choose the correct verb: The group ____ followers from all over the world. (collectively)","options":["has","have","are","were"],"answer":"A","why":"Acting collectively → singular verb «has»."},{"id":"g6q55","text":"Choose the correct verb: The team ____ running in all directions. (separately)","options":["are","is","was","has"],"answer":"A","why":"Acting separately → plural verb «are»."},{"id":"g6q56","text":"Choose the correct verb: The office staff ____ having a picnic on Saturday. (collectively)","options":["is","are","were","have"],"answer":"A","why":"Acting collectively → singular verb «is»."},{"id":"g6q57","text":"Which is the collective noun for a group of mothers, fathers and children?","options":["cheerleader","family","members","swarm"],"answer":"B","why":"A family is a group of mothers, fathers and children."},{"id":"g6q58","text":"Which is the collective noun for a group of Representatives?","options":["legislature","family","squad","bee"],"answer":"A","why":"A legislature is a group of representatives."},{"id":"g6q59","text":"A cheerleader is part of which collective noun?","options":["swarm","audience","squad","battalion"],"answer":"C","why":"A squad is a group of cheerleaders."},{"id":"g6q60","text":"Which collective noun is made of members?","options":["audience","soldier","mother","bee"],"answer":"A","why":"An audience is a group of members (people watching)."},{"id":"g6q61","text":"A bee belongs to a ____.","options":["battalion","swarm","legislature","squad"],"answer":"B","why":"A swarm is a group of bees."}],"tip":"Collective-noun rule: acting collectively (as one group) → singular verb (is / was / has); acting separately → plural verb (are / were / have)."},{"title":"Part 5: Grammar & Spelling","passage":"","questions":[{"id":"g6q62","text":"Choose the sentence that correctly shows a collective noun acting collectively.","options":["Carla's family are going to visit relatives in Mexico.","Carla's families is going to visit relatives in Mexico.","Carla's family is going to visit relatives in Mexico.","None of these sentences show a collective noun acting collectively."],"answer":"C","why":"One family acting together → «family is»."},{"id":"g6q63","text":"Choose the sentence that correctly shows a collective noun acting separately.","options":["The group of students was talking and laughing with one another.","The group of students were talking and laughing with one another.","The groups of students were talking and laughing with one another.","None of these sentences show a collective noun acting separately."],"answer":"B","why":"Students acting separately → «were talking»."},{"id":"g6q64","text":"Choose the sentence that correctly shows a collective noun acting collectively.","options":["The group calls many different countries home.","The group call many different countries its home.","The group calls many different countries their homes.","The group call many different countries their home."],"answer":"A","why":"The group acting as one → «calls» and «home»."},{"id":"g6q65","text":"Select the correct spelling: It is against store policy to exchange gifts without a ____.","options":["receipt","reciept","receet","neither is correct"],"answer":"A","why":"The correct spelling is «receipt» (i before e after c… except here: r-e-c-e-i-p-t)."},{"id":"g6q66","text":"Select the correct spelling: The weather on the Great Plains is always ____.","options":["changable","changeable","changeible","neither is correct"],"answer":"B","why":"«changeable» keeps the e after g to keep the soft g sound."},{"id":"g6q67","text":"Select the correct spelling: I think actors have the most jobs there are ____.","options":["agreeble","agrable","neither spelling is correct (it is agreeable)","agreable"],"answer":"C","why":"Both spellings given are wrong; the correct one is «agreeable»."},{"id":"g6q68","text":"Select the correct spelling: Everyone was hungry, and the food was ____.","options":["plentiful","plentyful","plentifull","neither is correct"],"answer":"A","why":"«plentiful»: plenty → plenti + ful."},{"id":"g6q69","text":"Select the correct spelling: To an ant, a human must look huge ____.","options":["incredibly","incredibely","incrediblly","neither is correct"],"answer":"A","why":"«incredibly»: incredible → drop the e, add -ly."},{"id":"g6q70","text":"Select the correct spelling: You can help create harmony by not ____ the rules.","options":["disobeying","disobeiing","disobaying","neither is correct"],"answer":"A","why":"«disobeying»: just add -ing to obey."},{"id":"g6q71","text":"How should the spelling error be corrected? \"When Rosa Parks courageously refused to give up her bus seat, she committed an incredibly dangerous act, but her bravry helped launch the civil rights movement.\"","options":["Change courageously to couragously","Change incredibly to incredibley","Change bravry to bravery","No change needs to be made"],"answer":"C","why":"«bravery» is the correct spelling."},{"id":"g6q72","text":"How could this sentence be changed from informal to formal language? \"Hey dude, what's happenin' today?\"","options":["Hey, what's gonna happen today?","Hello, what's going on today?","Hello. What are you doing today?","Dude, what's going on today?"],"answer":"C","why":"Formal language: no slang, full words, correct grammar."},{"id":"g6q73","text":"How could these sentences be changed from formal to informal language? \"Good afternoon. Please include an example in your essay.\"","options":["Hey dude, also do an example when you write that essay.","Please include an example in your essay","Include an example in your essay.","Hello. Make sure to include an example."],"answer":"A","why":"Informal language uses casual words like «Hey dude»."},{"id":"g6q74","text":"How can this sentence be changed to eliminate contractions? \"I'm thinking there's a good chance you won't be able to try the cake today.\"","options":["I am thinking there is a good chance you won't be able to try the cake today.","I think there is a good chance you will not be able to try the cake today.","I'm thinking there is a good chance you will not be able to try the cake today.","I'm thinking there's a good chance you will not be able to try the cake today."],"answer":"B","why":"Contractions removed: I’m → I think, won’t → will not."},{"id":"g6q75","text":"How should this sentence be changed? \"Tony joined the boy scouts last summer.\"","options":["Capitalize boy","Capitalize boy scouts","Capitalize summer","No change needs to be made"],"answer":"B","why":"«Boy Scouts» is the name of an organization → capital letters."},{"id":"g6q76","text":"How should this sentence be changed? \"In the 1960s, President Kennedy founded the peace corps to send Americans to other countries.\"","options":["Capitalize peace corps","Lowercase Americans","Capitalize countries","No change needs to be made"],"answer":"A","why":"«Peace Corps» is a proper noun → capital letters."},{"id":"g6q77","text":"How should this sentence be changed? \"Your' going to need your jacket,\" Jeremy told Vanessa, zipping his' winter coat, \"its cold out there.\"","options":["Delete the apostrophe after Your","Delete the apostrophe after Your and insert an apostrophe after its","Change Your' to You're, delete the apostrophe after his, and insert an apostrophe before the s in its","No change needs to be made"],"answer":"C","why":"«You’re» (you are), «his» has no apostrophe, «it’s» (it is)."},{"id":"g6q78","text":"How should this sentence be changed? \"The sleepy little boys head bobbed up and down, and eventually he rolled over onto his mothers lap.\"","options":["Insert an apostrophe after boys and mothers","Insert an apostrophe before the s in boys and mothers","Insert an apostrophe after his","No change needs to be made"],"answer":"B","why":"Possessive nouns need an apostrophe: the boy’s head, his mother’s lap."}],"tip":"Grammar tip: check verb agreement, spelling, capital letters for proper nouns, and apostrophes."},{"title":"Part 6: Possessive Nouns","passage":"","questions":[{"id":"g6q79","text":"Choose the singular possessive of garden:","options":["garden's","gardens'","gardens","garden"],"answer":"A"},{"id":"g6q80","text":"Choose the plural possessive of garden:","options":["garden's","gardens'","gardens","garden"],"answer":"B"},{"id":"g6q81","text":"Choose the singular possessive of chorus:","options":["chorus's","choruses'","chorus'","choruses"],"answer":"A"},{"id":"g6q82","text":"Choose the plural possessive of chorus:","options":["chorus's","choruses'","chorus'","choruses"],"answer":"B"},{"id":"g6q83","text":"Choose the singular possessive of player:","options":["player's","players'","players","player"],"answer":"A"},{"id":"g6q84","text":"Choose the plural possessive of player:","options":["player's","players'","players","player"],"answer":"B"},{"id":"g6q85","text":"Choose the singular possessive of woman:","options":["woman's","women's","womans'","womens"],"answer":"A"},{"id":"g6q86","text":"Choose the plural possessive of woman:","options":["woman's","women's","womans'","womens"],"answer":"B"},{"id":"g6q87","text":"Choose the singular possessive of piano:","options":["piano's","pianos'","pianos","piano"],"answer":"A"},{"id":"g6q88","text":"Choose the plural possessive of piano:","options":["piano's","pianos'","pianos","piano"],"answer":"B"},{"id":"g6q89","text":"Choose the singular possessive of Smith:","options":["Smith's","Smiths'","Smiths","Smith"],"answer":"A"},{"id":"g6q90","text":"Choose the plural possessive of Smith:","options":["Smith's","Smiths'","Smiths","Smith"],"answer":"B"}],"tip":"Possessive rule: singular → add ’s (garden’s). Plural ending in s → add only ’ (gardens’). Irregular plural → add ’s (women’s)."},{"title":"Part 7: Capitalization","passage":"","questions":[{"id":"g6q91","text":"Which sentence is capitalized INCORRECTLY?","options":["My great-grandfather worked on the famous newspaper New York World.","My brother joined the united states navy last may.","Will you be a Democrat, Republican, or Independent when you are old enough to vote?","My favorite time of the year is fall."],"answer":"B","why":"«United States Navy» and «May» need capital letters."},{"id":"g6q92","text":"Which sentence is capitalized INCORRECTLY?","options":["Will you be a Democrat, Republican, or Independent when you are old enough to vote?","My favorite time of the year is fall.","Did the bronze age come before or after the iron age?","My great-grandfather worked on the famous newspaper New York World."],"answer":"C","why":"«Bronze Age» and «Iron Age» are historical periods → capitals."},{"id":"g6q93","text":"Which sentence is capitalized INCORRECTLY?","options":["My favorite time of the year is fall.","I am learning german, but Otto is learning japanese.","My great-grandfather worked on the famous newspaper New York World.","Will you be a Democrat, Republican, or Independent when you are old enough to vote?"],"answer":"B","why":"Languages («German», «Japanese») are capitalized."},{"id":"g6q94","text":"What is the correct way to write \"My brother joined the united states navy last may.\"?","options":["My brother joined the United States Navy last May.","My brother joined the United states navy last May.","My brother joined the united States Navy last may.","No change is needed."],"answer":"A","why":"Country names, organizations and months are capitalized."},{"id":"g6q95","text":"What is the correct way to write \"I am learning german, but Otto is learning japanese.\"?","options":["I am learning German, but otto is learning Japanese.","I am learning German, but Otto is learning Japanese.","I am Learning german, but Otto is learning japanese.","No change is needed."],"answer":"B","why":"Languages are proper nouns → capital letters."}],"tip":"Capitalization rule: capitalize names of countries, organizations, months, languages and historical periods. Seasons (fall) are not capitalized."},{"title":"Part 8: Formal & Informal Language","passage":"","questions":[{"id":"g6q96","text":"Which sentence is FORMAL?","options":["C'mon. Let's go try that one over there, guys!","I like totally understand that!","I enjoy basketball as much as football.","Hey man, what's up?"],"answer":"C"},{"id":"g6q97","text":"Which sentence is INFORMAL?","options":["Good afternoon. How are you?","May I please bring something to the party on Saturday?","I help my sister with her homework every evening.","Dude, that was a great trick!"],"answer":"D"},{"id":"g6q98","text":"Which sentence is INFORMAL?","options":["There's only so much I can do to try to bring 'em home today.","She walked slowly to the door and said, \"Hello?\"","I enjoy basketball as much as football.","Good afternoon. How are you?"],"answer":"A"},{"id":"g6q99","text":"Which sentence is FORMAL?","options":["Hey man, what's up?","I like totally understand that!","May I please bring something to the party on Saturday?","C'mon. Let's go try that one over there, guys!"],"answer":"C"},{"id":"g6q100","text":"Which sentence is FORMAL?","options":["Dude, that was a great trick!","She walked slowly to the door and said, \"Hello?\"","There's only so much I can do to try to bring 'em home today.","Hey man, what's up?"],"answer":"B"}],"tip":"Formal language: polite, full words, no slang. Informal: casual words like «dude», «hey», «’em», «like totally»."},{"title":"Part 9: Writing","passage":"","questions":[{"id":"g6w1","type":"writing","text":"Choose ONE topic and write a paragraph about it: (a) My Dream for a Better World, or (b) The Most Important Lesson I Have Learned."}]}]},{"id":"ex_4ihwn18qmvnpr7yu","title":"Test","subject":"Ali","teacher":"Just for test","assignedTo":["mansour"],"createdAt":"2026-10-25T10:57:25.014Z","sections":[{"title":"Part 1","passage":"Test","questions":[{"id":"qnm87zijlmvnpr7yu","text":"What is your name?","options":["Ali","Mansour","Baby","Kaka"],"answer":"B"}]}]},{"id":"ex_ar4_term1","title":"لغتي – الصف الرابع – أسئلة الفصل الدراسي الأول","subject":"Arabic (لغتي)","teacher":"","rtl":true,"assignedTo":["mansour"],"createdAt":"2026-10-26T12:30:00.000Z","sections":[{"title":"السؤال الأول: فهم المقروء","passage":"كانَ رَسّامٌ عَجوزٌ يَرْسُمُ لَوْحاتٍ جَميلَةً وَيَبيعُها، وَفي يَوْمٍ مِنَ الأَيّامِ وَقَفَ فَقيرٌ بِبابِهِ وَقالَ: أَنْتَ غَنِيٌّ، فَلِماذا لا تُساعِدُ الفُقَراءَ؟ انْظُرْ كَيْفَ يُوَزِّعُ الجَزّارُ جارُكَ اللَّحْمَ على الفُقَراءِ؟ رَدَّ عَلَيْهِ الرَّسّامُ العَجوزُ أَنا لا أَمْلِكُ مالاً لِأُساعِدَ بِهِ أَحَداً. انْزَعَجَ الفَقيرُ مِنْ رَدِّ الرَّسّامِ، وَأَشاعَ بَيْنَ النّاسِ بِأَنَّ الرَّسّامَ ثَرِيٌّ لكِنَّهُ بَخيلٌ؛ فَنَقَموا عَلَيْهِ. مَرِضَ الرَّسّامُ وَلَمْ يَهْتَمَّ بِهِ أَحَدٌ، وَماتَ وَحيداً، بَعْدَ مَوْتِهِ لَمْ يَعُدِ الجَزّارُ يُرْسِلُ لِلْفُقَراءِ لَحْماً مَجّانِيّاً وَعِنْدَما سَأَلوهُ عَنِ السَّبَبِ، قالَ: إِنَّ الرَّسّامَ العَجوزَ كانَ يُعْطيهِ كُلَّ شَهْرٍ مَبْلَغاً؛ لِيُرْسِلَ لَحْماً لِلْفُقَراءِ، وَالآنَ وَقَدْ ماتَ تَوَقَّفَ تَوْزيعُ اللَّحْمِ المَجّانِيِّ. لَمّا عَلِمَ النّاسُ الحَقيقَةَ، حَزِنوا على الرَّسّامِ، وَنَدِموا على تَقْصيرِهِمْ مَعَهُ.","questions":[{"id":"ar4q1","text":"ماذا كان يرسم العجوز؟","options":["لوحات جميلة","حيوانات رائعة","صورًا جميلة"],"answer":"A","why":"النص يقول: «كان رسام عجوز يرسم لوحات جميلة ويبيعها»."},{"id":"ar4q2","text":"بماذا وصف الفقيرُ الرسامَ؟","options":["غني كريم","غني بخيل","رسام مبدع"],"answer":"B","why":"الفقير أشاع بين الناس أن الرسام ثري لكنه بخيل."},{"id":"ar4q3","text":"سبب غضب الناس من الرسام:","options":["توقف توزيع اللحم","الإشاعات الكاذبة","لوحات الرسام وبيعها"],"answer":"A","why":"غضب الناس بسبب الإشاعات الكاذبة التي نشرها الفقير."},{"id":"ar4q4","text":"لماذا توقف الجزار عن توزيع اللحم على الفقراء؟","options":["كراهية للفقراء","بسبب موت الجزار","بسبب موت الرسام"],"answer":"C","why":"الجزار توقف لأن الرسام الذي كان يدفع له ثمن اللحم مات."},{"id":"ar4q5","text":"بين كلمة «فقير» و«غني»:","options":["ترادف","تضاد","تجانس"],"answer":"B","why":"فقير وغني كلمتان متضادتان في المعنى."},{"id":"ar4q6","text":"الدرس المستفاد من هذه القصة:","options":["لا تحكم على الظاهر","العلم خير من المال","الفقر خير من الغنى"],"answer":"A","why":"الناس حكموا على الرسام من الظاهر وندموا عندما عرفوا الحقيقة."},{"id":"ar4q7","text":"«لم يهتم به أحد» نوع الجملة السابقة:","options":["مثبتة","منفية","استفهامية"],"answer":"B","why":"الجملة فيها أداة النفي «لم» فهي جملة منفية."}],"tip":"ارجع إلى النص واقرأ الجملة التي تحتوي على الإجابة."},{"title":"السؤال الثاني: اختر الإجابة الصحيحة","passage":"","questions":[{"id":"ar4q8","text":"«أشرقت الشمس الساعة السادسة» الكلمة التي بها همزة قطع:","options":["أشرقت","الشمس","السادسة"],"answer":"A","why":"«أشرقت» تبدأ بهمزة قطع تُنطق دائمًا."},{"id":"ar4q9","text":"«جهزت نورة بعض الفواكه» الفعل في الجملة السابقة:","options":["جهزت","نورة","الفواكه"],"answer":"A","why":"«جهزت» فعل ماضٍ يدل على حدث."},{"id":"ar4q10","text":"«الثمار ناضجة» نوع الجملة السابقة:","options":["جملة فعلية","جملة اسمية","شبه جملة"],"answer":"B","why":"«الثمار ناضجة» تبدأ باسم فهي جملة اسمية."}],"tip":"همزة القطع تُنطق في أول الكلام ووسطه (أ، إ). الفعل كلمة تدل على حدث وزمن. الجملة الاسمية تبدأ باسم، والفعلية تبدأ بفعل."},{"title":"السؤال الثالث: صواب أم خطأ","passage":"","questions":[{"id":"ar4q11","text":"الكلمة ثلاثة أقسام: اسم وفعل وحرف.","options":["صواب ✓","خطأ ✗"],"answer":"A","why":"الكلمة ثلاثة أقسام: اسم وفعل وحرف."},{"id":"ar4q12","text":"كلمة «انتصر» بها همزة وصل.","options":["صواب ✓","خطأ ✗"],"answer":"A","why":"«انتصر» فعل خماسي يبدأ بهمزة وصل."},{"id":"ar4q13","text":"تكتب الهمزة المتطرفة على الواو إذا كان ما قبلها مكسورًا.","options":["صواب ✓","خطأ ✗"],"answer":"B","why":"إذا كان ما قبل الهمزة مكسورًا تُكتب على الياء (نبرة) لا على الواو."},{"id":"ar4q14","text":"كلمة «انتشر» بها همزة وصل.","options":["صواب ✓","خطأ ✗"],"answer":"A","why":"«انتشر» فعل خماسي يبدأ بهمزة وصل."},{"id":"ar4q15","text":"تكتب الهمزة المتطرفة على الواو إذا كان ما قبلها مفتوحًا.","options":["صواب ✓","خطأ ✗"],"answer":"B","why":"إذا كان ما قبل الهمزة مفتوحًا تُكتب على الألف لا على الواو."},{"id":"ar4q16","text":"حوّل الجملة الاسمية «العلم يرفع شأن صاحبه» إلى جملة فعلية:","options":["يرفع العلم شأن صاحبه","شأن صاحبه يرفعه العلم","العلم شأنه مرفوع"],"answer":"A","why":"الجملة الفعلية تبدأ بالفعل: يرفع العلم شأن صاحبه."},{"id":"ar4q17","text":"أعرب كلمة «العلم» في جملة «العلم نور»:","options":["مبتدأ مرفوع وعلامة رفعه الضمة","خبر مرفوع وعلامة رفعه الضمة","فاعل مرفوع وعلامة رفعه الضمة"],"answer":"A","why":"«العلم» اسم في أول الجملة الاسمية فهو مبتدأ مرفوع بالضمة."},{"id":"ar4q18","text":"«السماء تمطر لاكن الجو معتدل» صوّب الخطأ في الجملة السابقة:","options":["السماء تمطر لكن الجو معتدل","السماء تمطر لاكين الجو معتدل","السماء تمطر لكين الجو معتدل"],"answer":"A","why":"الصواب «لكن» بدون ألف."},{"id":"ar4q19","text":"حوّل الجملة الفعلية «نسق البستاني الحديقة» إلى جملة اسمية:","options":["البستاني نسق الحديقة","الحديقة نسق البستاني","نسق الحديقة البستاني"],"answer":"A","why":"الجملة الاسمية تبدأ بالاسم: البستاني نسق الحديقة."},{"id":"ar4q20","text":"أعرب كلمة «صافية» في جملة «السماء صافية»:","options":["مبتدأ مرفوع وعلامة رفعه الضمة","خبر مرفوع وعلامة رفعه الضمة","فاعل مرفوع وعلامة رفعه الضمة"],"answer":"B","why":"«صافية» تخبر عن السماء فهي خبر مرفوع بالضمة."}],"tip":"تذكّر: الهمزة المتطرفة تُكتب على الواو إذا كان ما قبلها مضمومًا، وعلى الألف إذا كان مفتوحًا، وعلى الياء إذا كان مكسورًا."},{"title":"السؤال الرابع: الظاهرة الإملائية","passage":"","questions":[{"id":"ar4q21","text":"«أكرم الرجل الضيف» الكلمة التي بها همزة قطع:","options":["أكرم","الرجل","الضيف"],"answer":"A","why":"«أكرم» تبدأ بهمزة قطع لأنها تُنطق في أول الكلام ووسطه."},{"id":"ar4q22","text":"هي التي تنطق في أول الكلام وفي وسطه:","options":["همزة القطع","همزة الوصل","همزة ابن"],"answer":"A","why":"همزة القطع هي التي تُنطق في أول الكلام وفي وسطه."},{"id":"ar4q23","text":"عند وصل حروف كلمة «مَ ـ بْ ـ دَ ـ ءٌ» تكتب:","options":["مبدئ","مبدأ","مبدء"],"answer":"B","why":"ما قبل الهمزة مفتوح (دَ) فتُكتب على الألف: مبدأ."}],"tip":"همزة القطع تُنطق دائمًا (أكرم، أعلن). همزة الوصل لا تُنطق في وسط الكلام (استمع، ابن)."},{"title":"السؤال الخامس: الوظيفة النحوية","passage":"","questions":[{"id":"ar4q24","text":"«تشرق الشمس صباحًا» الفعل في الجملة السابقة:","options":["تشرق","الشمس","صباحًا"],"answer":"A","why":"«تشرق» فعل مضارع يدل على حدث."},{"id":"ar4q25","text":"«أصبح المريض يتألم» الاسم في الجملة السابقة كلمة:","options":["أصبح","المريض","يتألم"],"answer":"B","why":"«المريض» اسم، أما «أصبح» و«يتألم» فهما فعلان."},{"id":"ar4q26","text":"«البحر هادئ» نوع الجملة السابقة:","options":["جملة اسمية","جملة فعلية","شبه جملة"],"answer":"A","why":"«البحر هادئ» تبدأ باسم فهي جملة اسمية."},{"id":"ar4q27","text":"«الطالب يذاكر الدرس» اجعل الجملة السابقة جملة فعلية:","options":["يذاكر الطالب الدرس","الدرس يذاكر الطالب","الطالب يذاكر الدرس"],"answer":"A","why":"الجملة الفعلية تبدأ بالفعل: يذاكر الطالب الدرس."},{"id":"ar4q28","text":"حدد الجملة المختلفة:","options":["الهواء عليل","أشرقت الشمس","القمر ساطع"],"answer":"B","why":"«أشرقت الشمس» جملة فعلية، والجملتان الأخريان اسميتان."}],"tip":"الجملة الاسمية تبدأ باسم (البحر هادئ)، والجملة الفعلية تبدأ بفعل (تشرق الشمس)."},{"title":"السؤال السادس: اختر الإجابة الصحيحة","passage":"","questions":[{"id":"ar4q29","text":"«أعلن المدير اسم الفائز» الكلمة التي بها همزة قطع:","options":["أعلن","المدير","اسم"],"answer":"A","why":"«أعلن» تبدأ بهمزة قطع."},{"id":"ar4q30","text":"رسمت الطالبة ......... جميلة.","options":["لوحه","لوحت","لوحة"],"answer":"C","why":"«لوحة» تنتهي بتاء مربوطة لأنها اسم مفرد."},{"id":"ar4q31","text":"«زارت نورة مدينة جدة» الفعل في الجملة السابقة:","options":["زارت","مدينة","جدة"],"answer":"A","why":"«زارت» فعل ماضٍ."},{"id":"ar4q32","text":"سارت السيارة بـ.......","options":["بطْأ","بطْئ","بطْء"],"answer":"C","why":"ما قبل الهمزة ساكن (طْ) فتُكتب على السطر: بطء."},{"id":"ar4q33","text":"الجملة الاسمية فيما يلي:","options":["يعتدل الجو","الثمار ناضجة","تتفتح الأزهار"],"answer":"B","why":"«الثمار ناضجة» تبدأ باسم فهي جملة اسمية."}],"tip":"التاء المربوطة في آخر الاسم (لوحة). الهمزة المتطرفة بعد سكون تُكتب على السطر (بطء)."}]},{"id":"ex_fr4_mid1_2026","title":"Grade 4 French – 1st Mid-Term Worksheet 2026","subject":"French (Français)","teacher":"","assignedTo":["mansour"],"createdAt":"2026-10-27T09:45:00.000Z","sections":[{"title":"Q1: Match the words (Reliez)","passage":"","questions":[{"id":"fr4q1","text":"\"Parfum\" means…","options":["Perfume","Snail","Eiffel Tower","Louvre museum"],"answer":"A"},{"id":"fr4q2","text":"\"Milou\" means…","options":["Snail","Snowy","Perfume","Louvre museum"],"answer":"B"},{"id":"fr4q3","text":"\"Escargot\" means…","options":["Eiffel Tower","Perfume","Snail","Snowy"],"answer":"C"},{"id":"fr4q4","text":"\"Tour Eiffel\" means…","options":["Louvre museum","Snail","Snowy","Eiffel Tower"],"answer":"D"},{"id":"fr4q5","text":"\"Musée du Louvre\" means…","options":["Louvre museum","Eiffel Tower","Perfume","Snail"],"answer":"A"}],"tip":"Remember the French word and its English meaning from the lesson."},{"title":"Q2: Find the words (Trouvez les mots)","passage":"","questions":[{"id":"fr4q6","text":"Unscramble: D O M E","options":["mode","dome","demo","omed"],"answer":"A"},{"id":"fr4q7","text":"Unscramble: O R T U   I F E L E F","options":["tour effile","tour eiffel","trou eiffel","four eiffel"],"answer":"B"},{"id":"fr4q8","text":"Unscramble: R U F A P M","options":["farpum","pumfar","parfum","rufmap"],"answer":"C"},{"id":"fr4q9","text":"Unscramble: E F R G M A O","options":["gramfoe","formage","fromgae","fromage"],"answer":"D"}],"tip":"Unscramble tip: look for letters that make a word you know (mode, tour eiffel, parfum, fromage)."},{"title":"Q3: Fill in the missing letter","passage":"","questions":[{"id":"fr4q10","text":"Lo _ vre","options":["u","a","e","i"],"answer":"A"},{"id":"fr4q11","text":"Li _ re","options":["b","v","f","p"],"answer":"B"},{"id":"fr4q12","text":"_ agon","options":["V","G","W","N"],"answer":"C"},{"id":"fr4q13","text":"O _ an g e","options":["n","l","t","r"],"answer":"D"}],"tip":"Spelling: Louvre, Livre, Wagon, Orange."},{"title":"Q4: Find the odd one out (Chassez l'intrus)","passage":"","questions":[{"id":"fr4q14","text":"Which word is the odd one out?","options":["Burger","Orange","Glace","Ballon"],"answer":"D","why":"Burger, orange and glace are food; a ballon (ball) is not."},{"id":"fr4q15","text":"Which word is the odd one out?","options":["Avion","Yeux","Wagon","Voiture"],"answer":"B","why":"Avion, wagon and voiture are vehicles; yeux (eyes) is a body part."},{"id":"fr4q16","text":"Which word is the odd one out?","options":["Maison","Éléphant","École","Musée"],"answer":"B","why":"Maison, école and musée are buildings; éléphant is an animal."},{"id":"fr4q17","text":"Which word is the odd one out?","options":["Dauphin","Zèbre","Table","Kangourou"],"answer":"C","why":"Dauphin, zèbre and kangourou are animals; table is furniture."}]},{"title":"Q5 & Q8: Correct accents","passage":"","questions":[{"id":"fr4q18","text":"Choose the correct spelling: Ecole","options":["école","ecolé","écolé","ecole"],"answer":"A"},{"id":"fr4q19","text":"Choose the correct spelling: Hotel","options":["hotél","hôtel","hôtél","hotel"],"answer":"B"},{"id":"fr4q20","text":"Choose the correct spelling: Musee","options":["muse","musèe","musée","musee"],"answer":"C"},{"id":"fr4q21","text":"Choose the correct spelling: Voila","options":["voilàa","voila","vòila","voilà"],"answer":"D"},{"id":"fr4q22","text":"Rewrite with the correct accent: Desole","options":["Désolé","Desolé","Désole","Dèsolè"],"answer":"A"},{"id":"fr4q23","text":"Rewrite with the correct accent: Francais","options":["Français","Fránçais","Francáis","Françáis"],"answer":"A"},{"id":"fr4q24","text":"Rewrite with the correct accent: A bientot","options":["à bientot","a bientôt","à bientôt","á bientót"],"answer":"C"},{"id":"fr4q25","text":"Rewrite with the correct accent: Enchante","options":["Enchànte","Enchanté","Énchante","Enchantè"],"answer":"B"}],"tip":"Accents matter: école, hôtel, musée, voilà, Désolé, Français (ç), à bientôt, Enchanté."},{"title":"Q6, Q7 & Q11: Greetings and dialogue","passage":"","questions":[{"id":"fr4q26","text":"A man greets you. You say: « Bonjour, ___ »","options":["monsieur","madame","merci","salut"],"answer":"A"},{"id":"fr4q27","text":"A girl greets you. You say: « ___, Monsieur »","options":["Merci","Au revoir","Bonjour","Voilà"],"answer":"C"},{"id":"fr4q28","text":"What do you say to your teacher when she enters the class?","options":["Merci","Bonjour, Madame","Au revoir","S’il vous plaît"],"answer":"B"},{"id":"fr4q29","text":"You raise your hand to ask the teacher something. What do you say?","options":["Bonjour","Merci","Voilà","Excusez-moi"],"answer":"D"},{"id":"fr4q30","text":"Complete the dialogue: « Bonjour, ___ » (to a man)","options":["madame","monsieur","merci","au revoir"],"answer":"B"},{"id":"fr4q31","text":"Complete the dialogue: « Bonjour, ___ » (to a woman)","options":["monsieur","madame","salut","merci"],"answer":"B"},{"id":"fr4q32","text":"Complete the dialogue: « 1 ballon, ___ »","options":["s’il vous plaît","au revoir","madame","bonjour"],"answer":"A"},{"id":"fr4q33","text":"Complete the dialogue: « ___. Au revoir ! »","options":["Bonjour","Monsieur","Merci","Voilà"],"answer":"C"}],"tip":"Bonjour, monsieur (man) / madame (woman). Excusez-moi = excuse me. S’il vous plaît = please. Merci = thank you."},{"title":"Q9 & Q10: Complete the words","passage":"","questions":[{"id":"fr4q34","text":"___jour","options":["Bon","Mad","Mon","Ma"],"answer":"A"},{"id":"fr4q35","text":"___ame","options":["Mon","Bon","Mad","Ma"],"answer":"C"},{"id":"fr4q36","text":"___sieur","options":["Mon","Mad","Ma","Bon"],"answer":"A"},{"id":"fr4q37","text":"___demoiselle","options":["Mad","Mon","Bon","Ma"],"answer":"D"},{"id":"fr4q38","text":"Bonne ___","options":["revoir","chance","plaît","moi plaît"],"answer":"B"},{"id":"fr4q39","text":"Au ___","options":["chance","plaît","revoir","moi plaît"],"answer":"C"},{"id":"fr4q40","text":"Excusez-___","options":["moi","chance","revoir","plaît"],"answer":"A"},{"id":"fr4q41","text":"S’il vous ___","options":["revoir","moi","chance","plaît"],"answer":"D"}],"tip":"Bonjour, Madame, Monsieur, Mademoiselle, Bonne chance, Au revoir, Excusez-moi, S’il vous plaît."},{"title":"Q12 & Q13: Write in French","passage":"","questions":[{"id":"fr4q42","text":"\"Hello\" in French is…","options":["salut","bonjour","merci","au revoir"],"answer":"B"},{"id":"fr4q43","text":"\"Hi\" in French is…","options":["salut","bonjour","madame","à bientôt"],"answer":"A"},{"id":"fr4q44","text":"\"Thank you\" in French is…","options":["bonjour","salut","merci","voilà"],"answer":"C"},{"id":"fr4q45","text":"\"Madam\" in French is…","options":["monsieur","mademoiselle","merci","madame"],"answer":"D"},{"id":"fr4q46","text":"When we meet, we say…","options":["Salut, bonjour","Au revoir, à bientôt","Merci, voilà","Excusez-moi"],"answer":"A"},{"id":"fr4q47","text":"When we leave, we say…","options":["Bonjour, salut","Au revoir, à bientôt","Merci, madame","S’il vous plaît"],"answer":"B"}],"tip":"Hello = bonjour, Hi = salut, Thank you = merci, Madam = madame. Meeting: Salut, bonjour. Leaving: Au revoir, à bientôt."},{"title":"Q14, Q15 & Q19: Spelling","passage":"","questions":[{"id":"fr4q48","text":"Unscramble: J – O – U – R – N – O – B","options":["BONJOUR","JOURBON","BOJOURN","BONJUOR"],"answer":"A"},{"id":"fr4q49","text":"Unscramble: T – U – L – A – S","options":["TULAS","SALUT","LASUT","SATUL"],"answer":"B"},{"id":"fr4q50","text":"Unscramble: E – r – c – i – m","options":["MERIC","CRIME","MERCI","RECIM"],"answer":"C"},{"id":"fr4q51","text":"Unscramble: A – u . v – o – i – r – r – e","options":["AU VOIRRE","AU REVIOR","AU ROVIER","AU REVOIR"],"answer":"D"},{"id":"fr4q52","text":"Correct the spelling: AVIYON","options":["AVION","AVIYON","AVOIN","AVIONE"],"answer":"A"},{"id":"fr4q53","text":"Correct the spelling: NAY","options":["NAI","NID","NAY","NIE"],"answer":"B"},{"id":"fr4q54","text":"Correct the spelling: KUEUE","options":["QUEU","KUEUE","QUEUE","CUEUE"],"answer":"C"},{"id":"fr4q55","text":"Correct the spelling: ROUBE","options":["ROUBE","RUOGE","ROGUE","ROUGE"],"answer":"D"},{"id":"fr4q56","text":"Correct the spelling: \"Decouvrens la Frense\"","options":["Découvrons la France","Decouvrens la France","Découvrens la Frence","Decouvrons la Frense"],"answer":"A"},{"id":"fr4q57","text":"Correct the spelling: \"Un beau garsson\"","options":["Un beau garson","Un beau garçon","Un beau garssone","Un beu garçon"],"answer":"B"}],"tip":"Check the spelling letter by letter: AVION, NID, QUEUE, ROUGE, Découvrons la France, garçon (ç)."},{"title":"Q16, Q17 & Q18: Words, spelling names, culture","passage":"","questions":[{"id":"fr4q58","text":"Which word starts with the letter M?","options":["Avion","Stylo","Maison","Voiture"],"answer":"C"},{"id":"fr4q59","text":"Which word starts with the letter A?","options":["Maison","Avion","Stylo","Voiture"],"answer":"B"},{"id":"fr4q60","text":"Which word starts with the letter S?","options":["Stylo","Maison","Avion","Voiture"],"answer":"A"},{"id":"fr4q61","text":"Which word starts with the letter V?","options":["Avion","Stylo","Maison","Voiture"],"answer":"D"},{"id":"fr4q62","text":"Spell the name: Anne","options":["A-n-e","A-n-n-e","A-n-n","A-n-n-é"],"answer":"B"},{"id":"fr4q63","text":"Spell the name: Martin","options":["M-a-r-t-i-n","M-a-r-t-e-n","M-a-t-r-i-n","M-a-r-t-i-n-e"],"answer":"A"},{"id":"fr4q64","text":"Spell the name: Paul","options":["P-o-l","P-a-u-l-e","P-a-u-l","P-u-a-l"],"answer":"C"},{"id":"fr4q65","text":"Spell the name: Zazie","options":["Z-a-z-i","Z-a-s-i-e","Z-a-z-y","Z-a-z-i-e"],"answer":"D"},{"id":"fr4q66","text":"What is the capital of France?","options":["Lyon","Paris","Nice","Marseille"],"answer":"B"},{"id":"fr4q67","text":"Which famous painting do you find in the Louvre museum?","options":["Mona Lisa","The Scream","Starry Night","Sunflowers"],"answer":"A"}],"tip":"Maison, Avion, Stylo, Voiture. Capital of France = Paris. The Mona Lisa is in the Louvre."}]},{"id":"ex_fr6_mid1_2026","title":"Grade 6 French – 1st Mid-Term Revision","subject":"French (Français)","teacher":"Wafa Ghabri","assignedTo":["aleen"],"createdAt":"2026-10-27T09:47:00.000Z","sections":[{"title":"Compréhension: Vrai ou Faux","passage":"Voici Maria. Elle est italienne. Elle a douze ans. Elle est petite et mignonne. Elle a les cheveux bruns. Elle porte une robe rouge. Elle habite à Rome.","questions":[{"id":"fr6q1","text":"Maria est italienne.","options":["Vrai","Faux"],"answer":"A","why":"Le texte dit: «Elle est italienne.»"},{"id":"fr6q2","text":"Maria a douze ans.","options":["Vrai","Faux"],"answer":"A","why":"Le texte dit: «Elle a douze ans.»"},{"id":"fr6q3","text":"Maria est grande.","options":["Vrai","Faux"],"answer":"B","why":"Le texte dit: «Elle est petite», pas grande."},{"id":"fr6q4","text":"Elle porte une robe bleue.","options":["Vrai","Faux"],"answer":"B","why":"Elle porte une robe rouge, pas bleue."}],"tip":"Relis le texte: Maria est italienne, elle a douze ans, elle est petite, elle porte une robe rouge, elle habite à Rome."},{"title":"Compréhension: Choisis la bonne réponse","passage":"Voici Maria. Elle est italienne. Elle a douze ans. Elle est petite et mignonne. Elle a les cheveux bruns. Elle porte une robe rouge. Elle habite à Rome.","questions":[{"id":"fr6q5","text":"Maria habite à :","options":["Paris","Rome","Lyon"],"answer":"B"},{"id":"fr6q6","text":"Elle a les cheveux :","options":["bruns","blonds","courts"],"answer":"A"},{"id":"fr6q7","text":"Elle porte une robe :","options":["verte","blanche","rouge"],"answer":"C"},{"id":"fr6q8","text":"Maria est :","options":["petite","grande","vieille"],"answer":"A"}],"tip":"Relis le texte: Rome, cheveux bruns, robe rouge, petite."},{"title":"Grammaire: L'accord des adjectifs","passage":"Rappel — Féminin : on ajoute -e (petit → petite, blanc → blanche, gentil → gentille). Pluriel : on ajoute -s (bleu → bleus, grand → grands).","questions":[{"id":"fr6q9","text":"Maria est ___","options":["petit","petite"],"answer":"B","why":"Maria est une fille → féminin: petite."},{"id":"fr6q10","text":"La fille est ___","options":["gentil","gentille"],"answer":"B","why":"La fille → féminin: gentille."},{"id":"fr6q11","text":"Les livres sont ___","options":["bleu","bleus"],"answer":"B","why":"Les livres → pluriel: bleus."},{"id":"fr6q12","text":"La robe est ___","options":["blanc","blanche"],"answer":"B","why":"La robe
