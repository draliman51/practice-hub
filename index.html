    <div class="row" style="justify-content:center">${session&&session.role==='admin'?`<button class="ghost" onclick="view={name:'admin',tab:'overview'};render()">← Back to admin</button>`:`<button onclick="startExam('${r.examId}')">Try again 🔁</button><button class="ghost" onclick="view={name:'home'};render()">Home 🏠</button>`}</div>
  </div>
  ${session&&session.role==='student'?sendCodeBoxCard(r.studentId):''}

  ${exam?`<div class="card"${exam.rtl?' dir="rtl"':''}><h3 dir="ltr">Review your answers 🔎</h3><p class="muted small">Green = correct answer, red = the one you picked. Each mistake has a short explanation 💡.</p>
   ${(r.wrong||[]).length?`<div class="row" style="gap:.4rem;margin:.3rem 0 .6rem"><span class="pill coral">${(r.wrong||[]).length} to review</span><button class="sm ghost" onclick="document.querySelectorAll('.rev-ok').forEach(x=>x.hidden=!x.hidden);this.textContent=this.textContent.startsWith('Show')?'Hide correct ones':'Show correct ones'">Hide correct ones</button></div>`:''}
   ${exam.sections.flatMap(sec=>sec.questions.filter(q=>q.type!=='writing').map(q=>{const mine=ANS[q.id];const ok=mine===q.answer;const why=ok?'':`<div class="why"><span>💡</span><span><b>${mine?'Why':'Not answered'}:</b> ${esc(q.why||('The correct answer is '+LT(exam,'ABCD'.indexOf(q.answer))+': '+q.options['ABCD'.indexOf(q.answer)]+'.'))}${sec.tip?' <span class="muted">'+esc(sec.tip)+'</span>':''}</span></div>`;return `<div class="${ok?'rev-ok':''}" style="margin:.9rem 0;padding-top:.6rem;border-top:1px solid var(--line)"><p><span class="pill ${ok?'mint':'coral'}">${ok?'✓':'✗'}</span> <b>${esc(q.text)}</b></p>${q.options.map((o,k)=>{const L='ABCD'[k];const cls=L===q.answer?'ok':(L===mine&&!ok?'bad':'');return `<div class="opt ${cls}" style="padding:.45rem .8rem;margin:.3rem 0;font-size:.95rem;cursor:default"><span class="ltr" style="flex-basis:30px;height:30px;font-size:.95rem">${LT(exam,k)}</span><span>${esc(o)}</span></div>`}).join('')}${why}</div>`})).join('')}
   ${r.writing?`<div style="margin-top:1rem"><h3>Your writing ✍️</h3><div class="passage" style="white-space:pre-wrap">${esc(r.writing)}</div><p class="muted small">Dad will read this one.</p></div>`:''}</div>`:''}`;
}
function sendCodeBoxCard(sid){ const b=sendCodeBox(sid); return b?`<div class="card">${b.replace('margin-top:1rem;padding-top:.8rem;border-top:2px dashed var(--line)','')}</div>`:''; }
function sectionBars(sections){
  return Object.entries(sections||{}).map(([k,v])=>{const p=v.total?Math.round(100*v.correct/v.total):0;return `<div class="bar"><span class="lbl" title="${esc(k)}">${esc(k)}</span><span class="trk"><i class="${p>=75?'':p>=50?'mid':'low'}" style="width:${p}%"></i></span><span class="val">${p}%</span></div>`}).join('')||'<p class="muted">No sections.</p>';
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#2EA8E6','#FFC83D','#FF6B6B','#2EC48A','#8E6CFF'];for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'vw';s.style.background=cols[i%5];s.style.animationDelay=Math.random()*.8+'s';s.style.transform='rotate('+Math.random()*360+'deg)';c.append(s);}document.body.append(c);setTimeout(()=>c.remove(),3600);}
function trendChart(rs){
  const pts=rs.slice(0,12).reverse(); if(pts.length<2) return '';
  const W=600,H=180,px=40,py=22; const xs=i=>px+(W-2*px)*i/(pts.length-1); const ys=p=>H-py-(H-2*py)*p/100;
  const path=pts.map((r,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(pct(r)).toFixed(1)).join(' ');
  const area=path+` L${xs(pts.length-1).toFixed(1)} ${ys(0)} L${xs(0).toFixed(1)} ${ys(0)} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend across attempts">${[0,50,100].map(g=>`<line x1="${px}" x2="${W-px}" y1="${ys(g)}" y2="${ys(g)}" stroke="var(--line)" stroke-width="1.5"/><text x="${px-6}" y="${ys(g)+4}" font-size="11" text-anchor="end" fill="var(--ink2)">${g}%</text>`).join('')}
  <path d="${area}" fill="var(--sky)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--sky)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map((r,i)=>`<circle cx="${xs(i)}" cy="${ys(pct(r))}" r="6" fill="${pct(r)>=75?'var(--mint)':pct(r)>=50?'var(--sun)':'var(--coral)'}" stroke="var(--card)" stroke-width="2.5"/><text x="${xs(i)}" y="${ys(pct(r))-11}" font-size="11" text-anchor="middle" font-weight="800" fill="var(--ink)">${pct(r)}</text>`).join('')}</svg>`;
}

  }).join('')+`<p class="muted center small">Results arrive here automatically from any device while server storage is on. If a child is offline, they can send a results code; paste it under <b>Import results</b>.</p>`;

    <div class="row"><button class="sm" onclick="draft.sections[${si}].questions.push({id:'q'+uid(),text:'',options:['','','',''],answer:'A'});render()">+ Question</button><button class="sm grape" onclick="draft.sections[${si}].questions.push({id:'q'+uid(),type:'writing',text:''});render()">+ Writing task</button></div>
  </div>`).join('')}
  <div class="card"><div class="row"><button class="ghost" onclick="draft.sections.push({title:'Part '+(draft.sections.length+1),passage:'',questions:[]});render()">+ Section</button><span class="grow"></span><button class="ghost" onclick="draft=null;view.tab='exams';render()">Discard</button><button class="mint" onclick="saveDraft()">Save exam</button></div>
  <p class="muted small" style="margin-top:.6rem">Tick the radio button next to the correct option. After saving, go to <b>Exams</b> and tap <b>Save &amp; publish</b>.</p></div>`;
}
function pasteImport(){
  const t=$('#pastebox').value; if(!t.trim()){toast('Paste some questions first');return;}
  const blocks=t.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean); const qs=[];
  blocks.forEach(b=>{const lines=b.split('\n').map(l=>l.trim()).filter(Boolean);const q={id:'q'+uid(),text:'',options:[],answer:'A'};lines.forEach(l=>{let m;if((m=l.match(/^([A-Da-d])[\)\.\:]\s*(.+)$/)))q.options['ABCD'.indexOf(m[1].toUpperCase())]=m[2];else if((m=l.match(/^answer\s*[:\-]?\s*([A-Da-d])\b/i)))q.answer=m[1].toUpperCase();else q.text=(q.text?q.text+' ':'')+l.replace(/^\d+[\.\)]\s*/,'');});if(q.text&&q.options.filter(Boolean).length>=2){while(q.options.length<4)q.options.push('');q.options=q.options.map(o=>o||'');qs.push(q);}});
  if(!qs.length){toast('No questions found in that text');return;}
  if(!draft.sections.length) draft.sections.push({title:'Part 1',passage:'',questions:[]});
  draft.sections[draft.sections.length-1].questions.push(...qs); render(); toast(qs.length+' questions added');
}
function jsonImport(){
  const t=$('#pastebox').value.trim(); let o; try{o=JSON.parse(t)}catch(e){toast('Paste a valid exam JSON into the box first');return;}
  if(!o||!Array.isArray(o.sections)){toast('JSON needs a "sections" array');return;}
  o.id=o.id||'ex_'+uid(); o.assignedTo=o.assignedTo||['mansour']; o.createdAt=o.createdAt||new Date().toISOString();
  o.sections.forEach(s=>{s.questions=(s.questions||[]).map(q=>({id:q.id||'q'+uid(),...q}))});
  draft=o; render(); toast('Exam loaded. Check it, then Save.');
}
function saveDraft(){
  const d=draft; if(!d.title.trim()){toast('Give the exam a title');return;}
  d.sections=d.sections.filter(s=>s.questions.length);
  for(const s of d.sections) for(const q of s.questions){ if(!q.text.trim()){toast('A question in "'+s.title+'" has no text');return;} if(q.type!=='writing'){ q.options=q.options.map(o=>String(o).trim()); const last=q.options.map(Boolean).lastIndexOf(true); if(last<1){toast('Give at least two options in "'+s.title+'"');return;} if(q.options.slice(0,last+1).some(o=>!o)){toast('An option is empty in "'+s.title+'"');return;} q.options=q.options.slice(0,last+1); if(!q.options['ABCD'.indexOf(q.answer)]){toast('The correct answer must be one of the filled options in "'+s.title+'"');return;} } }
  if(!d.sections.length){toast('Add at least one question');return;}
  if(!d.assignedTo.length){toast('Assign it to at least one child');return;}
  const i=DATA.exams.findIndex(e=>e.id===d.id); if(i>=0)DATA.exams[i]=d; else DATA.exams.push(d);
  saveLocalData(); draft=null; view.tab='exams'; render(); toast('Exam saved. Now tap Save & publish.');
}
function adminImport(){
  return `<div class="card"><h2>Import results code</h2><p class="muted">If a result could not be sent to the server, the child’s page shows a results code (and a WhatsApp button). Paste that code here.</p>
  <textarea id="impcode" placeholder="Paste the code…"></textarea><button style="margin-top:.6rem" onclick="importCode()">Import</button></div>`;
}
async function importCode(){
  let arr; try{ arr=JSON.parse(decodeURIComponent(escape(atob($('#impcode').value.trim().replace(/^.*code:\s*/i,''))))); }catch(e){ toast('That code is not valid'); return; }
  let n=0; for(const r of arr){ if(r&&r.id&&r.studentId&&!RESULTS[r.id]){ n++; await pushResult(r); } }
  toast(n+' new result'+(n===1?'':'s')+' imported'); view.tab='overview'; render();
}
function adminSettings(){
  const st=DATA.settings;
  return `<div class="card"><h2>Accounts</h2>
  <label for="s_pw">Admin password</label><input id="s_pw" value="${esc(st.adminPass)}">
  ${st.students.map((s,i)=>`<div class="row" style="margin-top:.8rem"><img class="avatar" src="${s.avatar}" alt=""><div class="grow"><label for="s_n${i}" style="margin-top:0">Name</label><input id="s_n${i}" value="${esc(s.name)}"></div><div style="flex:0 0 110px"><label for="s_p${i}" style="margin-top:0">PIN (4 digits)</label><input id="s_p${i}" value="${esc(s.pin)}" inputmode="numeric" maxlength="4"></div><div style="flex:0 0 120px"><label for="s_g${i}" style="margin-top:0">Grade</label><input id="s_g${i}" value="${esc(s.grade||'')}"></div></div>`).join('')}
  <div class="row" style="margin-top:1rem"><button class="mint" onclick="saveSettings()">Save &amp; publish</button></div>
  <div class="notice warn" style="margin-top:.8rem">This is a family practice app: PINs and the password live inside the page, so keep the link within the family.</div></div>
  <div class="card"><h3>How syncing works</h3><ul class="tight small">
  <li><b>Exams</b> are saved to the server when you tap Save &amp; publish; every device that opens the site gets them.</li>
  <li><b>Results</b> sync to the server automatically (refreshed every 30 seconds). Server storage needs a Vercel Blob store connected to the project (see README).</li></ul></div>
  <div class="card"><h3>Danger zone</h3><button class="coral sm" onclick="clearResults()">Clear all results</button></div>`;
}
function clearResults(){ ask('Delete ALL results?','This removes every attempt on this device and on the server.','Delete everything',async()=>{await clearResultsServer();RESULTS={};saveLocalResults();render();}); }
function saveSettings(){
  const st=DATA.settings; st.adminPass=$('#s_pw').value||st.adminPass;
  st.students.forEach((s,i)=>{s.name=$('#s_n'+i).value||s.name; const p=$('#s_p'+i).value; if(/^\d{4}$/.test(p))s.pin=p; s.grade=$('#s_g'+i).value;});
  saveLocalData(); publishData().then(ok=>ok&&toast('Settings published ✅'));
}

/* ---------- start ---------- */
if(session&&session.role==='admin') view={name:'admin',tab:'overview'};
else if(session&&session.role==='student'&&student(session.id)){
  view={name:'home'};
  try{ const r=JSON.parse(sessionStorage.getItem(SS_RUN)||'null'); if(r&&DATA.exams.some(e=>e.id===r.examId)){ startExam(r.examId,r); } }catch(e){}
}
else session=null;
if(view.name!=='exam') render();
</script>
