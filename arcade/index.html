<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1140">
</head>
<body>
<title>Aleen & Mansour Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap">
<style>
/* Layout: one centered column, arcade "night sky" with floating blobs; big tappable tiles; games render inside a stage card */
:root{
  --bg:#141A3B; --bg2:#1F2A5E; --card:#243271; --card2:#2C3C85; --ink:#FFFFFF; --ink2:#B8C3F0; --line:#3A4C9C;
  --pink:#FF5DA2; --yellow:#FFD23F; --teal:#2EE6D6; --orange:#FF8A3D; --green:#4ADE80; --purple:#A78BFA; --red:#FF6B6B;
  --shadow:0 12px 30px rgba(0,0,0,.35);
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem;
  background-image:radial-gradient(circle at 10% 10%,rgba(255,93,162,.25) 0 160px,transparent 161px),radial-gradient(circle at 90% 25%,rgba(46,230,214,.22) 0 120px,transparent 121px),radial-gradient(circle at 20% 90%,rgba(255,210,63,.18) 0 140px,transparent 141px),radial-gradient(circle at 85% 85%,rgba(167,139,250,.22) 0 130px,transparent 131px);background-attachment:fixed}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin:.4rem 0}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:16px;padding:.8rem 1.3rem;color:#141A3B;background:var(--yellow);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s;touch-action:manipulation;min-width:0;user-select:none;-webkit-user-select:none}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
button.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
button.pink{background:var(--pink);color:#fff}button.teal{background:var(--teal)}button.orange{background:var(--orange);color:#fff}button.green{background:var(--green)}button.purple{background:var(--purple);color:#141A3B}
button.sm{padding:.45rem .85rem;border-radius:12px;font-size:.9rem}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:.65rem .9rem;width:100%;min-width:0}
.wrap{max-width:820px;margin:0 auto}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:1.2rem;margin:1rem 0;min-width:0}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.center{text-align:center}.muted{color:var(--ink2)}.small{font-size:.88rem}
.topbar{display:flex;align-items:center;gap:.7rem;padding:.8rem 0 .3rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.01em}
.brand span{color:var(--yellow)}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.7rem;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.4);flex:0 0 auto;background:var(--card2)}
.avatar.big{width:100px;height:100px;border-width:5px}
.av-dad{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--teal));display:grid;place-items:center;font-size:1.8rem;flex:0 0 auto;border:4px solid var(--card)}
.pill{display:inline-block;padding:.18rem .7rem;border-radius:999px;font-weight:800;font-size:.8rem;background:var(--card2);color:var(--ink);white-space:nowrap}
.pill.y{background:var(--yellow);color:#141A3B}.pill.p{background:var(--pink);color:#fff}.pill.t{background:var(--teal);color:#141A3B}.pill.g{background:var(--green);color:#141A3B}
/* login */
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem}
.who{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:1.2rem .8rem;text-align:center;cursor:pointer;border:3px solid transparent;transition:transform .12s,border-color .12s}
.who:hover{transform:translateY(-3px)}.who.sel{border-color:var(--yellow)}
.who .avatar,.who .av-dad{width:92px;height:92px;margin:0 auto;font-size:2.6rem}
.who .nm{font-family:var(--display);font-weight:600;font-size:1.2rem;margin-top:.5rem}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:280px;margin:1rem auto}
.pinpad button{padding:.9rem;font-size:1.4rem;background:var(--card2);color:var(--ink);box-shadow:none;border:2px solid var(--line);font-family:var(--display)}
.pinpad button.go{background:var(--teal);color:#141A3B;border-color:var(--teal)}
.dots{display:flex;gap:.6rem;justify-content:center;margin:.5rem 0}
.dots span{width:16px;height:16px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--teal)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.dedic{font-family:var(--display);font-weight:500;color:var(--ink2);font-size:1rem}
.dedic b{color:var(--pink);font-weight:700}
/* home */
.hero{background:linear-gradient(135deg,#5B3FD6,#FF5DA2 70%,#FF8A3D);color:#fff}
.hero .pill{background:rgba(255,255,255,.22);color:#fff}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
.tile{background:var(--card);border-radius:22px;padding:1rem .8rem;text-align:center;cursor:pointer;border:3px solid transparent;transition:transform .12s;box-shadow:var(--shadow);position:relative;min-width:0}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .ic{font-size:2.6rem;line-height:1.1}
.tile .nm{font-family:var(--display);font-weight:600;font-size:1.05rem;margin-top:.4rem}
.tile .cat{font-size:.72rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.tile .best{font-size:.78rem;margin-top:.3rem;color:var(--yellow);font-weight:800}
.tile[data-cat="brain"]{border-color:rgba(167,139,250,.5)}.tile[data-cat="memory"]{border-color:rgba(46,230,214,.5)}.tile[data-cat="fun"]{border-color:rgba(255,210,63,.5)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.7rem}
.stat div{background:var(--card2);border-radius:16px;padding:.7rem;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat small{color:var(--ink2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{padding:.5rem .4rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.75rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.tscroll{overflow-x:auto}
.mini{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:.3rem}
.mini-dad{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--teal));font-size:1rem;vertical-align:middle;margin-right:.3rem}
/* game stage */
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:1rem;margin:1rem 0;min-width:0}
.hud{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.hud .pl{display:flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:999px;background:var(--card2);font-weight:800;border:2px solid transparent}
.hud .pl.on{border-color:var(--yellow)}
.hud .pl img,.hud .pl .mini-dad{width:28px;height:28px;margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:.6rem 0}
.modes button{padding:1rem;border-radius:18px;font-size:1rem}
.board{display:grid;gap:.5rem;max-width:460px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:16px;background:var(--card2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.4rem;cursor:pointer;border:3px solid var(--line);user-select:none;-webkit-user-select:none;transition:transform .1s}
.cell:active{transform:scale(.95)}
.cell.win{background:var(--green);color:#141A3B;border-color:var(--green)}
.cell.x{color:var(--pink)}.cell.o{color:var(--teal)}
/* memory */
.mem{display:grid;gap:.45rem;max-width:480px;margin:0 auto}
.mcard{aspect-ratio:1;border-radius:14px;perspective:600px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:2rem}
.mcard .f{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-family:var(--display);font-weight:700}
.mcard .b{background:#fff;transform:rotateY(180deg);border:3px solid var(--teal)}
.mcard.done .b{background:#DFF7EC;border-color:var(--green)}
/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;background:#2F52B8;padding:.5rem;border-radius:18px;max-width:440px;margin:0 auto}
.c4 .slot{aspect-ratio:1;border-radius:50%;background:#141A3B;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.c4 .slot.r{background:var(--red)}.c4 .slot.y{background:var(--yellow)}
.c4 .slot.win{box-shadow:0 0 0 4px #fff inset}
.c4drop{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;max-width:440px;margin:0 auto .3rem}
.c4drop button{padding:.4rem 0;border-radius:10px;background:var(--card2);color:var(--ink);box-shadow:none;font-size:1.1rem}
/* simon */
.simon{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:360px;margin:0 auto}
.spad{aspect-ratio:1;border-radius:22px;opacity:.45;cursor:pointer;transition:opacity .08s,transform .08s;border:0}
.spad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 30px rgba(255,255,255,.5)}
/* math blitz & reaction */
.bigq{font-family:var(--display);font-size:2.6rem;font-weight:700;text-align:center;margin:.6rem 0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;max-width:420px;margin:0 auto}
.ans button{font-size:1.5rem;padding:1rem;background:var(--card2);color:var(--ink);box-shadow:none;border:3px solid var(--line);font-family:var(--display)}
.timer{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:.5rem 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .2s linear}
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:380px;margin:0 auto}
.hole{aspect-ratio:1;border-radius:50%;background:#2F3E7E;display:grid;place-items:center;font-size:2.6rem;cursor:pointer;border:4px solid var(--line);overflow:hidden}
.hole.up{background:#4B5FC0}
.hole span{transform:translateY(100%);transition:transform .12s}
.hole.up span{transform:translateY(0)}
/* sliding puzzle */
.slide{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:330px;margin:0 auto}
.slide .t{aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--purple));display:grid;place-items:center;font-family:var(--display);font-size:2rem;font-weight:700;color:#141A3B;cursor:pointer}
.slide .t.e{background:transparent;cursor:default}
/* scramble */
.letters{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.letters button{font-family:var(--display);font-size:1.5rem;padding:.6rem .85rem;background:var(--card2);color:var(--ink);box-shadow:none;border:3px solid var(--line)}
.letters button.used{opacity:.25}
.guess{min-height:3rem;border:3px dashed var(--line);border-radius:16px;display:flex;gap:.3rem;justify-content:center;align-items:center;font-family:var(--display);font-size:1.8rem;padding:.3rem;letter-spacing:.1em}
/* result */
.badge{font-size:3.2rem;line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.bob{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#141A3B;padding:.7rem 1.1rem;border-radius:14px;font-weight:800;box-shadow:var(--shadow);z-index:50;max-width:92vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.7);display:grid;place-items:center;z-index:60;padding:1rem}
.modal .card{max-width:420px;width:100%;margin:0}
.trophy{display:flex;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line)}
.trophy .rank{font-family:var(--display);font-size:1.3rem;width:2rem;text-align:center}
/* Alilox 3D */
#alx{position:relative;height:min(64vh,580px);min-height:340px;border-radius:18px;overflow:hidden;touch-action:none;background:#7EC8FF;user-select:none;-webkit-user-select:none}
#alx canvas{width:100%;height:100%;display:block}
#alx-hud{position:absolute;top:.5rem;left:.5rem;display:flex;gap:.4rem;flex-wrap:wrap}
#alx-hud .pill{background:rgba(20,26,59,.75)}#alx-hud .pill.y{background:var(--yellow);color:#141A3B}
#alx-msg{position:absolute;top:3.2rem;left:50%;transform:translateX(-50%);background:rgba(20,26,59,.8);color:#fff;padding:.4rem 1rem;border-radius:999px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;font-family:var(--display)}
#alx-msg.show{opacity:1}
#alx-joy{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);pointer-events:none}
#alx-joy .knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85)}
#alx-jump{position:absolute;right:.8rem;bottom:.8rem;width:86px;height:86px;border-radius:50%;background:var(--pink);color:#fff;font-size:1rem;box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none;font-family:var(--display)}
#alx-end{position:absolute;right:.6rem;top:.5rem;background:rgba(20,26,59,.75)}
#alx-load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,59,.6);color:#fff;font-weight:800;text-align:center;padding:1rem}
.feat{display:flex;align-items:center;gap:.9rem;background:linear-gradient(135deg,#1e3a8a,#7c3aed 60%,#db2777);border-radius:22px;padding:1rem;margin:.9rem 0;cursor:pointer;box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.25);position:relative;overflow:hidden}
.feat .blocks{display:flex;gap:.3rem;flex-shrink:0}.feat .blk{width:46px;height:46px;border-radius:8px;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.3);background:#F2C9A6}
.feat h3{margin:0;font-size:1.3rem}.feat p{margin:.15rem 0 0;color:#fde68a;font-size:.9rem}.feat .new{position:absolute;top:.6rem;right:.6rem;background:var(--yellow);color:#141A3B;font-weight:900;padding:.15rem .6rem;border-radius:999px;font-size:.75rem;transform:rotate(6deg)}

<div id="app" class="wrap"></div>
<div id="toastbox"></div><div id="modalbox"></div>
<script>
/* ---------- data & helpers ---------- */
const EMBED=JSON.parse(document.getElementById('app-data').textContent);
const PLAYERS=EMBED.players; const LS_RES='arcade_results_v1', LS_SESSION='arcade_session_v1';
let RESULTS={}; try{JSON.parse(localStorage.getItem(LS_RES)||'[]').forEach(r=>RESULTS[r.id]=r)}catch(e){}
let session=null; try{session=JSON.parse(localStorage.getItem(LS_SESSION)||'null')}catch(e){}
let view={name:'login'}; let db=null,dbWritable=null,capsReady=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const P=id=>PLAYERS.find(p=>p.id===id);
const first=p=>p.name.split(' ')[0];
const avHtml=(p,cls='avatar')=>p.avatar?`<img class="${cls}" src="${p.avatar}" alt="">`:`<div class="${cls==='avatar'?'av-dad':cls}">${p.emoji||'🧑'}</div>`;
const miniAv=p=>p.avatar?`<img class="mini" src="${p.avatar}" alt="">`:`<span class="mini-dad">${p.emoji||'🧑'}</span>`;
const fmtDate=s=>{try{const d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}catch(e){return s}};
function toast(m,ms=2400){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toastbox').append(t);setTimeout(()=>t.remove(),ms)}
function saveLocal(){try{localStorage.setItem(LS_RES,JSON.stringify(Object.values(RESULTS)))}catch(e){}}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#FF5DA2','#FFD23F','#2EE6D6','#4ADE80','#A78BFA','#FF8A3D'];for(let i=0;i<90;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'vw';s.style.background=cols[i%6];s.style.animationDelay=Math.random()*.9+'s';c.append(s);}document.body.append(c);setTimeout(()=>c.remove(),3800);}
function ask(title,text,ok,onOk){$('#modalbox').innerHTML=`<div class="modal"><div class="card"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row" style="justify-content:flex-end;margin-top:.6rem"><button class="ghost" id="m-no">Cancel</button><button class="pink" id="m-ok">${esc(ok)}</button></div></div></div>`;$('#m-no').onclick=()=>$('#modalbox').innerHTML='';$('#m-ok').onclick=()=>{$('#modalbox').innerHTML='';onOk();};}
/* sounds (tiny synth, no files) */
let AC=null; function beep(f=600,d=.08,type='sine',v=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
const sfx={ok:()=>{beep(660,.08);setTimeout(()=>beep(880,.1),80)},bad:()=>beep(180,.2,'square',.1),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*120))},tap:()=>beep(440,.05,'triangle',.08)};

/* ---------- cloud sync (Vercel API /api/scores) ---------- */
let serverOk=false;
async function pullScores(){ try{ const r=await fetch('/api/scores',{cache:'no-store'}); if(!r.ok) return; const j=await r.json(); serverOk=!!j.ok; let ch=false;
  (j.scores||[]).forEach(s=>{ if(!RESULTS[s.id]||!RESULTS[s.id]._synced){RESULTS[s.id]={...s,_synced:true};ch=true;} });
  for(const r of Object.values(RESULTS)){ if(!r._synced&&serverOk){ try{ const c={...r}; delete c._synced; const p=await fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}); if(p.ok){r._synced=true;ch=true;} }catch(e){} } }
  if(ch){saveLocal(); if(view.name==='home'||view.name==='board') render();}
 }catch(e){} capsReady=true; }
pullScores(); setInterval(pullScores,30000);
async function record(r){ r.id=uid(); r.at=new Date().toISOString(); RESULTS[r.id]=r; saveLocal();
  try{ const c={...r}; delete c._synced; const p=await fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}); if(p.ok){ r._synced=true; saveLocal(); } }catch(e){} }

/* ---------- games registry ---------- */
const GAMES=[
 {id:'memory',name:'Memory Match',ic:'🧠',cat:'memory',desc:'Flip the cards and find the pairs. Fewer moves = more stars!',modes:['solo','duo']},
 {id:'simon',name:'Simon Says',ic:'🎵',cat:'memory',desc:'Watch the colours light up, then repeat the pattern. How long can you remember?',modes:['solo']},
 {id:'ttt',name:'Tic Tac Toe',ic:'❌⭕',cat:'brain',desc:'Three in a row wins. Beat the robot or play each other.',modes:['cpu','duo']},
 {id:'c4',name:'Connect Four',ic:'🔴🟡',cat:'brain',desc:'Drop discs and connect four in a line before your rival.',modes:['cpu','duo']},
 {id:'puzzle',name:'Slide Puzzle',ic:'🧩',cat:'brain',desc:'Slide the tiles to put the numbers 1–8 in order.',modes:['solo']},
 {id:'math',name:'Math Blitz',ic:'⚡',cat:'brain',desc:'60 seconds. How many sums can you solve?',modes:['solo','duo']},
 {id:'scramble',name:'Word Scramble',ic:'🔤',cat:'fun',desc:'Unscramble the letters to find the English word.',modes:['solo']},
 {id:'alilox',name:'Alilox',ic:'🧱',cat:'fun',desc:'Your own 3D block world! Run and jump through the obby as YOU, grab the coins and reach the golden portal.',modes:['solo','cpu','duo'],big:true},
 {id:'mole',name:'Whack-a-Mole',ic:'🐹',cat:'fun',desc:'Tap the moles as fast as you can. 30 seconds!',modes:['solo','duo']},
];
const CATS={brain:'Brain',memory:'Memory',fun:'Fun'};
const G=id=>GAMES.find(g=>g.id===id);
const CHEERS=['Wow! 🌟','Amazing! 🚀','Super brain! 🧠','You did it! 🎉','Champion! 🏆','So fast! ⚡','Brilliant! ✨','Unstoppable! 🔥'];
const cheer=()=>CHEERS[Math.floor(Math.random()*CHEERS.length)];

/* ---------- render ---------- */
function render(){ const app=$('#app'); const map={login:renderLogin,home:renderHome,game:renderGame,board:renderBoard}; try{ app.innerHTML=map[view.name](); }catch(e){ console.error(e); toast('Oops: '+(e.message||e)); view={name:session?'home':'login'}; app.innerHTML=map[view.name](); } if(view.name==='game'&&typeof afterRender==='function'){afterRender();} window.scrollTo({top:0}); }
function topbar(extra=''){ return `<div class="topbar"><div class="brand grow">🎮 Aleen <span>&amp;</span> Mansour <span>Arcade</span><small>Made with ❤️ for Aleen &amp; Mansour by Baba</small></div>${extra}</div>`; }

/* login */
let pin='',picked=null;
function renderLogin(){
  return topbar()+`
  <div class="center" style="margin:1.2rem 0 .8rem"><h1><span class="bob">🕹️</span> Who's playing?</h1><p class="dedic">This arcade was built just for <b>Aleen</b> and <b>Mansour</b> — pick your face and enter your PIN!</p></div>
  <div class="login-grid">${PLAYERS.map(p=>`<div class="who ${picked===p.id?'sel':''}" onclick="pick('${p.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')pick('${p.id}')">${avHtml(p)}<div class="nm">${esc(first(p))}</div><div class="muted small">${esc(p.tag||'')}</div></div>`).join('')}</div>
  <div id="pinbox" class="card" ${picked?'':'hidden'}><h3 class="center">Enter your PIN 🔐</h3>
    <div class="dots" id="dots">${[0,1,2,3].map(i=>`<span class="${i<pin.length?'on':''}"></span>`).join('')}</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}<button onclick="pinKey('del')">⌫</button><button onclick="pinKey('0')">0</button><button class="go" onclick="pinKey('ok')">Go</button></div></div>`;
}
function pick(id){picked=id;pin='';render();}
function pinKey(k){ sfx.tap(); if(k==='del')pin=pin.slice(0,-1); else if(k==='ok'){tryPin();return;} else if(pin.length<4)pin+=k; if(pin.length===4){tryPin();return;} const d=$('#dots'); if(d)d.innerHTML=[0,1,2,3].map(i=>`<span class="${i<pin.length?'on':''}"></span>`).join(''); }
function tryPin(){ const p=P(picked); if(p&&pin===p.pin){ session={id:p.id}; try{localStorage.setItem(LS_SESSION,JSON.stringify(session))}catch(e){} view={name:'home'}; sfx.ok(); render(); } else { const b=$('#pinbox'); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),450); pin=''; $('#dots').innerHTML='<span></span>'.repeat(4); sfx.bad(); toast('Hmm, that PIN is not right 🙂'); } }
function logout(){session=null;try{localStorage.removeItem(LS_SESSION)}catch(e){}picked=null;pin='';view={name:'login'};render();}

/* ---------- stats ---------- */
const mine=id=>Object.values(RESULTS).filter(r=>r.player===id);
const starsOf=id=>mine(id).reduce((a,r)=>a+(r.stars||0),0);
function best(game,player){ const rs=Object.values(RESULTS).filter(r=>r.game===game&&r.player===player&&r.score!=null); if(!rs.length) return null; const g=G(game); return g.lowerBetter?Math.min(...rs.map(r=>r.score)):Math.max(...rs.map(r=>r.score)); }
function leaderboard(game){ return PLAYERS.map(p=>({p,best:best(game,p.id),plays:Object.values(RESULTS).filter(r=>r.game===game&&r.player===p.id).length,wins:Object.values(RESULTS).filter(r=>r.game===game&&r.player===p.id&&r.won).length})).sort((a,b)=>(b.best??-1)-(a.best??-1)); }

/* home */
function renderHome(){
  const me=P(session.id); const rs=mine(me.id).sort((a,b)=>a.at<b.at?1:-1);
  const stars=starsOf(me.id); const wins=rs.filter(r=>r.won).length;
  const others=PLAYERS.filter(p=>p.id!==me.id);
  const challenges=Object.values(RESULTS).filter(r=>r.player!==me.id&&r.score!=null).sort((a,b)=>a.at<b.at?1:-1).slice(0,4);
  return topbar(`<button class="ghost sm" onclick="view={name:'board'};render()">🏆 Hall of Fame</button><button class="ghost sm" onclick="logout()">Log out</button>`)+`
  <div class="card hero"><div class="row">${avHtml(me,'avatar big')}<div class="grow"><h1>Hi ${esc(first(me))}! ${me.id==='dad'?'🎩':'🎈'}</h1><p>Ready to play? Every game gives you stars ⭐</p>
   <div class="row" style="gap:.4rem"><span class="pill y">⭐ ${stars} stars</span><span class="pill">🎮 ${rs.length} games played</span><span class="pill">🏅 ${wins} wins</span></div></div></div></div>

let game=null; let afterRender=null; let timers=[];
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];}
function openGame(id){ clearTimers(); game={id,mode:null,p2:null}; view={name:'game'}; render(); }
function exitGame(){ clearTimers(); afterRender=null; game=null; view={name:'home'}; render(); }
function renderGame(){
  const g=G(game.id); const me=P(session.id);
  const head=topbar(`<button class="ghost sm" onclick="exitGame()">✕ Exit</button>`)+`<div class="row" style="margin:.3rem 0"><h1 class="grow">${g.ic} ${esc(g.name)}</h1></div>`;

    ${g.modes.includes('duo')?PLAYERS.filter(p=>p.id!==me.id).map(p=>`<button class="pink" onclick="setMode('duo','${p.id}')">👥 Me vs ${esc(first(p))}</button>`).join(''):''}
  </div>${g.modes.includes('duo')?'<p class="muted small">👥 Two players take turns on this same device.</p>':''}</div>`;

}
function setMode(mode,p2){ game.mode=mode; game.p2=p2||null; game.modeLabel=mode==='solo'?'Solo':mode==='cpu'?'vs Robot':'vs '+first(P(p2)); GAME_IMPL[game.id].start(); render(); }
function hud(extra=''){ const me=P(session.id); const p2=game.mode==='cpu'?{name:'Robot',emoji:'🤖'}:game.p2?P(game.p2):null;
  return `<div class="hud"><span class="pl ${game.turn===1?'on':''}">${p2?miniAv(me).replace('class="mini','class="mini"'):''}${p2?'':''}${esc(first(me))}${game.s1!=null?' · <b>'+game.s1+'</b>':''}</span>${p2?`<span class="pl ${game.turn===2?'on':''}">${p2.avatar?miniAv(p2):'🤖'} ${esc(p2.name.split(' ')[0])}${game.s2!=null?' · <b>'+game.s2+'</b>':''}</span>`:''}<span class="grow"></span>${extra}</div>`; }
function finish(opts){ // opts: {score, won, stars, title, text, p1Score,p2Score}
  clearTimers(); const g=G(game.id); const me=P(session.id);
  const r={game:game.id,player:me.id,mode:game.mode,modeLabel:game.modeLabel,score:opts.score??null,won:opts.won??null,stars:opts.stars||0};
  record(r);
  if(game.mode==='duo'&&opts.p2){ record({game:game.id,player:game.p2,mode:'duo',modeLabel:'vs '+first(me),score:opts.p2.score??null,won:opts.p2.won??null,stars:opts.p2.stars||0}); }
  if(opts.won||((opts.stars||0)>=2)){confetti();sfx.win();} else sfx.ok();

}
function resultCard(o){ const me=P(session.id);
  return `<div class="stage center pop"><div class="badge">${o.badge||(o.won?'🏆':'⭐')}</div><h2>${esc(o.title)}</h2><p>${esc(o.text||'')}</p>
   ${o.stars?`<p style="font-size:1.6rem">${'⭐'.repeat(o.stars)}</p>`:''}
   <div class="row" style="justify-content:center;margin-top:.5rem"><button class="teal" onclick="GAME_IMPL['${game.id}'].start();game.over=null;render()">Play again 🔁</button><button class="ghost" onclick="exitGame()">Home 🏠</button></div></div>`; }
function starsFor(score,thresholds){ return score>=thresholds[2]?3:score>=thresholds[1]?2:score>=thresholds[0]?1:0; }

const GAME_IMPL={};
/* 1. Memory Match */
GAME_IMPL.memory={
  start(){ const emojis=['🐶','🐱','🦊','🐼','🦁','🐸','🐵','🦄','🐙','🦋','🍉','🍕','🚀','⚽','🎸','🌈'];
    const n=game.mode==='duo'?10:8; const pick=emojis.slice().sort(()=>Math.random()-.5).slice(0,n); const cards=pick.concat(pick).sort(()=>Math.random()-.5).map((e,i)=>({i,e,flip:false,done:false}));
    Object.assign(game,{cards,open:[],moves:0,turn:1,s1:game.mode==='duo'?0:null,s2:game.mode==='duo'?0:null,lock:false,over:null,t0:Date.now()}); },
  render(){ if(game.over) return resultCard(game.over);
    const cols=game.cards.length>16?5:4;
    return `<div class="stage">${hud(`<span class="pill">Moves: ${game.moves}</span>`)}<div class="mem" style="grid-template-columns:repeat(${cols},1fr)">${game.cards.map(c=>`<div class="mcard ${c.flip||c.done?'flip':''} ${c.done?'done':''}" onclick="memFlip(${c.i})"><div class="in"><div class="f">?</div><div class="b">${c.e}</div></div></div>`).join('')}</div></div>`; }
};
function memFlip(i){ const c=game.cards[i]; if(game.lock||c.flip||c.done) return; sfx.tap(); c.flip=true; game.open.push(c);
  if(game.open.length===2){ game.moves++; game.lock=true; const [a,b]=game.open;
    if(a.e===b.e){ a.done=b.done=true; game.open=[]; game.lock=false; sfx.ok(); if(game.mode==='duo'){ if(game.turn===1)game.s1++; else game.s2++; }
      if(game.cards.every(x=>x.done)){ const secs=Math.round((Date.now()-game.t0)/1000);
        if(game.mode==='duo'){ const w=game.s1>game.s2?1:game.s2>game.s1?2:0; const me=P(session.id),p2=P(game.p2);
          finish({score:game.s1,won:w===1,stars:w===1?3:w===0?2:1,p2:{score:game.s2,won:w===2,stars:w===2?3:w===0?2:1},title:w===0?'It’s a tie! 🤝':(w===1?first(me):first(p2))+' wins! 🏆',text:`${first(me)} ${game.s1} – ${game.s2} ${first(p2)}`,badge:w===0?'🤝':'🏆'}); }
        else { const stars=starsFor(-game.moves,[-22,-16,-12]); finish({score:game.moves,stars:Math.max(1,stars),title:cheer(),text:`All pairs found in ${game.moves} moves and ${secs} seconds!`,badge:'🧠'}); }
        return; }
      render(); }
    else { timers.push(setTimeout(()=>{ a.flip=b.flip=false; game.open=[]; game.lock=false; if(game.mode==='duo') game.turn=game.turn===1?2:1; render(); },750)); render(); }
  } else render(); }
G('memory').lowerBetter=true;

/* 2. Simon Says */
GAME_IMPL.simon={
  start(){ Object.assign(game,{seq:[],input:[],level:0,playing:false,over:null,s1:0}); timers.push(setTimeout(simonNext,600)); },
  render(){ if(game.over) return resultCard(game.over);
    const cols=[['#FF5DA2',330],['#2EE6D6',392],['#FFD23F',494],['#4ADE80',587]];
    return `<div class="stage">${hud(`<span class="pill y">Level ${game.level}</span>`)}<p class="center muted" id="simon-msg">${game.playing?'Watch carefully… 👀':'Your turn! Repeat the pattern 🎵'}</p><div class="simon">${cols.map((c,i)=>`<button class="spad" id="pad${i}" style="background:${c[0]}" onclick="simonTap(${i})"></button>`).join('')}</div></div>`; }
};
const SIMON_F=[330,392,494,587];
function simonLight(i,ms=420){ const p=$('#pad'+i); if(!p) return; p.classList.add('lit'); beep(SIMON_F[i],ms/1000,'sine',.2); timers.push(setTimeout(()=>p.classList.remove('lit'),ms)); }
function simonNext(){ game.seq.push(Math.floor(Math.random()*4)); game.level=game.seq.length; game.input=[]; game.playing=true; render();
  const speed=Math.max(260,650-game.level*30); game.seq.forEach((v,k)=>timers.push(setTimeout(()=>simonLight(v,speed*.7),500+k*speed)));
  timers.push(setTimeout(()=>{game.playing=false; const m=$('#simon-msg'); if(m)m.textContent='Your turn! Repeat the pattern 🎵';},500+game.seq.length*speed)); }
function simonTap(i){ if(game.playing||game.over) return; simonLight(i,250); game.input.push(i); const k=game.input.length-1;
  if(game.input[k]!==game.seq[k]){ const lv=game.level-1; sfx.bad(); finish({score:lv,stars:starsFor(lv,[3,6,9]),title:lv>=6?cheer():'Good try! 💪',text:`You remembered ${lv} ${lv===1?'step':'steps'} in a row.`,badge:lv>=9?'🏆':'🎵'}); return; }
  if(game.input.length===game.seq.length){ sfx.ok(); timers.push(setTimeout(simonNext,700)); } }

/* 3. Tic Tac Toe */
GAME_IMPL.ttt={
  start(){ Object.assign(game,{b:Array(9).fill(''),turn:1,over:null,winLine:null,s1:null,s2:null}); },
  render(){ if(game.over) return resultCard(game.over);
    return `<div class="stage">${hud(`<span class="pill">${game.turn===1?'❌ Your turn':(game.mode==='cpu'?'⭕ Robot thinking…':'⭕ '+first(P(game.p2))+'’s turn')}</span>`)}<div class="board" style="grid-template-columns:repeat(3,1fr)">${game.b.map((v,i)=>`<div class="cell ${v?v.toLowerCase():''} ${game.winLine&&game.winLine.includes(i)?'win':''}" onclick="tttPlay(${i})">${v}</div>`).join('')}</div></div>`; }
};
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tttWin=b=>{for(const l of LINES){const [a,c,d]=l;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {p:b[a],l};}return null;};
function tttPlay(i){ if(game.over||game.b[i]||(game.mode==='cpu'&&game.turn===2)) return; sfx.tap(); game.b[i]=game.turn===1?'X':'O'; tttCheck(); if(game.over) return; game.turn=game.turn===1?2:1; render(); if(game.mode==='cpu'&&game.turn===2) timers.push(setTimeout(tttCpu,550)); }
function tttCpu(){ const b=game.b; let move=-1; // minimax with a little randomness at start
  const empty=b.map((v,i)=>v?-1:i).filter(i=>i>=0); if(empty.length>=8&&Math.random()<.5) move=empty[Math.floor(Math.random()*empty.length)];
  else { let bestV=-Infinity; for(const i of empty){ b[i]='O'; const v=mm(b,false); b[i]=''; if(v>bestV){bestV=v;move=i;} } }
  b[move]='O'; tttCheck(); if(game.over) return; game.turn=1; render(); }
function mm(b,isO){ const w=tttWin(b); if(w) return w.p==='O'?10:-10; if(b.every(Boolean)) return 0; const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0); let bestV=isO?-Infinity:Infinity; for(const i of e){ b[i]=isO?'O':'X'; const v=mm(b,!isO); b[i]=''; bestV=isO?Math.max(bestV,v):Math.min(bestV,v); } return bestV; }
function tttCheck(){ const w=tttWin(game.b); const me=P(session.id);
  if(w){ game.winLine=w.l; render(); const meWon=w.p==='X'; const name=meWon?first(me):(game.mode==='cpu'?'Robot':first(P(game.p2)));
    timers.push(setTimeout(()=>finish({won:meWon,stars:meWon?(game.mode==='cpu'?3:2):0,p2:game.mode==='duo'?{won:!meWon,stars:!meWon?2:0}:null,title:meWon?cheer():name+' wins!',text:meWon?'Three in a row!':'Try again — you can do it!',badge:meWon?'🏆':'🤖'}),900)); }
  else if(game.b.every(Boolean)){ timers.push(setTimeout(()=>finish({won:null,stars:1,p2:game.mode==='duo'?{stars:1}:null,title:'It’s a draw! 🤝',text:'Nobody wins this time.',badge:'🤝'}),600)); } }

/* 4. Connect Four */
GAME_IMPL.c4={
  start(){ Object.assign(game,{g:Array.from({length:6},()=>Array(7).fill(0)),turn:1,over:null,win:[],s1:null,s2:null,busy:false}); },
  render(){ if(game.over) return resultCard(game.over);
    return `<div class="stage">${hud(`<span class="pill">${game.turn===1?'🔴 Your turn':(game.mode==='cpu'?'🟡 Robot thinking…':'🟡 '+first(P(game.p2))+'’s turn')}</span>`)}<div class="c4drop">${[0,1,2,3,4,5,6].map(c=>`<button onclick="c4Drop(${c})">⬇️</button>`).join('')}</div><div class="c4">${game.g.map((row,r)=>row.map((v,c)=>`<div class="slot ${v===1?'r':v===2?'y':''} ${game.win.some(([a,b])=>a===r&&b===c)?'win':''}" onclick="c4Drop(${c})"></div>`).join('')).join('')}</div></div>`; }
};
function c4Place(g,c,p){ for(let r=5;r>=0;r--){ if(!g[r][c]){ g[r][c]=p; return r; } } return -1; }
function c4Win(g,p){ const D=[[0,1],[1,0],[1,1],[1,-1]]; for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const [dr,dc] of D){ const cells=[]; for(let k=0;k<4;k++){ const rr=r+dr*k,cc=c+dc*k; if(rr<0||rr>5||cc<0||cc>6||g[rr][cc]!==p) break; cells.push([rr,cc]); } if(cells.length===4) return cells; } return null; }
function c4Drop(c){ if(game.over||game.busy||(game.mode==='cpu'&&game.turn===2)) return; const r=c4Place(game.g,c,game.turn); if(r<0) return; sfx.tap(); c4After(); }
function c4After(){ const p=game.turn; const w=c4Win(game.g,p); const me=P(session.id);
  if(w){ game.win=w; game.busy=true; render(); const meWon=p===1; const name=meWon?first(me):(game.mode==='cpu'?'Robot':first(P(game.p2)));
    timers.push(setTimeout(()=>finish({won:meWon,stars:meWon?(game.mode==='cpu'?3:2):0,p2:game.mode==='duo'?{won:!meWon,stars:!meWon?2:0}:null,title:meWon?cheer():name+' wins!',text:meWon?'Four in a row!':'So close! Try again.',badge:meWon?'🏆':'🤖'}),900)); return; }
  if(game.g[0].every(Boolean)){ timers.push(setTimeout(()=>finish({won:null,stars:1,p2:game.mode==='duo'?{stars:1}:null,title:'Board is full — draw! 🤝',badge:'🤝'}),500)); return; }
  game.turn=p===1?2:1; render(); if(game.mode==='cpu'&&game.turn===2){ game.busy=true; timers.push(setTimeout(()=>{ c4Cpu(); game.busy=false; },600)); } }
function c4Cpu(){ const g=game.g; const cols=[3,2,4,1,5,0,6].filter(c=>!g[0][c]);
  const tryCol=(p)=>{ for(const c of cols){ const copy=g.map(r=>r.slice()); if(c4Place(copy,c,p)>=0&&c4Win(copy,p)) return c; } return -1; };
  let c=tryCol(2); if(c<0) c=tryCol(1);
  if(c<0){ // avoid giving the opponent a win on top
    const safe=cols.filter(col=>{ const copy=g.map(r=>r.slice()); const r=c4Place(copy,col,2); if(r>0){ copy[r-1][col]=1; if(c4Win(copy,1)) return false; } return true; });
    const pool=safe.length?safe:cols; c=pool[Math.floor(Math.random()*Math.min(pool.length,3))]; }
  c4Place(g,c,2); c4After(); }

/* 5. Slide puzzle */
GAME_IMPL.puzzle={
  start(){ let t=[1,2,3,4,5,6,7,8,0]; for(let k=0;k<200;k++){ const e=t.indexOf(0); const nb=[e-3,e+3,e%3?e-1:-1,e%3<2?e+1:-1].filter(i=>i>=0&&i<9); const s=nb[Math.floor(Math.random()*nb.length)]; [t[e],t[s]]=[t[s],t[e]]; } Object.assign(game,{t,moves:0,over:null,s1:null,t0:Date.now()}); },
  render(){ if(game.over) return resultCard(game.over); return `<div class="stage">${hud(`<span class="pill">Moves: ${game.moves}</span>`)}<p class="center muted small">Tap a tile next to the empty space to slide it. Goal: 1 2 3 / 4 5 6 / 7 8</p><div class="slide">${game.t.map((v,i)=>`<div class="t ${v?'':'e'}" onclick="slideTap(${i})">${v||''}</div>`).join('')}</div></div>`; }
};
G('puzzle').lowerBetter=true;
function slideTap(i){ const e=game.t.indexOf(0); const ok=(Math.abs(i-e)===3)||(Math.abs(i-e)===1&&Math.floor(i/3)===Math.floor(e/3)); if(!ok||game.over) return; sfx.tap(); [game.t[i],game.t[e]]=[game.t[e],game.t[i]]; game.moves++; render();
  if(game.t.slice(0,8).every((v,k)=>v===k+1)){ const secs=Math.round((Date.now()-game.t0)/1000); timers.push(setTimeout(()=>finish({score:game.moves,stars:game.moves<=40?3:game.moves<=80?2:1,title:cheer(),text:`Solved in ${game.moves} moves and ${secs} seconds!`,badge:'🧩'}),400)); } }

/* 6. Math Blitz */
GAME_IMPL.math={
  start(){ Object.assign(game,{phase:1,s1:0,s2:game.mode==='duo'?0:null,left:60,q:null,over:null,streak:0,turn:1}); mathQ(); clearTimers(); timers.push(setInterval(()=>{ game.left--; const t=$('#mtimer i'); if(t) t.style.width=(game.left/60*100)+'%'; const l=$('#mleft'); if(l) l.textContent=game.left+'s'; if(game.left<=0) mathEnd(); },1000)); },
  render(){ if(game.over) return resultCard(game.over); const q=game.q; const who=game.mode==='duo'?(game.turn===1?first(P(session.id)):first(P(game.p2))):first(P(session.id));
    return `<div class="stage">${hud(`<span class="pill y" id="mleft">${game.left}s</span>`)}<div class="timer" id="mtimer"><i style="width:${game.left/60*100}%"></i></div>${game.mode==='duo'?`<p class="center"><b>${esc(who)}</b>, your turn! 🔥</p>`:''}<div class="bigq">${q.a} ${q.op} ${q.b} = ?</div><div class="ans">${q.opts.map(o=>`<button onclick="mathAns(${o})">${o}</button>`).join('')}</div><p class="center muted small">Streak: ${'🔥'.repeat(Math.min(game.streak,5))||'–'}</p></div>`; }
};
function mathQ(){ const me=P(session.id); const hard=me.id==='aleen'||me.id==='dad'||game.turn===2&&game.p2&&game.p2!=='mansour'; const ops=hard?['+','−','×','÷']:['+','−','×']; const op=ops[Math.floor(Math.random()*ops.length)]; let a,b,ans;
  if(op==='+'){a=rnd(hard?100:10,hard?999:99);b=rnd(hard?100:10,hard?999:99);ans=a+b;} else if(op==='−'){a=rnd(hard?100:20,hard?999:99);b=rnd(1,a);ans=a-b;} else if(op==='×'){a=rnd(2,hard?12:9);b=rnd(2,hard?12:9);ans=a*b;} else {b=rnd(2,12);ans=rnd(2,12);a=b*ans;}

  const ROBOT_TIME=70;
  // state
  const S={pos:new THREE.Vector3(0,.5,0),vel:new THREE.Vector3(),yaw:0,onGround:false,ground:null,coyote:0,jumpBuf:0,coins:0,deaths:0,t:0,started:false,done:false,cp:new THREE.Vector3(0,.5,0),cpIdx:0,msgT:0,robotDone:false};
  const HW=.33,HT=1.85, GRAV=30, JUMP=11.5, SPEED=6.2;
  const keys={}; const inp={jx:0,jy:0,jump:false}; let joy=null, look=null;
  const onKey=e=>{ if(e.repeat) return; const k=e.key.toLowerCase(); if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault(); keys[k]=e.type==='keydown'; if(k===' '&&e.type==='keydown') inp.jump=true; };
  window.addEventListener('keydown',onKey); window.addEventListener('keyup',onKey);
  const joyEl=$('#alx-joy'), knob=joyEl.querySelector('.knob');
  const pd=e=>{ const r=host.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top; if(e.target.id==='alx-jump'||e.target.id==='alx-end') return; host.setPointerCapture&&host.setPointerCapture(e.pointerId);
    if(e.pointerType!=='mouse'&&x<r.width/2&&!joy){ joy={id:e.pointerId,ox:x,oy:y}; joyEl.hidden=false; joyEl.style.left=(x-55)+'px'; joyEl.style.top=(y-55)+'px'; knob.style.transform='translate(0,0)'; }
    else if(!look){ look={id:e.pointerId,lx:x}; } };
  const pm=e=>{ const r=host.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
    if(joy&&e.pointerId===joy.id){ let dx=x-joy.ox, dy=y-joy.oy; const d=Math.hypot(dx,dy); if(d>45){dx=dx/d*45;dy=dy/d*45;} inp.jx=dx/45; inp.jy=dy/45; knob.style.transform=`translate(${dx}px,${dy}px)`; }
    else if(look&&e.pointerId===look.id){ S.yaw-=(x-look.lx)*.008; look.lx=x; } };
  const pu=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; inp.jx=inp.jy=0; joyEl.hidden=true; } if(look&&e.pointerId===look.id) look=null; };
  host.addEventListener('pointerdown',pd); host.addEventListener('pointermove',pm); host.addEventListener('pointerup',pu); host.addEventListener('pointercancel',pu);
  const jb=$('#alx-jump'); const jd=e=>{ e.preventDefault(); inp.jump=true; }; jb.addEventListener('pointerdown',jd); jb.addEventListener('contextmenu',e=>e.preventDefault());
  $('#alx-end').onclick=()=>ask('End this run?','Your coins count, but no finish bonus.','End run',()=>alxFinish(S,false));
  const msg=(t,ms)=>{ const m=$('#alx-msg'); if(!m) return; m.textContent=t; m.classList.add('show'); S.msgT=ms||1500; };
  function respawn(){ S.pos.copy(S.cp); S.vel.set(0,0,0); S.deaths++; const d=$('#alx-deaths'); if(d){ d.hidden=false; d.querySelector('b').textContent=S.deaths; } sfx.bad(); msg('Oops! Back to the checkpoint 🔁',1400); }
  function overlap(p,px,py,pz){ return px+HW>p.cx-p.w/2 && px-HW<p.cx+p.w/2 && py<p.y+p.h/2 && py+HT>p.y-p.h/2 && pz+HW>p.cz-p.d/2 && pz-HW<p.cz+p.d/2; }
  function step(dt){
    // moving platforms
    const now=S.t; plats.forEach(p=>{ if(!p.mv) return; const off=Math.sin(now*p.mv.speed)*p.mv.range; const nx=p.mv.axis==='x'?p.bx+off:p.bx, nz=p.mv.axis==='z'?p.bz+off:p.bz; p.dx=nx-p.cx; p.dz=nz-p.cz; p.cx=nx; p.cz=nz; p.mesh.position.set(nx,p.y,nz); });
    if(S.ground&&S.ground.mv&&S.onGround){ S.pos.x+=S.ground.dx; S.pos.z+=S.ground.dz; }
    // input
    let mx=inp.jx, mz=-inp.jy; if(keys['w']||keys['arrowup']) mz+=1; if(keys['s']||keys['arrowdown']) mz-=1; if(keys['a']||keys['arrowleft']) mx-=1; if(keys['d']||keys['arrowright']) mx+=1; if(keys['q']) S.yaw+=dt*2; if(keys['e']) S.yaw-=dt*2;
    const len=Math.hypot(mx,mz); if(len>1){mx/=len;mz/=len;}
    const fx=Math.sin(S.yaw), fz=Math.cos(S.yaw), rx=Math.cos(S.yaw), rz=-Math.sin(S.yaw);
    const vx=(fx*mz+rx*mx)*SPEED, vz=(fz*mz+rz*mx)*SPEED; const moving=len>.05;
    if(moving&&!S.started){ S.started=true; }
    if(inp.jump){ S.jumpBuf=.15; inp.jump=false; }
    S.coyote=S.onGround?.1:Math.max(0,S.coyote-dt); S.jumpBuf=Math.max(0,S.jumpBuf-dt);
    if(S.jumpBuf>0&&S.coyote>0){ S.vel.y=JUMP; S.onGround=false; S.coyote=0; S.jumpBuf=0; S.ground=null; sfx.tap(); if(!S.started) S.started=true; }
    S.vel.y-=GRAV*dt; if(S.vel.y<-40) S.vel.y=-40;
    // x
    S.pos.x+=vx*dt; plats.forEach(p=>{ if(overlap(p,S.pos.x,S.pos.y,S.pos.z)){ S.pos.x = vx>0||(vx===0&&S.pos.x<p.cx) ? p.cx-p.w/2-HW-.001 : p.cx+p.w/2+HW+.001; } });
    // z
    S.pos.z+=vz*dt; plats.forEach(p=>{ if(overlap(p,S.pos.x,S.pos.y,S.pos.z)){ S.pos.z = vz>0||(vz===0&&S.pos.z<p.cz) ? p.cz-p.d/2-HW-.001 : p.cz+p.d/2+HW+.001; } });
    // y
    S.pos.y+=S.vel.y*dt; S.onGround=false; plats.forEach(p=>{ if(overlap(p,S.pos.x,S.pos.y,S.pos.z)){ if(S.vel.y<=0&&S.pos.y>p.y-p.h/2){ S.pos.y=p.y+p.h/2; S.vel.y=0; S.onGround=true; S.ground=p; } else if(S.vel.y>0){ S.pos.y=p.y-p.h/2-HT-.001; S.vel.y=0; } } });
    if(S.onGround&&S.ground){ const p=S.ground; if(p.kind==='check'&&!p.hit){ p.hit=true; S.cpIdx++; S.cp.set(p.x,p.y+p.h/2,p.z); p.flag.material.color.set(0xFFD23F); sfx.ok(); msg('Checkpoint! 🚩',1200); } if(p.kind==='finish'&&!S.done){ alxFinish(S,true); return; } }
    if(S.pos.y<-4){ respawn(); }
    // coins
    coins.forEach(c=>{ if(c.got) return; c.m.rotation.z+=dt*3; if(Math.abs(c.x-S.pos.x)<1&&Math.abs(c.z-S.pos.z)<1&&S.pos.y+HT>c.y-.6&&S.pos.y<c.y+.6){ c.got=true; c.m.visible=false; S.coins++; $('#alx-coins').textContent=S.coins; sfx.ok(); } });
    // character
    ch.position.copy(S.pos); if(moving){ ch.rotation.y=Math.atan2(vx,vz); S.idle=0; } else { S.idle=(S.idle||0)+dt; if(S.idle>1.2&&S.onGround){ const target=S.yaw+Math.PI; let diff=((target-ch.rotation.y+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; ch.rotation.y+=diff*Math.min(1,dt*4); } } alxAnimate(ch,moving&&S.onGround,dt,false);
    if(!S.onGround){ ch.userData.armL.rotation.z=2.8; ch.userData.armR.rotation.z=-2.8; }
    cheer.forEach(c=>alxAnimate(c,false,dt,true));
    if(S.started&&!S.done){ S.t+=dt; $('#alx-time').textContent=Math.floor(S.t); }
    // robot
    if(robot){ const frac=Math.min(1,S.t/ROBOT_TIME); let dist=frac*robotLen, i=1; while(i<robotPath.length-1&&dist>robotPath[i].distanceTo(robotPath[i-1])){ dist-=robotPath[i].distanceTo(robotPath[i-1]); i++; }
      const a=robotPath[i-1], b=robotPath[i], segL=a.distanceTo(b), u=segL?Math.min(1,dist/segL):1; robot.position.lerpVectors(a,b,u); robot.position.x+=1.3; robot.position.y+=Math.sin(u*Math.PI)*1.2; robot.rotation.y=Math.atan2(b.x-a.x,b.z-a.z); alxAnimate(robot,frac<1,dt,frac>=1);
      const rp=$('#alx-robot'); if(rp) rp.textContent='🤖 '+Math.round(frac*100)+'%'; if(frac>=1&&!S.robotDone){ S.robotDone=true; msg('🤖 Robot reached the portal first!',2000); } }
    // finish ring
    if(fin.ring){ fin.ring.rotation.y+=dt; fin.disc.rotation.z-=dt*.6; }
    // camera
    const cx=S.pos.x-fx*7.5, cz=S.pos.z-fz*7.5; camera.position.lerp(new THREE.Vector3(cx,S.pos.y+4.2,cz),Math.min(1,dt*8)); camera.lookAt(S.pos.x,S.pos.y+1.6,S.pos.z);
    sun.position.set(S.pos.x+20,40,S.pos.z-10); sun.target.position.set(S.pos.x,S.pos.y,S.pos.z);
    if(S.msgT>0){ S.msgT-=dt; if(S.msgT<=0){ const m=$('#alx-msg'); if(m) m.classList.remove('show'); } }
  }
  function resize(){ const w=host.clientWidth, h=host.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  resize(); window.addEventListener('resize',resize);
  let last=performance.now(); let raf=0;
  const loop=now=>{ if(ALX.gen!==gen||!game||game.id!=='alilox'||!document.body.contains(canvas)){ alxStopRenderer(); return; } let dt=Math.min(.05,(now-last)/1000); last=now; const n=Math.ceil(dt/.0167); for(let i=0;i<n&&!S.done;i++) step(dt/n); renderer.render(scene,camera); ALX.R.raf=requestAnimationFrame(loop); };
  ALX.R={renderer,raf:0,off(){ window.removeEventListener('keydown',onKey); window.removeEventListener('keyup',onKey); window.removeEventListener('resize',resize); }};
  camera.position.set(0,5,-8); ALX.R.raf=requestAnimationFrame(loop);
  ch.rotation.y=0; msg('Run to the portal! 🌀',1800);
  ALX.state=S;
}
function alxScore(S,finished,beatRobot){ let sc=S.coins*10-S.deaths*5; if(finished) sc+=50+Math.max(0,150-Math.floor(S.t)); if(beatRobot) sc+=30; return Math.max(0,sc); }
function alxFinish(S,finished){ if(S.done) return; S.done=true; const beatRobot=game.mode==='cpu'&&finished&&!S.robotDone; const score=alxScore(S,finished,beatRobot); const run={score,coins:S.coins,time:Math.floor(S.t),deaths:S.deaths,finished};
  if(finished) sfx.win();
  timers.push(setTimeout(()=>{ alxStopRenderer();
    if(game.mode==='duo'&&game.phase===1){ game.s1=score; game.run=run; game.phase=2; game.turn=2; game.ready=false; render(); return; }
    const txt=r=>`${r.finished?'Reached the portal':'Ended the run'} with ${r.coins} coins${r.finished?' in '+r.time+'s':''}${r.deaths?' · '+r.deaths+' falls':''}.`;
    if(game.mode==='duo'){ game.s2=score; const w=game.s1>game.s2?1:game.s2>game.s1?2:0; const me=P(session.id),p2=P(game.p2);
      finish({score:game.s1,won:w===1,stars:starsFor(game.s1,[80,150,220]),p2:{score:game.s2,won:w===2,stars:starsFor(game.s2,[80,150,220])},title:w===0?'It’s a tie! 🤝':(w===1?first(me):first(p2))+' wins! 🏆',text:`${first(me)} ${game.s1} – ${game.s2} ${first(p2)}`,badge:'🧱'}); }
    else if(game.mode==='cpu'){ finish({score,won:beatRobot,stars:starsFor(score,[80,150,220]),title:beatRobot?'You beat the Robot! 🤖🏆':(finished?'The Robot was faster… 🤖':'Run ended 🏁'),text:txt(run)+(finished?' Score '+score+'.':''),badge:beatRobot?'🏆':'🤖'}); }
    else finish({score,stars:starsFor(score,[80,150,220]),title:finished?cheer():'Run ended 🏁',text:txt(run)+' Score '+score+'.',badge:'🧱'});
  },finished?1200:50)); }

/* ---------- start ---------- */
if(session&&P(session.id)) view={name:'home'}; else session=null;
render();
</script>
